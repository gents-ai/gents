# Read by `scripts/ci/gate.py` for the archived test shards.
[store]
dir = "target/nextest"

# Shared by every profile: a flaky test is a defect to fix, never retried.
[profile.default]
retries = 0

[profile.ci]
retries = 0
fail-fast = false
# libtest under the gate reported a test after 60 s and killed it 600 s later.
slow-timeout = { period = "60s", terminate-after = 10 }
# Shards print every result so a log shows what ran; failures repeat at the end.
status-level = "pass"
final-status-level = "fail"
failure-output = "immediate-final"
success-output = "never"

[profile.ci.junit]
path = "junit.xml"
