hakari-package = "gents-workspace-hack"
dep-format-version = "4"
resolver = "2"
unify-target-host = "none"
platforms = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[final-excludes]
third-party = [
    { name = "tauri" },
    { name = "tauri-build" },
    { name = "tauri-macros" },
    { name = "tauri-utils" },
    { name = "objc2-app-kit" },
    { name = "defra-node", git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "7c6e16dc43a8c1928a16ec1c2d196b3b6a5369fc" },
]

# The Vera crates behind the opt-in `vera` feature, and vera-modules, which
# gents-store's tests also take for the creator Vera seeds genesis policies
# under. Left in, their feature sets would be unified into every test build.
# The revision is the DefraDB pin in Cargo.toml.
[traversal-excludes]
third-party = [
    { name = "vera-embedded", git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "7c6e16dc43a8c1928a16ec1c2d196b3b6a5369fc" },
    { name = "vera", git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "7c6e16dc43a8c1928a16ec1c2d196b3b6a5369fc" },
    { name = "vera-node", git = "https://github.com/sourcenetwork/vera.rs", rev = "f69d1b3747b65e3b3ff601958e856c574ac127e4" },
    { name = "vera-modules", git = "https://github.com/sourcenetwork/vera.rs", rev = "f69d1b3747b65e3b3ff601958e856c574ac127e4" },
]
