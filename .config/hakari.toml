hakari-package = "gents-workspace-hack"
dep-format-version = "4"
resolver = "2"
unify-target-host = "none"
platforms = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[final-excludes]
third-party = [
    { name = "tauri" },
    { name = "tauri-build" },
    { name = "tauri-macros" },
    { name = "tauri-utils" },
    { name = "objc2-app-kit" },
    { name = "defra-node", git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "4c1e893d27d78ae38428e3f164ccc6c8c1d071a5" },
]

# The Vera crates. `vera-embedded` and `vera-node` are behind the opt-in `vera`
# feature; DefraDB's `vera` client is in every build, since a client mints its
# delegations with it. Left in, their feature sets would be unified into every
# test build. The revision is the DefraDB pin in Cargo.toml.
[traversal-excludes]
third-party = [
    { name = "vera-embedded", git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "4c1e893d27d78ae38428e3f164ccc6c8c1d071a5" },
    { name = "vera", git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "4c1e893d27d78ae38428e3f164ccc6c8c1d071a5" },
    { name = "vera-node", git = "https://github.com/sourcenetwork/vera.rs", rev = "bf4a4352cd620d6b498508e2dbf768edcbf3392b" },
]
