hakari-package = "gents-workspace-hack"
dep-format-version = "4"
resolver = "2"
unify-target-host = "none"
platforms = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[final-excludes]
third-party = [
    { name = "tauri" },
    { name = "tauri-build" },
    { name = "tauri-macros" },
    { name = "tauri-utils" },
    { name = "objc2-app-kit" },
    { name = "defra-node", git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "5ca2e172ab964acc280c31ad5b15b12fdcf78ae0" },
]

# The Vera crates behind the opt-in `vera` feature. Left in, their feature sets
# would be unified into every test build. The revision is the DefraDB pin in
# Cargo.toml.
[traversal-excludes]
third-party = [
    { name = "vera-embedded", git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "5ca2e172ab964acc280c31ad5b15b12fdcf78ae0" },
    { name = "vera", git = "https://github.com/sourcenetwork/defradb.rs.git", rev = "5ca2e172ab964acc280c31ad5b15b12fdcf78ae0" },
    { name = "vera-node", git = "https://github.com/sourcenetwork/vera.rs", rev = "1367a56b2471bc379fd0e5522b8492d4b4b6e5d8" },
]
