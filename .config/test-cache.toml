# Read by scripts/ci/test_cache.py, the gate's test-result cache, whose
# soundness premises are in scripts/ci/test-cache/TestCache/Model.lean.
# Raising `version` invalidates every recorded result.
version = 1

# Premise (b): environment variables whose values enter every key. The tracer
# keys files and programs; it cannot see what a test reads from its environment.
[environment]
prefixes = ["GENTS_", "RUST_", "LEAN_", "CODEX_", "ANTHROPIC_", "OPENAI_", "XAI_"]
names = ["SSL_CERT_FILE", "SSL_CERT_DIR", "HTTPS_PROXY", "https_proxy", "HTTP_PROXY", "http_proxy",
         "NO_PROXY", "no_proxy", "ALL_PROXY", "TZ", "LANG", "LC_ALL"]
# CI plumbing that no test reads; keying it would split results by event and runner.
ignored_prefixes = ["GENTS_CI_", "RUSTC_WRAPPER"]

# Premise (a): tests whose outcome is not a function of their inputs. Each
# always runs. Remove an entry when its issue's fix makes the test model-backed
# or event-driven; a contradiction reported by a full run adds one.
