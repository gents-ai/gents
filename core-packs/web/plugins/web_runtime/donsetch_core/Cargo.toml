[package]
name = "donsetch_core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Portable DonSeTch extraction, search parsing/ranking, and crawl policy core"

[dependencies]
base64 = "0.23"
encoding_rs = "0.8.35"
pdf-extract = "0.12.1"
flate2 = "1"
regex = "1"
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"

[lib]
name = "donsetch_core"
path = "src/lib.rs"
