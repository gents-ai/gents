type DefendingFinding {
  run_id: String @index @immutable
  finding_id: String @index(unique: true) @immutable
  area_id: String @immutable
  category: String
  severity: String
  confidence: String
  path: String
  line: String
  title: String
  description: String
  exploit_scenario: String
  recommendation: String
  evidence: String
  verification: String
  preconditions: String
  access_level: String
  owner_hint: String
  threat_ids: String
  verdict: String
}
