[workspace]
members = ["donsetch_core"]
resolver = "2"

[package]
name = "web_runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.98"

[lib]
name = "web_runtime"
path = "src/lib.rs"

[[bin]]
name = "web_runtime"
path = "source/main.rs"

[dependencies]
base64 = "0.22"
donsetch_core = { path = "donsetch_core" }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
