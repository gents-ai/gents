[workspace]

[package]
name = "workflow"
version = "0.2.0"
edition = "2021"

[lib]
name = "workflow"
path = "source/lib.rs"

[[bin]]
name = "workflow"
path = "source/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
