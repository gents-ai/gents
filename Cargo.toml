[workspace]
resolver = "2"
members = [
    "crates/defra-agent",
    "crates/defra-agent-cli",
    "crates/defra-agent-desktop",
    "crates/defra-agent-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sourcenetwork/defra-agent"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crypto = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "044b4432" }
defra-agent-protocol = { path = "crates/defra-agent-protocol" }
defra-node = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "044b4432" }
defra-p2p-adapter = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "044b4432" }
dirs = "5"
eframe = "0.34.1"
egui = "0.34.1"
egui_commonmark = { version = "0.23.0", features = ["better_syntax_highlighting"] }
events = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "044b4432" }
hostname = "0.4"
identity = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "044b4432" }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
p2p = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "044b4432" }
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5.3.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-opentelemetry = { version = "0.32.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
debug = "line-tables-only"

[profile.dev-install]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[profile.dev.package."*"]
opt-level = 1

[profile.test]
opt-level = 1
debug = 0
split-debuginfo = "off"

[patch.crates-io]
rig-core = { git = "https://github.com/0xPlaygrounds/rig.git", rev = "1396480f66cf28a7c4542545f02ae97a8331114f" }
