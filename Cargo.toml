[workspace]
resolver = "2"
members = [
    "apps/gents-desktop/src-tauri",
    "crates/gents",
    "crates/gents-cli",
    "crates/gents-desktop",
    "crates/gents-desktop-core",
    "crates/gents-lean-contract",
    "crates/gents-lenses/agent_tool_call_lifecycle_v1_to_v2",
    "crates/gents-lenses/agent_subagent_v2_to_v3",
    "crates/gents-fs-runner",
    "crates/gents-protocol",
    "crates/gents-schemas",
]
# Patched noq 1.0.1 (gents#634) is pulled only via [patch.crates-io].
# Keep it out of the workspace so `cargo fmt --all` / workspace tests don't own
# upstream style; each crate has a local empty [workspace] for standalone tests.
exclude = [
    "third_party/noq",
    "third_party/noq-proto",
]
# Exclude the WASM lens crate from default workspace builds. Its cdylib target
# relies on `lens_sdk::define!` which imports an `extern "C" fn next()` only
# resolvable at WASM-load time by the lens host runtime. Build it explicitly
# via `cargo build -p agent-tool-call-lifecycle-v1-to-v2-lens --target
# wasm32-unknown-unknown`. The rlib target (used by tests via the
# default-features=false dev-dep) is unaffected.
default-members = [
    "apps/gents-desktop/src-tauri",
    "crates/gents",
    "crates/gents-cli",
    "crates/gents-desktop",
    "crates/gents-desktop-core",
    "crates/gents-protocol",
    "crates/gents-schemas",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/source-inc/gents"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
codex-app-server-protocol = { git = "https://github.com/openai/codex", rev = "c4e53d103c102f8d5201247adbc60bbddd47c88d" }
codex-arg0 = { git = "https://github.com/openai/codex", rev = "c4e53d103c102f8d5201247adbc60bbddd47c88d" }
codex-config = { git = "https://github.com/openai/codex", rev = "c4e53d103c102f8d5201247adbc60bbddd47c88d" }
codex-login = { git = "https://github.com/openai/codex", rev = "c4e53d103c102f8d5201247adbc60bbddd47c88d" }
codex-model-provider-info = { git = "https://github.com/openai/codex", rev = "c4e53d103c102f8d5201247adbc60bbddd47c88d" }
codex-protocol = { git = "https://github.com/openai/codex", rev = "c4e53d103c102f8d5201247adbc60bbddd47c88d" }
codex-tui = { git = "https://github.com/openai/codex", rev = "c4e53d103c102f8d5201247adbc60bbddd47c88d" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", rev = "c4e53d103c102f8d5201247adbc60bbddd47c88d" }
# defradb.rs v0.16.2 plus active-snapshot conflict retention and atomic
# RocksDB conflict-version/physical-snapshot pairing (#1162, #1167).
acp = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "ef772a439ec84d3fb1a7c0ef740085666ea008b4" }
crypto = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "ef772a439ec84d3fb1a7c0ef740085666ea008b4" }
defra-core = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "ef772a439ec84d3fb1a7c0ef740085666ea008b4" }
gents-protocol = { path = "crates/gents-protocol" }
gents-schemas = { path = "crates/gents-schemas" }
gents-desktop-core = { path = "crates/gents-desktop-core" }
gents-lean-contract = { path = "crates/gents-lean-contract" }
defra-node = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "ef772a439ec84d3fb1a7c0ef740085666ea008b4" }
defra-p2p-adapter = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "ef772a439ec84d3fb1a7c0ef740085666ea008b4" }
dirs = "5"
events = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "ef772a439ec84d3fb1a7c0ef740085666ea008b4" }
hostname = "0.4"
identity = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "ef772a439ec84d3fb1a7c0ef740085666ea008b4" }
# Must stay version-aligned with the iroh used by the defradb.rs `p2p` crate;
# the CLI uses it to inspect the default relay set at startup (#588).
iroh = "1"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde", "unstable_machinery"] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
p2p = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "ef772a439ec84d3fb1a7c0ef740085666ea008b4" }
query = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", rev = "ef772a439ec84d3fb1a7c0ef740085666ea008b4" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rig-core = "0.35.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-opentelemetry = { version = "0.32.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
# Shipped binaries stay compact. The macOS release workflow overrides this
# while linking, extracts a matching dSYM, then strips before signing.
strip = true
overflow-checks = true
debug = "line-tables-only"

[profile.dev-install]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[profile.dev.package."*"]
opt-level = 1

[profile.test]
opt-level = 1
debug = 0
split-debuginfo = "off"
incremental = false

[patch.crates-io]
# crossterm/ratatui forks mirror codex-rs's [patch.crates-io]: codex-tui needs
# them, and cargo does not carry patch sections across git dependencies.
crossterm = { git = "https://github.com/nornagon/crossterm", rev = "87db8bfa6dc99427fd3b071681b07fc31c6ce995" }
ratatui = { git = "https://github.com/nornagon/ratatui", rev = "9b2ad1298408c45918ee9f8241a6f95498cdbed2" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
# rig-core fork: upstream rig's OpenAI provider drops reasoning from vLLM-style
# servers. The Responses streaming decoder only handles OpenAI's hosted
# `response.reasoning_summary_text.delta`; vLLM streams the raw chain-of-thought
# as `response.reasoning_text.delta`, which rig has no variant for (also a
# `reasoning` vs `reasoning_content` mismatch on Chat Completions). Without the
# fork our Responses-API reasoning capture is silently empty.
rig-core = { git = "https://github.com/sourcenetwork/rig", rev = "1ebeeaee3b569bb6e242e000c11df1ed2c0cca90" }
# noq 1.0.1 crash-fixes until n0-computer/noq ships a release with #732 + #743 + #723:
# - proto: discard late packets for paths whose state has already been abandoned
# - proto: edge-trigger Draining on terminal state (duplicate stateless reset)
# - endpoint: don't panic in EndpointDriver::Drop on a poisoned mutex
# - endpoint: fence active_connections underflow on duplicate Draining
# See third_party/README.md, defradb.rs#1090, and gents#634.
noq = { path = "third_party/noq" }
noq-proto = { path = "third_party/noq-proto" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
