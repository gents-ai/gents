[package]
name = "gents-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DefraDB access, identity and schema owners for Gents"

[features]
default = ["defra-node/http", "defra-node/p2p", "defra-node/wasmtime-runtime"]
typescript = ["gents-loop/typescript", "gents-protocol/typescript"]
live-e2e = []
test-home-guard = []
test-fixtures = ["test-home-guard", "axum/ws"]

[dependencies]
acp.workspace = true
schema.workspace = true
storage.workspace = true
db.workspace = true
document.workspace = true
rapidhash = { workspace = true }
anyhow.workspace = true
axum = "0.8"
async-stream = "0.3"
async-trait = "0.1"
base64.workspace = true
chrono.workspace = true
crypto.workspace = true
cursor.workspace = true
defra-core.workspace = true
defra-http.workspace = true
defra-p2p-adapter.workspace = true
gents-loop = { workspace = true, features = ["native"] }
gents-protocol.workspace = true
gents-migration = { path = "../gents-migration" }
defra-node.workspace = true
dirs.workspace = true
events.workspace = true
futures = "0.3"
eventsource-stream = "0.2.3"
lens.workspace = true
identity.workspace = true
k256 = { version = "0.13", default-features = false }
libc = "0.2"
query.workspace = true
rand.workspace = true
regolith = "0.2.4"
serde.workspace = true
serde_json.workspace = true
regex = "1"
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-native-roots"] }
uuid.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
gents-lean-contract.workspace = true
gents-lean-vocab.workspace = true
