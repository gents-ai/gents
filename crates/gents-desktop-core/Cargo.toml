[package]
name = "gents-desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable desktop client runtime for Gents"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
async-trait = "0.1"
blake3 = "1"
bs58 = "0.5"
chrono.workspace = true
crypto.workspace = true
gents = { path = "../gents" }
gents-store = { workspace = true }
gents-documents = { workspace = true }
gents-inference = { workspace = true }
gents-p2p = { workspace = true }
gents-session = { workspace = true }
gents-tools = { workspace = true }
gents-toolcalls = { workspace = true }
gents-automation = { workspace = true }
gents-observe = { workspace = true }
gents-loop = { workspace = true }
gents-migration = { path = "../gents-migration" }
gents-protocol.workspace = true
defra-node = { workspace = true, features = ["http", "p2p"] }
defra-p2p-adapter.workspace = true
dirs.workspace = true
events.workspace = true
futures = "0.3"
identity.workspace = true
p2p.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rapidhash = { workspace = true }
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# ts-rs is the source-of-truth generator for the desktop bridge wire contract
# (see gents-desktop-bridge). DesktopInitSummary is exported from here.
ts-rs = { version = "10.1", default-features = false, features = [
    "serde-compat",
    "chrono-impl",
    "no-serde-warnings",
] }
uuid.workspace = true

[features]
typescript = ["gents/typescript"]
# Test seams for downstream crates' tests; never enabled by production builds.
test-fixtures = []

[dev-dependencies]
gents-workspace-hack = { workspace = true }
gents-automation = { workspace = true, features = ["test-fixtures"] }
# Enables the served-runtime fixture for this crate's integration tests.
gents-desktop-core = { path = ".", features = ["test-fixtures", "typescript"] }
gents = { path = "../gents", features = ["test-fixtures", "typescript"] }
defra-core.workspace = true
tokio = { workspace = true, features = ["test-util"] }
gents-lean-contract.workspace = true
gents-lean-vocab.workspace = true
wiremock = "0.6"
