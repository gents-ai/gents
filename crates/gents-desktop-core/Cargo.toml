[package]
name = "gents-desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable desktop client runtime for Gents"
autotests = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
async-trait = "0.1"
blake3 = "1"
gents-store = { workspace = true }
gents-protocol.workspace = true
defra-node.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tracing.workspace = true
ts-rs = { version = "10.1", default-features = false, features = [
    "serde-compat",
    "no-serde-warnings",
] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
workers.workspace = true

[features]
typescript = ["gents-protocol/typescript"]
# Test seams for downstream crates' tests; never enabled by production builds.
test-fixtures = []

[dev-dependencies]
axum = "0.8"
gents-workspace-hack = { workspace = true }
gents-store = { workspace = true, features = ["test-fixtures"] }
gents-desktop-core = { path = ".", features = ["test-fixtures", "typescript"] }
defra-core.workspace = true
tokio = { workspace = true, features = ["test-util"] }
gents-lean-contract.workspace = true
gents-lean-vocab.workspace = true
wiremock = "0.6"
workers.workspace = true
