type DatastoreToolSurface @branchable @index(fields: ["agent_did", "surface_id"], unique: true) {
    surface_id: String @index
    agent_did: String @index
    display_name: String
    enabled: Boolean @index
    # Canonical write/query declarations stored as native JSON values.
    entries: JSON
    created_at: String
    updated_at: DateTime @index(direction: DESC)
    tags: [String]
}
