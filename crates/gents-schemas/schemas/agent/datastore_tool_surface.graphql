type DatastoreToolSurface @branchable @index(fields: ["node_did", "surface_id"], unique: true) {
    surface_id: String @index
    node_did: String @index
    display_name: String
    enabled: Boolean @index
    entries: JSON
    created_at: String
    updated_at: DateTime @index(direction: DESC)
    tags: [String]
}
