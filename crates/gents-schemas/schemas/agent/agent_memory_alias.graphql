type AgentMemoryAlias
  @policy(id: "$household", resource: "agent_memory", parentField: "agent_doc_id")
  @index(fields: ["agent_did", "agent_doc_id", "from_problem_key"]) {
    from_problem_key: String @index(unique: true)
    agent_did: String @index @immutable
    agent_doc_id: String @index @immutable
    to_problem_key: String
    request_id: String
    created_at: DateTime
}
