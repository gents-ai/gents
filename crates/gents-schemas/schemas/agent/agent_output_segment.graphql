# Canonical durable output (#1571): a flush, source closure, or both. Decode
# through gents_protocol::output::OutputSegment. Terminal-only records have no
# ordinal, no runs and no payload; they cannot collide with a late data flush.
type AgentOutputSegment @branchable {
    node_did: String @index @immutable
    requester_did: String @index @immutable
    session_id: String @index @immutable
    request_doc_id: String @index @immutable
    # OutputSource as strict JSON: provider_turn / tool_call / tool_effect_arguments / authored.
    source: JSON @immutable
    # Null on terminal-only records; otherwise dense from zero within the source.
    ordinal: Int @immutable
    # OutputWriter: request_execution or tool_execution.
    writer: JSON @immutable
    # [SegmentRun]: {stream, bytes, declaration?} slices of payload, in arrival order.
    runs: JSON @immutable
    payload: String @immutable
    # SourceClose: closed {outcome, segments, stream_bytes} or retracted. Null
    # on ordinary flushes. Every record has a flush, close, or both.
    close: JSON @immutable
    created_at: String @immutable
}
