# Canonical durable output (#1571). One immutable, create-only flush of a
# source; the only place model, tool, or authored content bytes are stored, and
# the only record of streaming progress. Decode through
# gents_protocol::output::OutputSegment.
#
# Coordinate: (request_doc_id, source, ordinal). One document per flush however
# many streams advanced. Enumerate all twins through the ordinary request index;
# identical replay is idempotent, differing writer/runs/payload is a conflict.
# No separately stored synthetic key.
#
# Indexes are deliberately few: every index adds per-commit keys, and segments
# are the highest-volume collection. Live, sealed and lease reads are all
# request_doc_id scans; session_id serves replication routing and hydration.
type AgentOutputSegment @branchable {
    agent_did: String @index @immutable
    requester_did: String @index @immutable
    session_id: String @index @immutable
    request_doc_id: String @index @immutable
    # OutputSource as strict JSON: provider_turn / tool_call / authored.
    source: JSON @immutable
    ordinal: Int @immutable
    # OutputWriter: request_execution or tool_execution.
    writer: JSON @immutable
    # [SegmentRun]: {stream, bytes, declaration?} slices of payload, in arrival
    # order. The run that opens a stream carries its StreamDeclaration.
    runs: JSON @immutable
    payload: String @immutable
    created_at: String @immutable
}
