# Oversized tool-output spill document. Tool-result observers use this spill's
# own _docID plus the exact AgentToolCall join below, never a content/time
# merge heuristic or a link to AgentSession. Retired: conversation_doc_id (the
# spill writer does not populate it, and it duplicated the session link).
#
# Copy identity for forks: the exact call association below is required, so a
# copied spill keeps its child call link after the fork remap; blanking the
# field or matching by tool name/input/time is not a valid copy.
type AgentToolResult @branchable {
    # Exact AgentToolCall document whose oversized output was spilled here.
    tool_call_doc_id: String @index @immutable
    agent_did: String @index @immutable
    requester_did: String @index @immutable
    session_id: String @index
    tool_name: String @index
    tool_input: String
    output_text: String
    truncated: Boolean
    truncation_metadata: String
    created_at: String @index
    # True if the result never reached the model (interrupted before delivery).
    discarded_because_interrupted: Boolean
}
