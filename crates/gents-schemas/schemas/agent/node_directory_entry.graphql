# Fleet-discovery directory: one row per (source DID, node DID) on this home,
# maintained by the directory projection reconciler (issue #714, modeled in
# Proofs/PeerRegistryDiscovery/DirectoryProjection.lean).
#
# TRUST BASIS — pure derived state. Rows are a projection of
# Node x Agent x NodeReadiness, rebuildable at any time; clients treat them as
# read-only truth about the machine's fleet. A row grants NOTHING: discovery
# is not a privilege boundary (a conversation-paired member can already
# address any agent in the home); the directory only reveals what exists.
#
# `@branchable` is REQUIRED: the machine template replicates this collection
# to attached clients — DefraDB only P2P-syncs branchable collections.
type NodeDirectoryEntry @branchable {
    # Deterministic hash of (source_did, node_did). DefraDB unique indexes
    # are per-field, so this is the persisted source-partitioned identity.
    directory_key: String @index(unique: true) @immutable
    node_did: String @index
    # DID of the runtime that derived this row. Machine replication filters
    # on this field, and each projector reconciles only its own partition.
    # @immutable is REQUIRED: defradb rejects any replication-filter field
    # that is not immutable at add_replicator time (see migration.rs's
    # requester_did precedent) - and it is semantically immutable anyway,
    # being half of the directory_key identity hash.
    source_did: String @index @immutable
    display_name: String
    # Agent display names for the picker. Emitted as null (never []) when
    # the node has no agents - empty list literals corrupt nillable array
    # columns.
    agents: [String]
    # Agent ids, index-aligned with `agents` (ids[i] names[i]) so clients can
    # stamp AgentRequest.agent_id from a picked display name. Emitted as null
    # (never []) when empty - empty list literals corrupt nillable array
    # columns.
    agent_ids: [String]
    # The node's resolved default (from Node.default_agent_id), so clients can
    # badge threads bound to a NON-default agent; empty when the node has
    # none.
    default_agent_id: String
    runtime_state: String @index
    last_seen: DateTime
    updated_at: DateTime @index(direction: DESC)
}
