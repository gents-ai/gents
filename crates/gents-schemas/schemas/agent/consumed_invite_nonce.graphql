type ConsumedInviteNonce @branchable {
    # The single-use nonce of a pairing-invite token that has been redeemed by a
    # join. The unique index makes the join atomic with respect to replay: the
    # first join records the nonce; any later join presenting the same token
    # finds the nonce already present (or loses the race on this unique index)
    # and is rejected. Mirrors the Lean `consumedNonces` ledger and the
    # `replay_rejected` theorem in Proofs/PeerRegistryDiscovery.
    nonce: String @index(unique: true)
    issuer_did: String @index
    consumed_at: String
    # For bearer-claim burns only: the DID the nonce was bound to at admission.
    # Re-processing the same claim (crash between the burn and the grant write)
    # stays admissible for this claimant and repairs idempotently, while any
    # other claimant presenting the nonce is rejected. Null for DID-bound v5
    # joins, whose ledger row is written on the joiner instead.
    claimant_did: String @index
}
