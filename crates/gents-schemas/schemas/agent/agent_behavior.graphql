type AgentBehavior @branchable @index(fields: ["agent_did", "behavior_id"], unique: true) {
    behavior_id: String
    agent_did: String @index
    display_name: String
    description: String
    context_id: String @index
    inference_profile_id: String @index
    enabled: Boolean @index
    tags: [String!]
    created_at: String
    updated_at: DateTime @index(direction: DESC)
}
