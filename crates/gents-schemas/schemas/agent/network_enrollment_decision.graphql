# Admin-authored immutable terminal decision for one exact request digest;
# denial never materializes membership or routes.
type NetworkEnrollmentDecision @policy(id: "ac7d6625bfe087880ab77635e5da9c48fe1ee5f9152748018a63c0d9a75ceb70", resource: "enrollment_records") @branchable {
    protocol_version: Int @immutable
    decision_id: String @index(unique: true) @immutable
    request_id: String @index(unique: true) @immutable
    request_digest: String @index @immutable
    network_id: String @index @immutable
    admin_did: String @index @immutable
    candidate_did: String @index @immutable
    candidate_peer: String @index @immutable
    owner_node_did: String @index @immutable
    decision: String @index @immutable
    authorization_sequence: Int @immutable
    authorization_expires_at: DateTime @immutable
    decided_at: DateTime @immutable
    signer_did: String @index @immutable
    admin_sig: String @immutable
}
