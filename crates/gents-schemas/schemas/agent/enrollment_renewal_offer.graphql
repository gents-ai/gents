# Owner-signed fresh offer answering one renewal intent.
type EnrollmentRenewalOffer @policy(id: "$household", resource: "enrollment_records") @branchable {
    initial_reader_did: String @immutable
    intent_id: String @index(unique: true) @immutable
    member_did: String @index @immutable
    offer_token: String @immutable
    expires_at: DateTime @index @immutable
    admin_did: String @immutable
    admin_sig: String @immutable
}
