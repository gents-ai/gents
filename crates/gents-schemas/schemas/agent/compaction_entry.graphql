type CompactionEntry @branchable {
    compaction_key: String @index(unique: true)
    session_id: String @index
    agent_did: String @index @immutable
    requester_did: String @index @immutable
    request_id: String @index
    request_doc_id: String @index @immutable
    sequence: Int @index
    summary: String
    files_read: String
    files_modified: String
    messages_compacted: Int
    # Canonical AgentMessage.sequence cursor through which this entry's
    # cumulative compacted provider prefix is known to project. Null on legacy
    # entries and whenever the runtime cannot prove the raw/provider split.
    compacted_through_sequence: Int
    original_tokens: Int
    compacted_tokens: Int
    created_at: DateTime
}
