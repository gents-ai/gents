type NodeRuntime @branchable {
    node_did: String @index(unique: true)
    reconcile_phase: String @index
    agent_executor_capacity: Int
    agent_executor_queue_depth: Int
    agent_executor_status_json: String
    last_reconcile_result: String @index
    last_reconcile_error: String
    last_reconcile_completed_at: String @index
    updated_at: String @index(direction: DESC)
}
