type AgentMemoryAttempt
  @policy(id: "$household", resource: "agent_memory", parentField: "agent_doc_id")
  @index(fields: ["agent_did", "agent_doc_id", "attempt_key"])
  @index(fields: ["agent_did", "agent_doc_id", "problem_key", "created_at"]) {
    attempt_key: String @index(unique: true)
    agent_did: String @index @immutable
    agent_doc_id: String @index @immutable
    problem_key: String @index
    what: String @fulltext
    rationale: String
    targets: JSON
    predicted: JSON
    accepted: Boolean
    provenance: JSON
    carried_from: String @index
    source_attempt_key: String
    request_id: String
    session_id: String
    created_at: DateTime @index(direction: DESC)
}
