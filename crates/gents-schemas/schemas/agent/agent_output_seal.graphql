# The one terminal fact about an output source (#1571). Immutable, create-only,
# payload-free. Decode as gents_protocol::output::OutputSeal.
#
# Written once by the source's existing request/tool owner, in the transaction
# that writes the source's last segment: either closed with the exact extent of
# every stream, or retracted. A source with no visible seal is still open (or
# its seal has not replicated yet). At most one seal per
# (request_doc_id, source); enumerate twins, never last-write-wins.
#
# AgentMessage blocks reference a seal by its _docID plus a stream number, so a
# seal's identity pins the content it names.
type AgentOutputSeal @branchable {
    agent_did: String @index @immutable
    requester_did: String @index @immutable
    session_id: String @index @immutable
    request_doc_id: String @index @immutable
    # OutputSource as strict JSON: provider_turn / tool_call / authored.
    source: JSON @immutable
    # OutputWriter: request_execution or tool_execution.
    writer: JSON @immutable
    # SealDisposition: closed { outcome, streams: [{segments, bytes}] } / retracted.
    disposition: JSON @immutable
    created_at: String @immutable
}
