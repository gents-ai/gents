type Skill @branchable @index(fields: ["node_did", "skill_id"], unique: true) {
    skill_id: String @index
    node_did: String @index
    name: String @index
    description: String
    instructions: String
    source_directory: String
    tool_refs: [String!]
    display_name: String
    interface_json: String
    enabled: Boolean @index
    created_at: String
    updated_at: DateTime @index(direction: DESC)
    tags: [String]
}
