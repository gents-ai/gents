# Tool-call lifecycle document (#1571). Carries execution state only. The
# model's arguments are output of the provider turn and the tool's output is
# its own stream, both stored once as AgentOutputSegment and referenced from
# AgentMessage blocks by this document's _docID. Retired: args, result,
# partial_output_tail, partial_output_seq, and the AgentToolResult spill
# collection (full output is the stream; narrowing is a PayloadPresentation).
#
# Accepted provider turns create pending rows atomically with their Complete
# seal and assistant header before dispatch. Partial diagnostic headers may
# name only terminal, nondispatchable rows. Dispatch/recovery read arguments
# through the message block and recheck existing lifecycle authorization;
# there is no argument copy or reference here.
type AgentToolCall @branchable {
    tool_call_key: String @index(unique: true)
    request_id: String @index @immutable
    request_doc_id: String @index @immutable
    session_id: String @index
    agent_did: String @index @immutable
    requester_did: String @index @immutable
    message_sequence: Int
    tool_name: String @index
    tool_call_id: String @index @immutable
    # Persistence/delivery state. A terminal failed tool may still use
    # "completed" here once its result or background notification is durable.
    status: String
    # Authoritative execution outcome: pending, awaitingApproval, running,
    # completed, failed, timedOut, or cancelled.
    lifecycle_state: String @index
    started_at: DateTime
    deadline_at: DateTime
    completed_at: DateTime
    selected_service_id: String
    selected_tool_name: String
    tool_failure_class: String
    denial_reason: String
    denied_argv: [String]
    denied_command: String
    denied_argument: String
    denied_subcommand: String
    denied_prefix: [String]
    policy_mode: String
    policy_network: String
    latency_ms: Int
    await_mode: String
    cancel_policy: String
    cancel_cause: String
    child_request_id: String @index @immutable
    spawn_target_did: String @index @immutable
    unclaimed_deadline_at: DateTime
    cancel_cascade_intent_at: DateTime
    cancel_pending_remote_ack: Boolean
    stuck_since: DateTime
    completion_notification_delivered_at: DateTime
}
