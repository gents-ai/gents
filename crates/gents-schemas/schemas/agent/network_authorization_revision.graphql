# Append-only admin authority for enrollment membership; the unique maximal
# sequence is authoritative and equal-sequence conflicts fail closed.
# Revocation is a tombstone; history is never deleted.
type NetworkAuthorizationRevision @policy(id: "202ce2df1b18d27183b29b653e2c06654178b2e79d4d6b93229d0c706380e71e", resource: "enrollment_records") @branchable {
    protocol_version: Int @immutable
    revision_id: String @index(unique: true) @immutable
    request_id: String @index @immutable
    request_digest: String @index @immutable
    network_id: String @index @immutable
    admin_did: String @index @immutable
    member_did: String @index @immutable
    member_peer: String @index @immutable
    owner_node_did: String @index @immutable
    sequence: Int @index @immutable
    authorization_expires_at: DateTime @immutable
    kind: String @index @immutable
    issued_at: DateTime @immutable
    signer_did: String @index @immutable
    admin_sig: String @immutable
}
