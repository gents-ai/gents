type ToolFileInventory @policy(id: "$tool_file_change", resource: "file_images") {
    tool_call_doc_id: String @index @immutable
    observation_doc_id: String @index @immutable
    request_doc_id: String @index @immutable
    node_did: String @index @immutable
    session_id: String @index @immutable
    requester_did: String @index @immutable
    changes: JSON @immutable
    verified_unchanged: Boolean @immutable
}
