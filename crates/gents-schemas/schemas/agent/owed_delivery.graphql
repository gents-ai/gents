# Runtime-owned record of a lifecycle delivery a must-commit transition owes a
# plugin whose staging was dropped (Lean `Hooks.OwedDelivery`). It holds
# identifiers and the event's scalars only; a redrive rebuilds the event from
# core's rows and runs as `actor_did`, never as the runtime.
type OwedDelivery @policy(id: "ac7d6625bfe087880ab77635e5da9c48fe1ee5f9152748018a63c0d9a75ceb70", resource: "owed_deliveries") {
    delivery_key: String @index(unique: true) @immutable
    node_did: String @index @immutable
    node_doc_id: String
    parent_linked: Boolean @index
    point: String @immutable
    plugin: String @immutable
    subject_kind: String @immutable
    subject_id: String @index @immutable
    subject_node_did: String @immutable
    actor_did: String @immutable
    terminal_state: String @immutable
    reason: String @immutable
    occurred_at: String @immutable
    halt_latch: String @immutable
    attempts: Int
    last_error: String
    settlement: String @index
    created_at: String @immutable
    updated_at: String @index(direction: DESC)
}
