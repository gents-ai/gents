# Signed root of one authenticated enrollment authority, owned by `admin_did`;
# `admin_sig` is the admin's signature over the defining fields.
# `@branchable` is required for exact enrollment-document delivery.
type Network @branchable {
    network_id: String @index(unique: true)
    admin_did: String @index
    display_name: String
    default_template: String
    created_at: String
    admin_sig: String
}
