# Maps a logical repository_id to this host's checkout. Local-only (NOT
# @branchable): never derive repository_id from a credential-bearing remote.
type RepositoryPlacement @policy(id: "59bf2d2a847c1ba27eb78e9de1b4299523ceb214345ffd97fde96d9b48e8daad", resource: "configuration") @index(fields: ["node_did", "repository_id"], unique: true) {
    repository_id: String @index
    node_did: String @index
    host_path: String
    enabled: Boolean @index
    updated_at: DateTime @index(direction: DESC)
    tags: [String]
}
