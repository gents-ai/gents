# Desired-state Afterburner planner artifact. `artifact_bytes` is standard base64 of the
# decoded .afb package (GraphQL String cannot carry raw NUL/non-UTF-8). `module_id`
# is content-addressed over (decoded bytes, canonical_args, abi_version).
# Resource limits deny execution; they do not mint capabilities.
type CallbackModule @branchable @index(fields: ["node_did", "module_id"], unique: true) {
    module_id: String
    node_did: String @index
    abi_version: Int
    artifact_bytes: String
    canonical_args: String
    signer_did: String @index
    provenance: String
    enabled: Boolean @index
    fuel_limit: Int
    memory_pages: Int
    max_input_bytes: Int
    max_output_bytes: Int
    tags: [String!]
}
