type AgentMemoryProblem
  @policy(id: "$household", resource: "agent_memory", parentField: "agent_doc_id")
  @index(fields: ["agent_did", "agent_doc_id", "created_at"])
  @index(fields: ["agent_did", "agent_doc_id", "problem_key"]) {
    problem_key: String @index(unique: true)
    agent_did: String @index @immutable
    agent_doc_id: String @index @immutable
    name: String @fulltext
    normalized_name: String
    embedding: [Float32!] @index(vector: {dimensions: 256, diskann: {R: 64, lBuild: 100, lSearch: 100, alphaPercent: 120, sampleBytes: 134217728, residentCodes: true}})
    embed_model_id: String
    opened_request_id: String
    opened_session_id: String
    provenance: JSON
    carried_from: String @index
    source_problem_key: String
    created_at: DateTime @index(direction: DESC)
}
