# Local receipt of the authority one explicit enrollment grant derived for its
# member (Lean `Identity.EnrollmentGrant.Receipt`). Native relations carry no
# provenance, so revocation withdraws exactly the recorded tuples. Deliberately
# NOT branchable: it accounts for this node's own relations only.
type NetworkEnrollmentGrant @policy(id: "5214e9adbbb9b355e4f18a31587c3592d67bf40567688584187bd3ea74bafd91", resource: "operations") {
    request_id: String @index(unique: true) @immutable
    member_did: String @index @immutable
    tuples: [String]
    granted_at: DateTime @immutable
    withdrawn_at: DateTime
    node_doc_id: String
    parent_linked: Boolean
}
