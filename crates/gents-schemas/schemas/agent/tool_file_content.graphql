type ToolFileContent @policy(id: "$tool_file_change", resource: "file_images") {
    node_did: String @index @immutable
    session_id: String @index @immutable
    tool_call_doc_id: String @index @immutable
    requester_did: String @index @immutable
    root: String @immutable
    path: String @immutable
    text: String @crdt(type: text)
    blob: Blob
}
