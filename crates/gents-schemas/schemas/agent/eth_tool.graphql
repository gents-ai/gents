type EthTool @branchable @index(fields: ["node_did", "tool_id"], unique: true) {
    tool_id: String
    node_did: String @index
    display_name: String
    enabled: Boolean @index
    chain_id: Int
    rpc_url: String
    rpc_timeout_secs: Int
    query_methods: [String]
    calls: [String]
    key_binding_id: String
    created_at: String
    tags: [String!]
    updated_at: DateTime
}
