type EthTool @branchable @index(fields: ["agent_did", "tool_id"], unique: true) {
    tool_id: String
    agent_did: String @index
    display_name: String
    enabled: Boolean @index
    # Logical endpoint: one chain + one HTTP JSON-RPC URL per document.
    chain_id: Int
    rpc_url: String
    rpc_timeout_secs: Int
    # Allowlisted read-only RPC methods. Empty/null = no query tool.
    query_methods: [String]
    # JSON-serialized call decls (any_read or declared). Empty/null = none.
    calls: [String]
    # ChainKeyBinding.binding_id this behavior may sign with. Null = read-only.
    key_binding_id: String
    created_at: String
    tags: [String!]
}
