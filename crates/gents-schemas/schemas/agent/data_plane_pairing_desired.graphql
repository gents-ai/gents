type DataPlanePairingDesired @policy(id: "$household", resource: "application_pairings") {
    peer_id: String @index(unique: true)
    node_did: String @index
    actor_did: String @index @immutable
    collections: [String!]
    replicator_addresses: [String!]
    template: String @index
    source: String @index
    created_at: DateTime @index(direction: DESC)
    updated_at: DateTime @index(direction: DESC)
    enrollment_member_did: String
    enrollment_sequence: Int
    enrollment_network_id: String
}
