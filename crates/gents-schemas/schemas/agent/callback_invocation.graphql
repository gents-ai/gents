# Frozen source input and origin survive planner retries; journals own recovery.
type CallbackInvocation @branchable
    @index(fields: ["owner_agent_did", "invocation_id"], unique: true)
    @index(fields: ["owner_agent_did", "idempotency_key"], unique: true) {
    invocation_id: String @immutable
    owner_agent_did: String @index @immutable
    callback_id: String @index @immutable
    origin: JSON @immutable
    input: JSON @immutable
    idempotency_key: String @immutable
    lifecycle_state: String @index
    attempts: Int
    action_plan: String
    action_journal: String
    error: String
    claimed_at: String
    created_at: String @index
}
