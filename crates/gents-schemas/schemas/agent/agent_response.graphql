# Response control document (#1571). Carries no output: content, reasoning,
# token_count, progress_seq and reasoning_progress_seq are retired. Streamed
# and final output are AgentOutputSegment facts; progress is the arrival of a
# segment, and usage belongs to InferenceCall.
#
# Design TODO: after tracing status / error / interruption / materialization
# consumers in the Lean and conformance layers, decide whether this document
# keeps a distinct control responsibility or its remaining facts move to the
# request lifecycle and AgentMessage.outcome. Do not predetermine deletion.
type AgentResponse @branchable {
    response_key: String @index(unique: true)
    request_id: String @index
    request_doc_id: String @index @immutable
    agent_did: String @index @immutable
    requester_did: String @index @immutable
    behavior_id: String @index
    session_id: String @index
    status: String @index
    error_message: String
    materialized_message_sequence: Int
    materialized_at: String
    created_at: String @index
    completed_at: String
    interrupted_at: String               # RFC3339; null for complete, non-null ⇒ interrupted
}
