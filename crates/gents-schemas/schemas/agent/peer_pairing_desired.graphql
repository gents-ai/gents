type PeerPairingDesired {
    peer_id: String @index(unique: true)
    node_did: String @index
    collections: [String!]!
    replicator_addresses: [String!]!
    profiles: [String!]
    template: String @index
    source: String @index
    enrollment_request_digest: String @index
    enrollment_authorization_sequence: Int @index
    enrollment_authorization_expires_at: DateTime @index
    created_at: DateTime @index(direction: DESC)
    updated_at: DateTime @index(direction: DESC)
}
