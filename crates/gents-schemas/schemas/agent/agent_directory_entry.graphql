# Fleet-discovery directory: one row per (source DID, agent DID) on this home,
# maintained by the directory projection reconciler (issue #714, modeled in
# Proofs/PeerRegistryDiscovery/DirectoryProjection.lean).
#
# TRUST BASIS — pure derived state. Rows are a projection of
# AgentPrincipal x AgentBehavior x AgentRuntime, rebuildable at any time;
# clients treat them as read-only truth about the machine's fleet. A row
# grants NOTHING: discovery is not a privilege boundary (a conversation-
# paired member can already address any agent in the home); the directory
# only reveals what exists.
#
# `@branchable` is REQUIRED: the machine template replicates this collection
# to attached clients — DefraDB only P2P-syncs branchable collections.
type AgentDirectoryEntry @branchable {
    # Deterministic hash of (source_did, agent_did). DefraDB unique indexes
    # are per-field, so this is the persisted source-partitioned identity.
    directory_key: String @index(unique: true) @immutable
    agent_did: String @index
    # DID of the runtime that derived this row. Machine replication filters
    # on this field, and each projector reconciles only its own partition.
    # @immutable is REQUIRED: defradb rejects any replication-filter field
    # that is not immutable at add_replicator time (see migration.rs's
    # requester_did precedent) - and it is semantically immutable anyway,
    # being half of the directory_key identity hash.
    source_did: String @index @immutable
    display_name: String
    # Behavior display names for the picker. Emitted as null (never []) when
    # the principal has no behaviors - empty list literals corrupt nillable
    # array columns.
    behaviors: [String]
    # Behavior ids, index-aligned with `behaviors` (ids[i] names[i]) so
    # clients can stamp AgentRequest.behavior_id from a picked display name.
    # Emitted as null (never []) when empty - empty list literals corrupt
    # nillable array columns.
    behavior_ids: [String]
    # The agent's resolved default (from AgentPrincipal.default_behavior_id),
    # so clients can badge threads bound to a NON-default behavior; empty
    # when the principal has none.
    default_behavior_id: String
    # Per-behavior persona dimensions, index-aligned with behavior_ids.
    # Entries: "backend_id|model_name". Null (never []) when empty.
    behavior_models: [String]
    # File tool root per behavior ("" = none/host default). Aligned; null never [].
    behavior_roots: [String]
    # Built-in preset name when the behavior's ToolSelection exactly matches
    # one (ignoring root); "" = custom. Aligned; null never [].
    behavior_presets: [String]
    # Inference profile id per behavior ("" = unset legacy rows). Aligned;
    # null never [].
    behavior_profiles: [String]
    # Home-level pickable options for the persona composer (same on every
    # row of a source). Null (never []) when empty.
    available_models: [String]
    allowed_roots: [String]
    permission_presets: [String]
    # "profile_id|display_name" pairs. Null (never []) when empty.
    available_profiles: [String]
    runtime_state: String @index
    last_seen: DateTime
    updated_at: DateTime @index(direction: DESC)
}
