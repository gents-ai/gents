# Single durable session document per `gents_protocol::session::AgentSession`.
# Absent requester scope grants no wildcard authority. Projection/listing
# orders by created_at then the logical session_id / request_id labels, never
# the physical document ID.
type AgentSession @branchable @index(fields: ["node_did", "session_id"], unique: true) {
    session_id: String @index @immutable
    node_did: String @index @immutable
    requester_did: String @index @immutable
    agent_id: String @index @immutable
    created_at: String @index @immutable
    closed_at: String @index
    title: JSON
    provenance: JSON
    observation: JSON
    tags: [String!]
    stopped_at: String @index
    archived_at: String @index
    archive_revision: Int
}
