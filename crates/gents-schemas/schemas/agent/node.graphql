type Node @branchable {
    node_did: String @index(unique: true)
    display_name: String
    default_agent_id: String @index
    enabled: Boolean @index
    created_at: String
    updated_at: DateTime @index(direction: DESC)
    created_by: String
    tags: [String]
    # Admission refuses a request whose request_hop (causal hop) exceeds
    # this bound; null means the default of 8.
    max_request_hop: Int
}
