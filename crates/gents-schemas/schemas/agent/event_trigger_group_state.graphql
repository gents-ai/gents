type EventTriggerGroupState @branchable {
    group_key: String @index(unique: true) @immutable
    trigger_id: String @index @immutable
    correlation: String @index @immutable
    trigger_config_key: String @index @immutable
    first_seen_at: DateTime @index @immutable
    quiesced_at: DateTime @index
    quiesced_reason: String
}
