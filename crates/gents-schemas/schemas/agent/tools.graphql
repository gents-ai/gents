type Tools @branchable @index(fields: ["node_did", "tools_id"], unique: true) {
    tools_id: String
    node_did: String @index
    display_name: String
    host: JSON
    remote: JSON
    agents: JSON
    built_ins: JSON
    datastore: JSON
    integrations: JSON
    self_config: JSON
    tags: [String!]
    updated_at: DateTime
}
