# Selects one shared event source and callback. Empty input_fields exposes no data.
type CallbackBinding @branchable @index(fields: ["node_did", "binding_id"], unique: true) {
    binding_id: String
    node_did: String @index
    event_source_id: String @index
    callback_id: String @index
    input_fields: [String!]
    enabled: Boolean @index
    tags: [String!]
}
