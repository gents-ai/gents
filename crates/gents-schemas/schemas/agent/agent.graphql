type Agent @branchable @index(fields: ["node_did", "agent_id"], unique: true) {
    agent_id: String
    node_did: String @index
    display_name: String
    description: String
    context_id: String @index
    inference_profile_id: String @index
    enabled: Boolean @index
    tags: [String!]
    created_at: String
    updated_at: DateTime @index(direction: DESC)
}
