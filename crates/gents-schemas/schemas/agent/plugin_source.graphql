# tests and installs. `tests` holds {"cases": [{input, expect}]}. The built
# artifact and its digest stay in the plugin store.
type PluginSource @policy(id: "ac7d6625bfe087880ab77635e5da9c48fe1ee5f9152748018a63c0d9a75ceb70", resource: "configuration") @index(fields: ["node_did", "plugin_id"], unique: true) {
    plugin_id: String @index
    node_did: String @index
    description: String
    language: String
    source: String
    input_schema: JSON
    data: JSON
    tests: JSON
    created_at: String
    updated_at: DateTime @index(direction: DESC)
    tags: [String]
}
