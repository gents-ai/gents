# A plugin's source held on the node: what `config plugin build` compiles,
# tests and installs. `tests` holds {"cases": [{input, expect}]}. The built
# artifact and its digest stay in the plugin store.
type PluginSource @policy(id: "fd59b3cc10193581adb497fd6d55c7e740f4866f720af6f18da780248ce26a5c", resource: "configuration") @index(fields: ["node_did", "plugin_id"], unique: true) {
    plugin_id: String @index
    node_did: String @index
    description: String
    language: String
    source: String
    input_schema: JSON
    data: JSON
    tests: JSON
    created_at: String
    updated_at: DateTime @index(direction: DESC)
    tags: [String]
}
