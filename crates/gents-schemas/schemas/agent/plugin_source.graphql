# A plugin's source held on the node: what `config plugin build` compiles,
# tests and installs. `tests` holds {"cases": [{input, expect}]}. The built
# artifact and its digest stay in the plugin store.
type PluginSource @policy(id: "5214e9adbbb9b355e4f18a31587c3592d67bf40567688584187bd3ea74bafd91", resource: "configuration") @index(fields: ["node_did", "plugin_id"], unique: true) {
    plugin_id: String @index
    node_did: String @index
    description: String
    language: String
    source: String
    input_schema: JSON
    data: JSON
    tests: JSON
    created_at: String
    updated_at: DateTime @index(direction: DESC)
    tags: [String]
}
