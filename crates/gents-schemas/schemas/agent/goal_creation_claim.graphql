type GoalCreationClaim @policy(id: "$household", resource: "children") @index(fields: ["session_doc_id", "creation_key"], unique: true) {
    creation_key: String @index @immutable
    goal_id: String @index @immutable
    session_id: String @index @immutable
    session_doc_id: String @index @immutable
    agent_did: String @immutable
    requester_did: String @index @immutable
    creator_did: String @index @immutable
    parent_linked: Boolean @index
    node_did: String @index @immutable
    objective: String @immutable
    token_budget: Int @immutable
    max_infrastructure_retries: Int @immutable
    created_at: String @index @immutable
}
