# A DID's self-published reachability record: the binding from a `did` (unique) to its current
# transport coordinates (`node_id`, `address`). `binding_sig` is the DID's own
# signature over the binding (did, node_id, address, updated_at), proving the
# endpoint owner published this record and binding the address to the DID.
# `@branchable` is REQUIRED: this collection replicates over P2P (the network
# exact authenticated routes can deliver it), and DefraDB only P2P-syncs
# branchable collections.
type PeerEndpoint @branchable {
    # This is both the endpoint identity and the client-specific bootstrap
    # replication route key; it must never change after document creation.
    did: String @index(unique: true) @immutable
    node_id: String
    address: String
    updated_at: String
    binding_sig: String
}
