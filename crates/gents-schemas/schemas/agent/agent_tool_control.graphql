type AgentToolControl @policy(id: "$household", resource: "children") @index(fields: ["client_did", "intent_id"], unique: true) {
    client_did: String @index @immutable
    intent_id: String @index @immutable
    intent_json: String @immutable
    agent_did: String @index @immutable
    node_did: String @index @immutable
    session_id: String @immutable
    session_doc_id: String @immutable
    requester_did: String @immutable
    request_doc_id: String @immutable
    tool_call_id: String @immutable
    tool_call_doc_id: String @immutable
    action: String @immutable
    state: String @index
    outcome_json: String
}
