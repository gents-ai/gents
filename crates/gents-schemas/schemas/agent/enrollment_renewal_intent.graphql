# Member-signed request for a fresh offer that renews one existing enrollment
# generation; it grants nothing until the owner's ordinary decision.
type EnrollmentRenewalIntent @policy(id: "fd59b3cc10193581adb497fd6d55c7e740f4866f720af6f18da780248ce26a5c", resource: "enrollment_records") @branchable {
    intent_id: String @index(unique: true) @immutable
    network_id: String @index @immutable
    admin_did: String @index @immutable
    server_peer: String @immutable
    member_did: String @index @immutable
    member_peer: String @immutable
    predecessor_sequence: Int @immutable
    issued_at: DateTime @immutable
    expires_at: DateTime @immutable
    nonce: String @immutable
    member_sig: String @immutable
}
