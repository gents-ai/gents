type AgentMemoryOutcome
  @policy(id: "$household", resource: "agent_memory", parentField: "agent_doc_id")
  @index(fields: ["agent_did", "agent_doc_id", "outcome_key"])
  @index(fields: ["agent_did", "agent_doc_id", "attempt_key", "created_at"]) {
    outcome_key: String @index(unique: true)
    agent_did: String @index @immutable
    agent_doc_id: String @index @immutable
    attempt_key: String @index
    fixed: JSON
    missed: JSON
    passed: Int
    total: Int
    note: String
    provenance: JSON
    carried_from: String @index
    source_outcome_key: String
    request_id: String
    created_at: DateTime @index(direction: DESC)
}
