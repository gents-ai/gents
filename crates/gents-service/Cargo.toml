[package]
name = "gents-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Home state, native service supervision and managed updates for the Gents runtime"

[features]
# Debug native desktop acceptance must never address the user's daily service.
native-e2e = []
test-home-guard = ["gents-store/test-home-guard"]

[dependencies]
gents = { path = "../gents" }
gents-store = { workspace = true }
gents-session = { workspace = true }
gents-desktop-core.workspace = true
gents-protocol.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
clap.workspace = true
hostname.workspace = true
identity.workspace = true
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
plist = "1.8"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "3"
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid.workspace = true
wait-timeout = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSBundle"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gents = { path = "../gents", features = ["test-home-guard"] }
