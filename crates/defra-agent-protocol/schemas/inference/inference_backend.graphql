type InferenceBackend {
    backend_id: String @index(unique: true)
    name: String @index
    provider_kind: String
    # OpenAI-compatible API base URL, including the /v1 path segment.
    endpoint: String
    # Optional raw API key for local or operator-managed deployments.
    api_key: String
    # Optional environment-variable reference for the backend API key.
    # Credentials are not stored directly in DefraDB documents.
    api_key_env_var: String
    max_concurrent: Int
    max_queue_depth: Int
    enabled: Boolean @index
    models: [String]
    last_probe: DateTime
    probe_status: String @index
}
