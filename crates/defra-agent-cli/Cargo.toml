[package]
name = "defra-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Consumer CLI for the defra-agent library"
autobins = false

[[bin]]
name = "defra-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono.workspace = true
clap.workspace = true
codex-app-server-protocol.workspace = true
codex-utils-absolute-path.workspace = true
defra-agent = { path = "../defra-agent" }
defra-native-fs-runner = { path = "../defra-native-fs-runner" }
defra-agent-protocol.workspace = true
defra-node.workspace = true
defra-p2p-adapter.workspace = true
futures-util = "0.3"
query.workspace = true
hostname.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
p2p.workspace = true
reqwest.workspace = true
rig-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
acp = { git = "ssh://git@github.com/sourcenetwork/defradb.rs.git", tag = "v0.13.1" }
defra-agent-lean-contract.workspace = true
identity.workspace = true
regex = "1"
tempfile = "3"
tokio-tungstenite = "0.26.2"
