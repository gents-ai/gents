[package]
name = "gents-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Claude Code 2.1.311 Messages API wire protocol, account rotation and OAuth protocol for Gents"

[dependencies]
base64.workspace = true
rand.workspace = true
rapidhash.workspace = true
serde.workspace = true
# Passthrough JSON (tool schemas, tool inputs) must keep its insertion order on
# the wire; do not rely on feature unification for that.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true
url = "2"
uuid.workspace = true

[dev-dependencies]
gents-lean-contract.workspace = true
