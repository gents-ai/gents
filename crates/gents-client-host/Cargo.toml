[package]
name = "gents-client-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless native host for Gents clients"

[features]
runtime-e2e = []
editor-e2e = ["runtime-e2e"]

[[test]]
name = "runtime"
required-features = ["runtime-e2e"]

[dependencies]
gents-service.workspace = true
anyhow.workspace = true
async-trait = "0.1"
bytes.workspace = true
blake3 = "1"
clap.workspace = true
futures = "0.3"
gents = { path = "../gents" }
gents-store = { workspace = true }
gents-documents = { workspace = true }
gents-inference = { workspace = true }
gents-pack = { workspace = true }
gents-session = { workspace = true }
gents-tools = { workspace = true }
gents-automation = { workspace = true }
gents-observe = { workspace = true }
gents-loop = { workspace = true }
gents-server = { package = "gents-cli", path = "../gents-cli", default-features = false }
gents-host.workspace = true
gents-desktop-core.workspace = true
gents-protocol.workspace = true
gents-desktop-bridge = { path = "../gents-desktop-bridge", default-features = false }
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt", "codec"] }
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
gents = { path = "../gents", features = ["test-home-guard"] }
defra-node.workspace = true
chrono.workspace = true
reqwest.workspace = true
uuid.workspace = true
rapidhash.workspace = true
bs58 = "0.5"
axum = "0.8"
futures-util = "0.3"
tempfile = "3"
base64.workspace = true

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
