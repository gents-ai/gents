[package]
name = "gents-fs-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Out-of-process native filesystem runner for Gents"
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
# Hidden `--block-*` flags and the in-process traversal blocker used by race
# tests. Off in every non-test build; the dev-dependency below enables it for
# this crate's tests.
test-seams = []

[dependencies]
anyhow.workspace = true
globset = "0.4"
ignore = "0.4"
regex = "1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gents-fs-runner = { path = ".", features = ["test-seams"] }
