[package]
name = "gents-fs-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Out-of-process native filesystem runner for Gents"
autotests = false

[features]
# The traversal blocker race tests use, in process and through the runner's
# hidden `--block-*` flags. Enabled only from dev-dependencies.
test-fixtures = []

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
anyhow.workspace = true
globset = "0.4"
ignore = "0.4"
regex = "1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gents-fs-runner = { path = ".", features = ["test-fixtures"] }

