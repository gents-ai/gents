[package]
name = "gents-lean-vocab"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Test helper decoding the conformance snapshot the Gents Lean models emit"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
gents-lean-contract.workspace = true
gents-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
acp.workspace = true
identity.workspace = true
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
tokio.workspace = true

[[example]]
name = "decoders_from_snapshot"
path = "examples/decoders_from_snapshot/main.rs"
