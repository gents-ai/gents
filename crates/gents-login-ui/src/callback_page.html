<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{title}} · Gents</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #111; color: #eee;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid; place-items: center; padding: 28px; }
    main { width: min(100%, 520px); }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 40px;
      font-size: 19px; letter-spacing: -.03em; }
    svg { width: 36px; height: 28px; color: #ceffcb; }
    .card { padding: clamp(24px, 6vw, 44px); border: 1px solid #3c493b;
      border-radius: 24px; background: #222; }
    .eyebrow { color: #ceffcb; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font: 400 clamp(34px, 8vw, 46px)/1.15 Georgia, serif; letter-spacing: -.025em;
      margin: 22px 0 20px; }
    p { margin: 0; color: #b9b9b9; }
    .detail { margin-top: 26px; padding-top: 22px; border-top: 1px solid #3a3a3a;
      font-size: 13px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <!-- Official four-block Gents mark, matching the desktop shell. -->
      <svg viewBox="0 0 810 579" fill="currentColor" aria-hidden="true">
        <path d="M346.89 462.851H694.215V578.571H346.831V462.851H231.09V347.146H346.89V462.851Z"/>
        <path d="M810 347.146H578.416V231.426H810V347.146Z"/>
        <path d="M346.875 115.72V231.426H0V115.706L346.875 115.72Z"/>
        <path d="M694.215 0V115.706L346.875 115.72L346.89 0H694.215Z"/>
      </svg>
      <span>Gents</span>
    </div>
    <section class="card" aria-labelledby="title">
  <div class="eyebrow">Gents account connection</div>
      <h1 id="title">{{title}}</h1>
      <p>{{note}}</p>
      {{details}}
    </section>
  </main>
</body>
</html>
