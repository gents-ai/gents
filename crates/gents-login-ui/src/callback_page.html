<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}} · Gents</title>
  <style>
    {{fonts}}
    :root { --bg: #f2f2f2; --heading: #283f2d; --text: #1c1c1c; --muted: #737373;
      --ink: #283f2d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111111; --heading: #ffffff; --text: #e4e4e4; --muted: #a0a0a0;
        --ink: #f2f2f2; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: 32px; background: var(--bg); color: var(--text);
      font: 14px/1.5 "Inter Variable", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    main { width: min(100%, 448px); display: grid; gap: 32px; }
    svg { display: block; height: 16px; width: auto; color: var(--ink); }
    .copy { display: grid; gap: 8px; }
    h1 { margin: 0; color: var(--heading);
      font: 500 24px/1.33 "Lora Variable", Georgia, serif; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 810 579" fill="currentColor" role="img" aria-label="Gents">
      <path d="M346.89 462.851H694.215V578.571H346.831V462.851H231.09V347.146H346.89V462.851Z"/>
      <path d="M810 347.146H578.416V231.426H810V347.146Z"/>
      <path d="M346.875 115.72V231.426H0V115.706L346.875 115.72Z"/>
      <path d="M694.215 0V115.706L346.875 115.72L346.89 0H694.215Z"/>
    </svg>
    <section class="copy" aria-labelledby="title">
      <h1 id="title">{{title}}</h1>
      <p>{{note}}</p>
    </section>
  </main>
</body>
</html>
