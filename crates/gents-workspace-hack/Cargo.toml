# Regenerate the section below with `cargo hakari generate` after changing a
# third-party dependency or its features; `cargo hakari generate --diff` fails
# while it is stale.

[package]
name = "gents-workspace-hack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Third-party feature unification for per-crate test builds, managed by cargo hakari"
publish = false

