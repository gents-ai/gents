[package]
name = "gents-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sessions and the request lifecycle for Gents"

[features]
default = ["defra-node/http", "defra-node/p2p", "defra-node/wasmtime-runtime"]
typescript = ["gents-loop/typescript", "gents-protocol/typescript", "gents-store/typescript", "gents-documents/typescript", "gents-inference/typescript", "gents-p2p/typescript"]
live-e2e = ["gents-store/live-e2e", "gents-documents/live-e2e", "gents-inference/live-e2e", "gents-p2p/live-e2e"]
test-home-guard = ["gents-store/test-home-guard", "gents-documents/test-home-guard", "gents-inference/test-home-guard", "gents-p2p/test-home-guard"]
test-fixtures = ["test-home-guard", "dep:gents-lean-vocab", "gents-store/test-fixtures", "gents-documents/test-fixtures", "gents-inference/test-fixtures", "gents-p2p/test-fixtures"]

[dependencies]
# Decoder of Lean-generated cases; compiled in only for test-fixtures.
gents-lean-vocab = { workspace = true, optional = true }
gents-store.workspace = true
gents-documents.workspace = true
gents-inference.workspace = true
gents-p2p.workspace = true
acp.workspace = true
schema.workspace = true
storage.workspace = true
db.workspace = true
document.workspace = true
rapidhash = { workspace = true }
anyhow.workspace = true
async-stream = "0.3"
async-trait = "0.1"
base64.workspace = true
bs58 = "0.5"
caseless = "0.2.2"
unicode-normalization = "0.1.25"
chrono.workspace = true
crypto.workspace = true
cursor.workspace = true
defra-core.workspace = true
gents-loop = { workspace = true, features = ["native"] }
gents-protocol.workspace = true
gents-migration = { path = "../gents-migration" }
defra-node.workspace = true
events.workspace = true
futures = "0.3"
identity.workspace = true
libc = "0.2"
query.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rig-core.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tokio-util = "0.7"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
gents-store = { workspace = true, features = ["test-fixtures"] }
gents-documents = { workspace = true, features = ["test-fixtures"] }
gents-inference = { workspace = true, features = ["test-fixtures"] }
gents-p2p = { workspace = true, features = ["test-fixtures"] }
gents-lean-contract.workspace = true
gents-lean-vocab.workspace = true

[build-dependencies]
cc = "1"
