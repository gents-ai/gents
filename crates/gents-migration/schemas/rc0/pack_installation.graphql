type PackInstallation @index(fields: ["node_did", "coordinate"], unique: true) {
    node_did: String @index @immutable
    coordinate: String @index @immutable
    version: String
    digest: String @index
    documents: JSON
    plugins: JSON
    history: JSON
    installed_at: String
    required_by: JSON
    explicit: Boolean
    plugin_store: Boolean
}
