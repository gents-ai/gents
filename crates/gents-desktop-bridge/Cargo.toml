[package]
name = "gents-desktop-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri plugin and desktop bridge logic for Gents"
links = "tauri-plugin-gents-desktop-bridge"
build = "build.rs"

[features]
default = ["tauri-host"]
tauri-host = ["dep:tauri", "dep:tauri-plugin", "dep:tauri-plugin-fs"]
# Compiles real native-E2E command bodies (still double-gated by debug_assertions
# + GENTS_NATIVE_E2E=1). Never in default; app forwards for E2E launchers only.
native-e2e = ["tauri-host", "gents-server/native-e2e"]

[[test]]
name = "home_isolation"
required-features = ["tauri-host"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
base64.workspace = true
blake3 = "1"
chrono.workspace = true
dirs.workspace = true
futures = "0.3"
gents = { path = "../gents", features = ["typescript"] }
gents-server = { package = "gents-cli", path = "../gents-cli", default-features = false, features = ["typescript"] }
gents-chatgpt-login.workspace = true
gents-claude-login.workspace = true
gents-desktop-core = { workspace = true, features = ["typescript"] }
gents-protocol = { workspace = true, features = ["typescript"] }
hostname.workspace = true
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
rapidhash = { workspace = true }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing.workspace = true
webbrowser = "1"
tracing-subscriber.workspace = true
# ts-rs is the source-of-truth generator for the public desktop request/view
# contract. serde-compat handles rename_all and tagged enums
# (RenderedTimelineItem) without hand-written mirror types.
ts-rs = { version = "10.1", default-features = false, features = [
    "serde-compat",
    "serde-json-impl",
    "chrono-impl",
    "no-serde-warnings",
] }
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"], optional = true }

[dev-dependencies]
crypto.workspace = true
identity.workspace = true
syn = { version = "2", features = ["full"] }
heck = "0.5"
async-trait = "0.1"
wiremock = "0.6"
gents-desktop-core = { workspace = true, features = ["test-fixtures"] }
gents-lean-contract.workspace = true
tauri = { version = "2", features = ["test"] }
tempfile = "3"
toml.workspace = true
