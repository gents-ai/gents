use_default_settings:
  engines:
    keep_only:
      - bing
      - fynd
      - privacywall
      - wikipedia
      - arxiv
      - crossref
      - google scholar
      - openalex
      - openairepublications
      - pubmed
      - github
      - mdn
      - stackoverflow
      - crates.io
      - microsoft learn

server:
  secret_key: "gents-live-web-research-not-for-production"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20

plugins:
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true

engines:
  - name: bing
    disabled: false
  - name: fynd
    disabled: false
  - name: privacywall
    disabled: false
  - name: wikipedia
    disabled: false
  - name: arxiv
    disabled: false
  - name: crossref
    disabled: false
  - name: google scholar
    disabled: false
  - name: openalex
    disabled: false
  - name: openairepublications
    disabled: false
  - name: pubmed
    disabled: false
  - name: github
    disabled: false
  - name: mdn
    disabled: false
  - name: stackoverflow
