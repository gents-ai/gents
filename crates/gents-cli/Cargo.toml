[package]
name = "gents-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the Gents runtime"
autobins = false

[lib]
name = "gents_server"
path = "src/lib.rs"

[[bin]]
name = "gents"
path = "src/main.rs"

[features]
# Gates the live-inference test binary out of default builds: every test in
# cli_live_suite is #[ignore]d behind env gates, so default runs paid a
# full gents+defradb+iroh link to execute nothing.
live-e2e = []

# All other test binaries are auto-discovered; this explicit target overrides
# autodiscovery for cli_live_suite so its link only happens on live runs
# (`cargo test -p gents-cli --features live-e2e --test cli_live_suite -- --ignored`).
[[test]]
name = "cli_live_suite"
path = "tests/cli_live_suite.rs"
required-features = ["live-e2e"]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
bs58 = "0.5"
chrono.workspace = true
ciborium = "0.2"
clap.workspace = true
gents-chatgpt-login.workspace = true
gents-claude-login.workspace = true
gents-codex-protocol.workspace = true
gents = { path = "../gents" }
gents-fs-runner = { path = "../gents-fs-runner" }
gents-protocol.workspace = true
defra-node.workspace = true
defra-p2p-adapter.workspace = true
futures-util = "0.3"
flate2 = "1"
ignore = "0.4"
iroh.workspace = true
query.workspace = true
hostname.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
p2p.workspace = true
regex = "1"
reqwest.workspace = true
rmcp = { version = "1.2.0", features = [
    "server",
    "transport-streamable-http-server",
    "macros",
    "client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde_yaml.workspace = true
subtle.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url = "2"
tempfile = "3"

# `gents pack build` (src/commands/pack/build.rs) compiles a tool's source
# through Afterburner's own compiler rather than growing a second one:
# `dispatch_compile` already covers every language Afterburner supports
# (JS/TS via Javy, Ruby via wasi-vfs, Python to an emscripten-pyodide
# bundle, Rust/Go/C/C++ via their native toolchains). `cli::compile` sits
# behind the `bin` feature. Pinned to the same rev as the afterburner-*
# crates in crates/gents/Cargo.toml so all of them agree on the
# `.afb`/`Manifold` wire shapes.
afterburner = { git = "https://github.com/afterburner-sh/afterburner.git", rev = "e771746d32f1323b0746080393d659fe36d2670a", default-features = false, features = [
    "bin",
] }
# The package loader `dispatch_compile` expects (`pkg::LocalPackage`):
# `burn compile` loads a tool's source the same way, so this reuses that
# loader instead of hand-rolling a second `afb.toml` reader.
#
# Pinned to the same rev as `afterburner` above: `dispatch_compile` takes a
# `pkg::LocalPackage` from this crate, and two instances of it at different
# revs are different types to the compiler.
afterburner-cloud = { git = "https://github.com/afterburner-sh/afterburner.git", rev = "e771746d32f1323b0746080393d659fe36d2670a" }

[dev-dependencies]
acp.workspace = true
async-trait = "0.1"
gents-desktop-core.workspace = true
gents-lean-contract.workspace = true
identity.workspace = true
jsonschema = { version = "0.46.5", default-features = false }
tokio-tungstenite = "0.26.2"
