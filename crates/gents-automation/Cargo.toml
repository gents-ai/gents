[package]
name = "gents-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Triggers, callbacks and goals for Gents"

[features]
default = ["defra-node/http", "defra-node/p2p", "defra-node/wasmtime-runtime"]
typescript = ["dep:ts-rs", "gents-loop/typescript", "gents-protocol/typescript", "gents-store/typescript", "gents-documents/typescript", "gents-inference/typescript", "gents-p2p/typescript", "gents-pack/typescript", "gents-session/typescript", "gents-tools/typescript", "gents-toolcalls/typescript"]
live-e2e = ["gents-store/live-e2e", "gents-documents/live-e2e", "gents-inference/live-e2e", "gents-p2p/live-e2e", "gents-pack/live-e2e", "gents-session/live-e2e", "gents-tools/live-e2e", "gents-toolcalls/live-e2e"]
test-home-guard = ["gents-store/test-home-guard", "gents-documents/test-home-guard", "gents-inference/test-home-guard", "gents-p2p/test-home-guard", "gents-pack/test-home-guard", "gents-session/test-home-guard", "gents-tools/test-home-guard", "gents-toolcalls/test-home-guard"]
test-fixtures = ["dep:rig-core", "dep:gents-lean-vocab", "test-home-guard", "axum/ws", "gents-store/test-fixtures", "gents-documents/test-fixtures", "gents-inference/test-fixtures", "gents-p2p/test-fixtures", "gents-pack/test-fixtures", "gents-session/test-fixtures", "gents-tools/test-fixtures", "gents-toolcalls/test-fixtures"]

[dependencies]
rig-core = { workspace = true, optional = true }
gents-lean-vocab = { workspace = true, optional = true }
gents-store.workspace = true
gents-documents.workspace = true
gents-inference.workspace = true
gents-p2p.workspace = true
gents-pack.workspace = true
gents-session.workspace = true
gents-tools.workspace = true
gents-toolcalls.workspace = true
acp.workspace = true
schema.workspace = true
db.workspace = true
document.workspace = true
rapidhash = { workspace = true }
ts-rs = { version = "10.1", optional = true, default-features = false, features = ["serde-compat", "no-serde-warnings"] }
anyhow.workspace = true
axum = "0.8"
async-trait = "0.1"
base64.workspace = true
bs58 = "0.5"
chrono.workspace = true
crypto.workspace = true
defra-core.workspace = true
gents-loop = { workspace = true, features = ["native"] }
gents-protocol.workspace = true
defra-node.workspace = true
events.workspace = true
futures = "0.3"
identity.workspace = true
query.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio-util = "0.7"
tempfile = "3"

[dev-dependencies]
gents-automation = { path = ".", features = ["test-fixtures"] }
gents-store = { workspace = true, features = ["test-fixtures"] }
gents-documents = { workspace = true, features = ["test-fixtures"] }
gents-inference = { workspace = true, features = ["test-fixtures"] }
gents-p2p = { workspace = true, features = ["test-fixtures"] }
gents-pack = { workspace = true, features = ["test-fixtures"] }
gents-session = { workspace = true, features = ["test-fixtures"] }
gents-tools = { workspace = true, features = ["test-fixtures"] }
gents-toolcalls = { workspace = true, features = ["test-fixtures"] }
axum = { version = "0.8", features = ["ws"] }
gents-lean-contract.workspace = true
gents-lean-vocab.workspace = true
reqwest.workspace = true
gents-callback-fixture-create-workspace = { path = "../gents-callbacks/fixture_create_workspace" }
