# A member's standing in a network. Mirrors the Lean `Membership` entity
# (Proofs/PeerRegistryDiscovery/NetworkMembership.lean; design spec §9): the
# membership set keyed by (network_id, member_did). The Lean `status`↔`active`
# bridge is `m.active = (status == "active")`. `membership_key` is the
# derived composite key (DefraDB `@index(unique)` is per-field, so the
# (network_id, member_did) pair is hashed into one unique field, mirroring
# `AgentMessage.message_key`). `status` is "active" | "revoked". `admin_sig` is
# the admin's signature over the grant/revoke (network_id, member_did, status,
# granted_at/revoked_at), proving the admin authorized this membership change.
# `@branchable` is REQUIRED: replicates over P2P (members receive admin-signed
# grants/tombstones). DefraDB only P2P-syncs branchable collections.
type NetworkMembership @branchable {
    membership_key: String @index(unique: true)
    network_id: String @index
    member_did: String @index
    status: String
    granted_at: String
    revoked_at: String
    admin_sig: String
}
