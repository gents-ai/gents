# A candidate's request to join a network. Mirrors the cut-1 Lean `JoinRequest`
# entity, keyed by (network_id, candidate_did). `request_key` is the derived
# composite key (DefraDB `@index(unique)` is per-field, so the pair is hashed
# into one unique field, mirroring `AgentMessage.message_key`). `status` is
# informational ("pending"); the authoritative grant lives in NetworkMembership.
# `req_sig` is the candidate's signature over the request (network_id,
# candidate_did, candidate_node_id, candidate_address, requested_at), proving the
# candidate authored this join request.
type NetworkJoinRequest {
    request_key: String @index(unique: true)
    network_id: String @index
    candidate_did: String @index
    candidate_node_id: String
    candidate_address: String
    requested_at: String
    status: String
    req_sig: String
}
