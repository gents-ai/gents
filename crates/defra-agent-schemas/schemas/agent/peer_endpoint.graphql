# A DID's self-published reachability record. Mirrors the Lean `Endpoint`
# entity (Proofs/PeerRegistryDiscovery/NetworkMembership.lean; design spec §9):
# the binding from a `did` (unique) to its current
# transport coordinates (`node_id`, `address`). `binding_sig` is the DID's own
# signature over the binding (did, node_id, address, updated_at), proving the
# endpoint owner published this record and binding the address to the DID.
# `@branchable` is REQUIRED: this collection replicates over P2P (the network
# reconciler materializes the membership mesh from replicated endpoints), and
# DefraDB only P2P-syncs branchable collections (they carry the Merkle-DAG
# commit history sync needs). Without it, `add_replicator`/`add_p2p_collections`
# cannot move these rows between nodes.
type PeerEndpoint @branchable {
    did: String @index(unique: true)
    node_id: String
    address: String
    updated_at: String
    binding_sig: String
}
