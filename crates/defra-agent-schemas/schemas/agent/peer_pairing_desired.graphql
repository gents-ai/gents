type PeerPairingDesired {
    peer_id: String @index(unique: true)
    agent_did: String @index
    collections: [String!]!
    replicator_addresses: [String!]!
    profiles: [String!]
    source: String @index
    created_at: DateTime @index(direction: DESC)
    updated_at: DateTime @index(direction: DESC)
}
