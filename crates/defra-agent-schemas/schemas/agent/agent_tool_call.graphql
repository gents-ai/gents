type AgentToolCall @branchable {
    tool_call_key: String @index(unique: true)
    request_id: String @index
    session_id: String @index
    agent_did: String @index @immutable
    requester_did: String @index @immutable
    message_sequence: Int
    tool_name: String @index
    tool_call_id: String @index
    args: String
    result: String
    status: String
    lifecycle_state: String @index
    started_at: DateTime
    deadline_at: DateTime
    completed_at: DateTime
    selected_service_id: String
    selected_tool_name: String
    tool_failure_class: String
    denial_reason: String
    denied_argv: [String]
    denied_command: String
    denied_argument: String
    denied_subcommand: String
    denied_prefix: [String]
    policy_mode: String
    policy_network: String
    latency_ms: Int
    await_mode: String
    cancel_policy: String
    cancel_cause: String
    child_request_id: String @index
    spawn_target_did: String @index @immutable
    workflow_group_id: String @index
    workflow_role: String @index
    unclaimed_deadline_at: DateTime
    cancel_cascade_intent_at: DateTime
    cancel_pending_remote_ack: Boolean
    stuck_since: DateTime
}
