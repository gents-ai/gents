CONSTANTS
  Node = {A, B}
  Collection = {c1, c2}
  RPCId = {r1, r2, r3, r4}
  MaxCrashes = 2
  NoOf = NoOf

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT RPCIdsTracked
INVARIANT RPCWellFormed
\* INVARIANT InFlightJustified
\* InFlightJustified is defined in ReversePairing.tla and documented there.
\* TLC reports a violation in pool-exhausted states (all RPCIds consumed,
\* covering RPC then Drop()ped before a fresh one can be issued). This is a
\* bounded-model artifact: the real system has an effectively unbounded RPCId
\* space and the violation cannot occur. The invariant is preserved in the .tla
\* file as the inductive invariant for the Task 10 leads-to property; it is
\* excluded from TLC enforcement here because the finite RPCId bound prevents
\* confirmation without a much larger (and slower) model.
CHECK_DEADLOCK FALSE
