\* Dialable = FALSE models THE BUG: the reconciler dials an address that
\* resolves to no reachable direct addr (a listen-form / under-specified
\* ticket under no-relay + no-discovery), so DialSucceed is never enabled. The
\* connection loops Connecting -> Failed -> Redial -> ... and never reaches
\* Connected, so InstallReplicator is never enabled and the replicator never
\* installs.
\*
\* EXPECTED RESULT: TLC reports a LIVENESS VIOLATION on ReplicatorLiveness
\* (`<>replicatorInstalled`) and returns the stuck trace. That counterexample
\* IS the live failure ("PeerPairingApplied with subscribed collections but
\* null replicator_addresses"), reproduced by the model. The safety invariants
\* still hold (the failure is purely liveness). This config is a diagnostic
\* demonstration, not a passing check.
CONSTANTS
  Dialable = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PartialApplyHasProgress
INVARIANT ReplicationImpliesReplicator
PROPERTY ReplicatorLiveness
CHECK_DEADLOCK FALSE
