\* Dialable = FALSE models MODE A — the LITERAL #511 fleet hang. The reconciler
\* dials a ticket that resolves to no reachable direct addr (a listen-form /
\* under-specified ticket under no-relay + no-discovery), so DialSucceed is
\* never enabled. The connection loops Connecting -> Failed -> Redial -> ... and
\* NEVER reaches Connected. In the real engine, connect() is a connect-FIRST
\* hard gate (`?` before the diff), so nothing is subscribed and NO
\* PeerPairingApplied row is written at all; the sweep logs "tick failed" and
\* retries every 30s forever. The model matches this: `subscribed` stays FALSE.
\*
\* NOTE: this is NOT the "subscribed collections, null replicator_addresses"
\* partial row — that is MODE B/C (connect OK, replicator install fails), modeled
\* by MCPairingTransportReplicatorStuck (ReplicatorInstallable = FALSE).
\*
\* EXPECTED RESULT: invariants HOLD (PartialApplyHasProgress is vacuous here —
\* the Connected+subscribed state is never reached); TLC reports a LIVENESS
\* VIOLATION on ReplicatorLiveness (`<>replicatorInstalled`) and returns the
\* never-Connected stuck trace. A diagnostic demonstration, not a passing check.
CONSTANTS
  Dialable = FALSE
  ReplicatorInstallable = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PartialApplyHasProgress
INVARIANT ReplicationImpliesReplicator
PROPERTY ReplicatorLiveness
CHECK_DEADLOCK FALSE
