\* Dialable = TRUE models the shareable-address fix: the dialed address resolves
\* to a reachable direct addr, so DialSucceed is enabled and (under SF) the
\* connection eventually establishes. Expected result: all properties HOLD —
\* the replicator installs and a document flows end-to-end.
\*
\* CHECK_DEADLOCK FALSE: the converged terminal state (Connected, subscribed,
\* replicatorInstalled, docsReplicated, no further enabled action) is a normal
\* fixed point, not a bug.
CONSTANTS
  Dialable = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT PartialApplyHasProgress
INVARIANT ReplicationImpliesReplicator
PROPERTY ReplicatorLiveness
PROPERTY EndToEndLiveness
CHECK_DEADLOCK FALSE
