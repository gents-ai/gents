[package]
name = "defra-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable DefraDB-backed agent framework extracted from agent-daemon"

[features]
default = ["defra-node/http", "defra-node/p2p", "rocksdb"]
rocksdb = ["defra-node/rocksdb"]

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
chrono.workspace = true
crypto.workspace = true
defra-node.workspace = true
dirs.workspace = true
events.workspace = true
futures = "0.3"
glob = "0.3"
hostname.workspace = true
identity.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
rig-core = "0.31"
reqwest.workspace = true
rmcp = { version = "1.2.0", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
