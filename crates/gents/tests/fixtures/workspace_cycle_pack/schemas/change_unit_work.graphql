type ChangeUnitWork {
  work_unit_id: String @index(unique: true) @immutable
  repository_id: String @immutable
  base_sha: String @immutable
  branch: String @immutable
  title: String @immutable
  instructions: String @immutable
  owned_files: String @immutable
  status: String @index @immutable
  caused_by_correlation: String @index @immutable
}
