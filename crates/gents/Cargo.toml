[package]
name = "gents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core DefraDB-backed agent runtime for Gents"

[features]
# Gents executes Lens migrations at runtime, so keep Wasmtime explicit while
# omitting DefraDB's SourceHub ACP and legacy libp2p defaults.
default = [
    "defra-node/http",
    "defra-node/p2p",
    "defra-node/wasmtime-runtime",
]
typescript = ["dep:ts-rs", "gents-loop/typescript", "gents-protocol/typescript", "gents-store/typescript", "gents-documents/typescript", "gents-inference/typescript", "gents-p2p/typescript", "gents-pack/typescript", "gents-session/typescript", "gents-tools/typescript", "gents-toolcalls/typescript", "gents-automation/typescript", "gents-observe/typescript"]
# Gates the optional live-inference collection out of default builds.
live-e2e = ["gents-store/live-e2e", "gents-documents/live-e2e", "gents-inference/live-e2e", "gents-p2p/live-e2e", "gents-pack/live-e2e", "gents-session/live-e2e", "gents-tools/live-e2e", "gents-toolcalls/live-e2e", "gents-automation/live-e2e", "gents-observe/live-e2e"]
# Test builds refuse to resolve the operator's real Gents homes; enabled only
# through dev-dependencies, never by production builds.
test-home-guard = ["gents-store/test-home-guard", "gents-documents/test-home-guard", "gents-inference/test-home-guard", "gents-p2p/test-home-guard", "gents-pack/test-home-guard", "gents-session/test-home-guard", "gents-tools/test-home-guard", "gents-toolcalls/test-home-guard", "gents-automation/test-home-guard", "gents-observe/test-home-guard"]
# Native fixtures for downstream conformance tests; never enabled in production.
test-fixtures = ["dep:gents-lean-vocab", "test-home-guard", "axum/ws", "gents-store/test-fixtures", "gents-documents/test-fixtures", "gents-inference/test-fixtures", "gents-p2p/test-fixtures", "gents-pack/test-fixtures", "gents-session/test-fixtures", "gents-tools/test-fixtures", "gents-toolcalls/test-fixtures", "gents-automation/test-fixtures", "gents-observe/test-fixtures"]

# All other test binaries are auto-discovered; this explicit target overrides
# autodiscovery for e2e_live so the link only happens on live runs
# (`cargo test -p gents --features live-e2e --test e2e_live -- --ignored`).
[[test]]
name = "e2e_live"
path = "tests/e2e_live.rs"
required-features = ["live-e2e"]

[dependencies]
# Decoder of Lean-generated cases; compiled in only for test-fixtures.
gents-lean-vocab = { workspace = true, optional = true }
gents-store.workspace = true
gents-documents.workspace = true
gents-inference.workspace = true
gents-p2p.workspace = true
gents-pack.workspace = true
gents-session.workspace = true
gents-tools.workspace = true
gents-toolcalls.workspace = true
gents-automation.workspace = true
gents-observe.workspace = true
acp.workspace = true
schema.workspace = true
storage.workspace = true
db.workspace = true
document.workspace = true
rapidhash = { workspace = true }
ts-rs = { version = "10.1", optional = true, default-features = false, features = ["serde-compat", "no-serde-warnings"] }
anyhow.workspace = true
# Trial homes serve Agent identity provisioning beside DefraDB's own routes.
axum = "0.8"
async-stream = "0.3"
async-trait = "0.1"
# RS256 for Google service account assertions; the same build rustls already links.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
base64.workspace = true
bs58 = "0.5"
bytes.workspace = true
caseless = "0.2.2"
unicode-normalization = "0.1.25"
chrono.workspace = true
chrono-tz.workspace = true
crypto.workspace = true
cursor.workspace = true
defra-core.workspace = true
defra-http.workspace = true
defra-p2p-adapter.workspace = true
gents-fs-runner = { path = "../gents-fs-runner" }
gents-claude = { workspace = true, features = ["transport"] }
gents-loop = { workspace = true, features = ["native"] }
gents-protocol.workspace = true
gents-migration = { path = "../gents-migration" }
defra-node.workspace = true
dirs.workspace = true
events.workspace = true
futures = "0.3"
eventsource-stream = "0.2.3"
hostname.workspace = true
lens.workspace = true
identity.workspace = true
k256 = { version = "0.13", default-features = false }
libc = "0.2"
minijinja.workspace = true
opentelemetry.workspace = true
p2p.workspace = true
query.workspace = true
rand.workspace = true
regolith = "0.2.4"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
same-file = "1.0.6"
serde_yaml.workspace = true
regex = "1"
schemars = "1"
jsonschema = { version = "0.46.5", default-features = false }
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-native-roots"] }
uuid.workspace = true
rig-core.workspace = true
reqwest = { workspace = true, features = ["stream"] }
reqwest-provider = { package = "reqwest", version = "0.13", default-features = false }
rmcp = { version = "1.2.0", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio-util = "0.7"
tempfile = "3"
memmap2 = "0.9"
kovan-map = "0.2.2"

# The pack container (src/pack/archive.rs). A pack travels as a
# gzip-compressed tar; `tar`/`flate2` build and read it.
tar = "0.4"
flate2 = "1"

# The pack store's name index (src/pack/store.rs): orders a name's stored
# versions to resolve a bare `namespace/name` to its highest one.
semver = "1"

# `afterburner_afb::Afb` parses a plugin's compiled `.afb` (src/pack/archive.rs
# reads a pack's declared assets, one of which may be a plugin's artifact;
# src/plugin.rs parses that artifact to classify it before ever running it).
afterburner-afb = { git = "https://github.com/afterburner-sh/afterburner.git", rev = "f6d6d3faa0be201603cc8c6a8b1a2bc9f756caa1" }
afterburner-core = { git = "https://github.com/afterburner-sh/afterburner.git", rev = "f6d6d3faa0be201603cc8c6a8b1a2bc9f756caa1" }
# The plugin runner (src/plugin.rs): runs a plugin's compiled `.afb` via
# Afterburner's own `afb_run::run_afb_bytes`, the library entry point built
# for an embedder that needs to run a package without the `burn` CLI's
# registry-client weight (`bin` feature, pulled in separately by
# `gents-cli`). Pinned to the same rev as the other afterburner-* crates
# above so all of them always agree on the `.afb`/`Manifold` wire shapes.
afterburner = { git = "https://github.com/afterburner-sh/afterburner.git", rev = "f6d6d3faa0be201603cc8c6a8b1a2bc9f756caa1", default-features = false, features = [
    "afb-run",
] }
# The workerless runtime a plugin's WASI host calls run on (src/plugin/wasi_runtime.rs);
# afterburner's WASI host drives its futures on nuclei.
nuclei = { version = "0.5.6", default-features = false }
# `wasmtime::Caller` for the host imports a declaring plugin may call (`plugin/host_imports.rs`);
# the version follows the one afterburner pins so the lockfile holds a single wasmtime.
wasmtime = { version = "49", default-features = false, features = ["runtime"] }


[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
tracing-oslog = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Integration tests link the library with its fixtures.
gents = { path = ".", features = ["test-fixtures"] }
gents-store = { workspace = true, features = ["test-fixtures"] }
gents-documents = { workspace = true, features = ["test-fixtures"] }
gents-inference = { workspace = true, features = ["test-fixtures"] }
gents-p2p = { workspace = true, features = ["test-fixtures"] }
gents-pack = { workspace = true, features = ["test-fixtures"] }
gents-session = { workspace = true, features = ["test-fixtures"] }
gents-tools = { workspace = true, features = ["test-fixtures"] }
gents-toolcalls = { workspace = true, features = ["test-fixtures"] }
gents-automation = { workspace = true, features = ["test-fixtures"] }
gents-observe = { workspace = true, features = ["test-fixtures"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
oxc_allocator = "=0.127.0"
oxc_ast = "=0.127.0"
oxc_ast_visit = "=0.127.0"
oxc_parser = "=0.127.0"
oxc_span = "=0.127.0"
axum = { version = "0.8", features = ["ws"] }
defra-node.workspace = true
proptest = "1"
shlex = "1.3"
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
gents-lean-contract.workspace = true
gents-lean-vocab.workspace = true
gents-callback-fixture-create-workspace = { path = "../gents-callbacks/fixture_create_workspace" }
syn = { version = "2", features = ["full", "visit"] }
wat = "1.254"

[build-dependencies]
cc = "1"
