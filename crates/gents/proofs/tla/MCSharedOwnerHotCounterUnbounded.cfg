\* GREEN. Conflicts repeat with no attempt bound: Regolith's first-committer
\* rule alone keeps the writers progressing, so no interleaving livelocks.
\* EXPECTED: every invariant and EveryCallSettles hold.
CONSTANTS
  Writers = {w1, w2, w3}
  Iters = 2
  Attempts = 4
  Capacity = 2
  BoundedRetry = FALSE
  CanTimeout = FALSE
  CheckDeadline = FALSE
  Deadline = 0
  ReadOutsideTxn = FALSE
  StaleRetry = FALSE
  ConflictAsSuccess = FALSE
  RetryAmbiguous = FALSE
  LostWakeup = FALSE
  AbortOnOpenWriter = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AckedApplied
INVARIANT ConflictNotApplied
INVARIANT NoDoubleApply
INVARIANT NoLostUpdate
INVARIANT TestAccounting
INVARIANT PermitsAccounted
PROPERTY EveryCallSettles
CHECK_DEADLOCK FALSE
