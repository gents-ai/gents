\* RED by design. The processor appends only the first visible bytes and
\* ignores the writer's due verdict for later ones; the writer counts them
\* flushed, so no deadline is armed for them either.
\* EXPECTED: NoWithheldDuringPause VIOLATED.
CONSTANTS
  Chunks <- MCChunks
  FlushTimer = TRUE
  AppendOnDue = FALSE
  WakeOnAppStore = TRUE
  Budget = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoWithheldDuringPause
CHECK_DEADLOCK FALSE
