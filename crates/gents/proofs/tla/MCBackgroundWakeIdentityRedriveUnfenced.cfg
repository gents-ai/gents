\* expect: violates OneWake
\* The notifier writes no document the redrive writes: the ungated redrive
\* and a notifier that both saw no wake each create one.
CONSTANTS
  Notifiers = {n1, n2, n3}
  Gate = TRUE
  ReadConflicts = FALSE
  MaxAttempts = 2
  Deadline = 2
  ObserveAtClaim = TRUE
  Redrive = TRUE
  SessionWrite = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT SetupNotRefused
INVARIANT OneWake
INVARIANT SameIdentity
INVARIANT NoneFailed
PROPERTY EveryNotifierAnswered
CHECK_DEADLOCK FALSE
