\* RED: run() reads only once its listener resolves. With registration not
\* fair the first read never starts and 'Opening session' stays with no action.
\* EXPECTED: NoStuckPending VIOLATED.
CONSTANTS
  MaxVersion = 2
  ListenFailures = 1
  Mismatches = 1
  Selections = 1
  RereadBudget = 2
  InitialRead = FALSE
  FullAfterListen = TRUE
  Relisten = TRUE
  PendingReread = TRUE
  MismatchExit = TRUE

SPECIFICATION SpecListenerUnfair
INVARIANT TypeOK
INVARIANT MovedReadQueued
PROPERTY NoStuckPending
CHECK_DEADLOCK FALSE
