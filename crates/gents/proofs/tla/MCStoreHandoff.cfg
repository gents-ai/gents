\* GREEN. The stop, retire or quit is acknowledged only after the lock is
\* free; beginning to stop declares it in the lock file; an acquirer waits
\* for a declared release within its deadline and is refused at once by a
\* serving holder; the kernel drops the lock of a holder that exits.
\* EXPECTED: every invariant and property holds.
CONSTANTS
  H = h
  Acquirers = {a1, a2}
  AckAfterRelease = TRUE
  MarkReleasing = TRUE
  WaitOnReleasing = TRUE
  BoundedWait = TRUE
  KernelReleasesOnExit = TRUE
  CanCrash = TRUE
  CanHang = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NeverTwoHolders
INVARIANT AckFollowsRelease
INVARIANT AckedHandoff
INVARIANT RefusalNamesLiveHolder
INVARIANT CrashedHolderNeverBlocks
PROPERTY AcquirerSettles
PROPERTY WaiterTakesReleasedStore
PROPERTY StopAcknowledged
CHECK_DEADLOCK FALSE
