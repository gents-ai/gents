\* expect: holds
\* GREEN. The stop, retire or quit is acknowledged only after the lock is
\* free; beginning to stop declares it in the lock file; an acquirer waits
\* for a declared release within its deadline and is refused at once by a
\* serving holder; the kernel drops the lock of a holder that exits. The store
\* lock is released only once the engine's directory lock is free (regolith
\* keeps it after close until the engine drops), the shutdown releases the
\* claim whoever else shares the node's gate, and whoever acknowledges lets go
\* of its node handles first.
\* EXPECTED: every invariant and property holds.
CONSTANTS
  H = h
  Acquirers = {a1, a2}
  AckAfterRelease = TRUE
  MarkReleasing = TRUE
  WaitOnReleasing = TRUE
  BoundedWait = TRUE
  KernelReleasesOnExit = TRUE
  CloseReleasesDirectory = FALSE
  ReleaseWaitsForDirectory = TRUE
  ReleaseByShutdownOwner = TRUE
  OtherAccess = TRUE
  HolderOutlivesAck = FALSE
  CanAbandon = TRUE
  CanCrash = TRUE
  CanHang = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NeverTwoHolders
INVARIANT AckFollowsRelease
INVARIANT AckedHandoff
INVARIANT RefusalNamesLiveHolder
INVARIANT CrashedHolderNeverBlocks
INVARIANT SuccessorOpensStore
PROPERTY AcquirerSettles
PROPERTY WaiterTakesReleasedStore
