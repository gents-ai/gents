\* RED by design. A denial delivered only as a stream errors envelope that
\* the source does not classify: it re-arms at the transport retry rate and
\* cancels each snapshot before it can observe the denial.
\* EXPECTED: DenialObserved VIOLATED (a connecting/disconnected loop).
CONSTANTS
  K = 2
  MaxGen = 4
  Cap = 2
  MaxEnv = 3
  MaxChan = 2
  RenewalAsFailure = FALSE
  EnvelopeClassified = FALSE
  NamedNoEndpoint = TRUE
  GenerationCheck = TRUE
  ArmBeforeReady = TRUE
  DenyAtHandshake = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY DenialObserved
CHECK_DEADLOCK FALSE
