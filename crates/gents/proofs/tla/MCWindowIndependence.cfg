  Windows = {"w1", "w2"}
  Nodes = {"n1", "n2"}
  MaxWrites = 2
  MaxSwitch = 3
  CancelOnSwitch = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoCrossDelivery
PROPERTY Converges
PROPERTY WatchFollowsSelection
CHECK_DEADLOCK FALSE
