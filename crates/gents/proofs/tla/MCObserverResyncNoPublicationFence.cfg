\* RED, one guard broken: a publication does not reject an older reload.
\* EXPECTED: NoLostWrite VIOLATED (the observer publishes a newer read, then
\* an older direct refresh publishes over it, leaving the newer write unshown
\* with nothing to load it). That step is also a stale commit, which
\* StaleCommit witnesses; this config leaves NoStaleCommit unchecked.
CONSTANTS
  Nodes = {"a"}
  RenewNodes = {}
  LiveNodes = {"a"}
  MaxWrites = 1
  K = 0
  MaxDrops = 0
  MaxRefreshes = 1
  EventsFenceReloads = FALSE
  PublicationsFenceReloads = FALSE
  RejectDelay = FALSE
  EventQueues = TRUE
  ArmFirst = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostWrite
INVARIANT NoReadWithoutReason
PROPERTY EventualPublication
PROPERTY Convergence
CHECK_DEADLOCK FALSE
