\* RED: a writer parked on the full gate is not woken when a permit comes
\* free (a lost wake-up on the semaphore).
\* EXPECTED: EveryCallSettles VIOLATED (a parked writer never returns).
CONSTANTS
  Writers = {w1, w2, w3}
  Iters = 2
  Attempts = 4
  Capacity = 2
  BoundedRetry = TRUE
  CanTimeout = FALSE
  CheckDeadline = FALSE
  Deadline = 0
  ReadOutsideTxn = FALSE
  StaleRetry = FALSE
  ConflictAsSuccess = FALSE
  RetryAmbiguous = FALSE
  LostWakeup = TRUE
  AbortOnOpenWriter = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AckedApplied
INVARIANT NoLostUpdate
PROPERTY EveryCallSettles
CHECK_DEADLOCK FALSE
