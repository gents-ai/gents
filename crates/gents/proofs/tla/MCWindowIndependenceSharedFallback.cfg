\* RED by design. The code before this model: a window's node-scoped view
\* falls back to the client core's one shared selection, which names a node
\* only while exactly one window is open, so with two windows open neither
\* window's view ever loads its own node.
\* EXPECTED: Converges VIOLATED.
CONSTANTS
  Windows = {"w1", "w2"}
  Nodes = {"n1", "n2"}
  MaxWrites = 2
  MaxSwitch = 3
  SharedFallback = TRUE
  CancelOnSwitch = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoCrossDelivery
PROPERTY Converges
CHECK_DEADLOCK FALSE
