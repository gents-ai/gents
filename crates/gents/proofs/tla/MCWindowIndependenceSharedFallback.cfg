\* RED by design. A window's read falls back to one selection shared by
\* every window (the client core's `selected_node_did`), so the window that
\* selected first is shown the node the other window selected last.
\* EXPECTED: NoCrossDelivery VIOLATED.
CONSTANTS
  Windows = {"w1", "w2"}
  Nodes = {"n1", "n2"}
  MaxWrites = 2
  MaxSwitch = 3
  SharedFallback = TRUE
  CancelOnSwitch = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoCrossDelivery
CHECK_DEADLOCK FALSE
