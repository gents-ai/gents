\* expect: violates AliasAcyclic
\* RED: the alias guard is load-bearing. Without it two concurrent merges,
\* 1 into 2 and 2 into 1, each admitted on a read that has neither alias,
\* insert different unique `from_problem_key` values and both commit, so the
\* alias rows form a cycle.
CONSTANTS
  Requests = {r1, r2}
  Keys = {1, 2, 3}
  Seeded = {1, 2}
  Steps = 2
  Guard = FALSE
  AdmitInTxn = TRUE
  MinBreak = TRUE
  AppendOnly = TRUE
  Carried <- MCCarried
  CarryAdmits = TRUE
  CarryGuard = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttemptLost
INVARIANT ResolveDeterministic
INVARIANT AliasAcyclic
CHECK_DEADLOCK FALSE
