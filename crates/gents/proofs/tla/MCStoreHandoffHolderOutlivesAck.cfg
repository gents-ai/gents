\* expect: violates StopAcknowledged
\* RED by design. As green, but whoever acknowledges keeps its node handles
\* until after the acknowledgement, as a shutdown that awaited the release
\* itself would: the release waits for the engine, the engine for those
\* handles, and they for the acknowledgement.
\* EXPECTED: StopAcknowledged VIOLATED.
CONSTANTS
  H = h
  Acquirers = {a1, a2}
  AckAfterRelease = TRUE
  MarkReleasing = TRUE
  WaitOnReleasing = TRUE
  BoundedWait = TRUE
  KernelReleasesOnExit = TRUE
  CloseReleasesDirectory = FALSE
  ReleaseWaitsForDirectory = TRUE
  ReleaseByShutdownOwner = TRUE
  OtherAccess = TRUE
  HolderOutlivesAck = TRUE
  CanAbandon = TRUE
  CanCrash = TRUE
  CanHang = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NeverTwoHolders
INVARIANT SuccessorOpensStore
