\* RED by design. The driver waits on the write-attempt telemetry instead of
\* the tracker state. That record is a projection the attempt may skip when
\* it already holds a terminal outcome, so the signal the driver waits on
\* need never arrive even though the owner abandoned the tracker.
\* EXPECTED: ObservableWithoutRealTime VIOLATED.
