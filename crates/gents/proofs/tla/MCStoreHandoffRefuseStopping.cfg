\* RED by design. The acknowledgement follows the release, but a stopping
\* holder declares nothing and an acquirer refuses any held lock: a process
\* that starts while the holder shuts down (an idle installation closing,
\* a runtime stopped by its supervisor) is told "already using".
\* EXPECTED: RefusalNamesLiveHolder VIOLATED.
CONSTANTS
  H = h
  Acquirers = {a1, a2}
  AckAfterRelease = TRUE
  MarkReleasing = FALSE
  WaitOnReleasing = FALSE
  BoundedWait = TRUE
  KernelReleasesOnExit = TRUE
  CanCrash = TRUE
  CanHang = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NeverTwoHolders
INVARIANT AckFollowsRelease
INVARIANT AckedHandoff
INVARIANT RefusalNamesLiveHolder
CHECK_DEADLOCK FALSE
