\* The test on main: it reads the Goal when its 200 ms window ends, whether
\* or not the source has reconciled the completed wrap-up. The product is the
\* green one (MCGoalWrapup checks its invariants with the same product
\* actions). EXPECTED: ReadSeesLatch fails: the read precedes the source step.
CONSTANTS
  Sources = {s1, s2}
  MaxReq = 3
  WrapupGuard = TRUE
  KeyedChild = TRUE
  AwaitReconcile = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadSeesLatch
CHECK_DEADLOCK FALSE
