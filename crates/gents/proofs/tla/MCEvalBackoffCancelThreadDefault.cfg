\* expect: violates TestPasses
\* RED: no global default. With the test's subscriber the only one
\* registered, another test's thread that reaches the announcement first
\* caches `never` from its own default and the announcement is lost.
CONSTANTS
  Writer = "test"
  TickChecksMarker = TRUE
  TopChecksMarker = TRUE
  Global = "none"
  BackoffUnreached = TRUE
  Backoff = 2
  MaxDelay = 1
  Ceiling = 8
  Window = 0

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT TestPasses
INVARIANT NoRetryAfterMarker
CHECK_DEADLOCK FALSE
