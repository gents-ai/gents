\* expect: violates AliasAcyclic
\* RED: admitting a carried alias row is load-bearing. A carry that copies
\* 2 -> 1 with only the checks it made before admission (different keys, no
\* alias row from 2 yet) and writes no guard inserts it after a request
\* merged 1 into 2, so the alias rows form a cycle.
CONSTANTS
  Requests = {r1, r2}
  Keys = {1, 2, 3}
  Seeded = {1, 2}
  Steps = 2
  Guard = TRUE
  AdmitInTxn = TRUE
  MinBreak = TRUE
  AppendOnly = TRUE
  Carried <- MCCarried
  CarryAdmits = FALSE
  CarryGuard = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttemptLost
INVARIANT ResolveDeterministic
INVARIANT AliasAcyclic
CHECK_DEADLOCK FALSE
