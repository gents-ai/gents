\* GREEN. With the shared renewal gate, terminalize_execution drains any
\* in-flight renewal before taking its MVCC snapshot and holds the gate across
\* its transaction, so RenewalTask never aborts terminalization. On
\* PendingQueueChanged the gate is released and RenewalTask stays live.
CONSTANTS
  TermAttempts = 4
  MaxRenewals = 5
  AllowRequeue = TRUE
  RenewalGate = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
