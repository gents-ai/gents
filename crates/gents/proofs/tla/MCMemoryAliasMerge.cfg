\* expect: holds
\* states: 76000
\* Two requests of one agent over three problem keys (two open, the third
\* either may open), two operations each, every open, attempt and merge in
\* any interleaving: the guard aborts the later of two concurrent merges and
\* its rebuilt admission sees the earlier alias, so the alias rows stay
\* acyclic, the keys of a merged problem resolve alike and every attempt
\* resolves to a problem.
CONSTANTS
  Requests = {r1, r2}
  Keys = {1, 2, 3}
  Seeded = {1, 2}
  Steps = 2
  Guard = TRUE
  AdmitInTxn = TRUE
  MinBreak = TRUE
  AppendOnly = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttemptLost
INVARIANT ResolveDeterministic
INVARIANT AliasAcyclic
CHECK_DEADLOCK FALSE
