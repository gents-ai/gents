\* expect: holds
\* states: 389000
\* Two requests of one agent over three problem keys (two open, the third
\* either may open), two operations each, every open, attempt and merge in
\* any interleaving, while the agent's carry copies the alias row 2 -> 1:
\* the guard aborts the later of a merge and a concurrent merge or carried
\* insert, and its rebuilt admission sees the earlier alias, so the alias
\* rows stay acyclic, the keys of a merged problem resolve alike and every
\* attempt resolves to a problem.
CONSTANTS
  Requests = {r1, r2}
  Keys = {1, 2, 3}
  Seeded = {1, 2}
  Steps = 2
  Guard = TRUE
  AdmitInTxn = TRUE
  MinBreak = TRUE
  AppendOnly = TRUE
  Carried <- MCCarried
  CarryAdmits = TRUE
  CarryGuard = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttemptLost
INVARIANT ResolveDeterministic
INVARIANT AliasAcyclic
CHECK_DEADLOCK FALSE
