  Nodes = {"a", "b"}
  RenewNodes = {"b"}
  LiveNodes = {"a"}
  MaxWrites = 1
  K = 1
  MaxDrops = 0
  MaxRefreshes = 0
  EventScope = "node"
  EventsFenceReloads = FALSE
  PublicationsFenceReloads = TRUE
  RejectDelay = FALSE
  EventQueues = TRUE
  ArmFirst = TRUE
  FallbackOnReject = FALSE
  WidenNodes = {"a"}
  MaxWidens = 1
  PersistentWiden = FALSE
  WidenedCheckAll = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostWrite
INVARIANT NoReadWithoutReason
PROPERTY NoStaleCommit
PROPERTY EventualPublication
PROPERTY Convergence
CHECK_DEADLOCK FALSE
