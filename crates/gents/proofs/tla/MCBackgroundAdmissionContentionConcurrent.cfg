\* RED: the found race (#3592). The regression drove every sibling's
\* `on_tool_call` at once (`join_all`), which the owned loop never does. Each
\* call then contends with 2N - 1 sibling commits plus running children on the
\* session observation, more than its Max + 2 attempts. No renewal runs, so
\* only the order differs from green.
\* EXPECTED: NoConflictLoss VIOLATED (a receipt or admission exhausts its
\* attempts: "tool call persistence failed: DefraDB transaction conflict").
CONSTANTS
  N = 4
  Max = 2
  Attempts = 4
  StartAttempts = 4
  RenewAttempts = 4
  Renewals = 0
  RenewTicks = 1
  SequentialAdmission = FALSE
  BumpSequence = TRUE
  RedriveLostPoll = TRUE
  RenewalSpaced = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT BudgetBound
INVARIANT NoConflictLoss
INVARIANT ReceiptOnce

CHECK_DEADLOCK FALSE
