\* expect: violates AllDone
\* RED: workers sized from the backend, the rule before #4191. With one
\* concurrent call the Agent has one worker; the turn holds it while it waits,
\* so its delegate never starts and the turn never ends.
CONSTANTS
  Roots = 1
  Levels = 1
  LevelWorkers = 1
  BackendLimit = 1
  PluginCalls = FALSE
  PermitAcrossTools = FALSE
  PluginOwnLimiter = FALSE
  AuxiliaryLane = TRUE
  TurnsEnd = TRUE
  SessionGate = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ServerWithinLimit
INVARIANT WorkersWithinLevels
INVARIANT OneTurnPerSession
PROPERTY AllDone
CHECK_DEADLOCK FALSE
