\* expect: holds
\* states: 20
\* trace sample: seed=2 depth=15 count=1
\* Production: the route write holds the enrollment decision lock that every
\* local revision holds, so a local revocation is never interleaved with it;
\* a merged revocation's route is deleted by the pass the merge wakes, and the
\* syncing peer installs only on fresh authority, so nothing is installed
\* meanwhile.
CONSTANTS
  ReconcileLocks = TRUE
  Merges = TRUE
  PeerTrustsRoute = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoRouteForRevokedMember
INVARIANT NoInstallForRevokedMember
PROPERTY RevokedMemberIsDisconnected
CHECK_DEADLOCK FALSE
