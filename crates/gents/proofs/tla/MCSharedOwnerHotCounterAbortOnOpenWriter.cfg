\* RED: a commit also aborts for a concurrent writer that has not committed
\* (no first committer wins), and conflicts repeat without bound.
\* EXPECTED: EveryCallSettles VIOLATED (a livelock lasso).
CONSTANTS
  Writers = {w1, w2, w3}
  Iters = 2
  Attempts = 4
  Capacity = 2
  BoundedRetry = FALSE
  CanTimeout = FALSE
  CheckDeadline = FALSE
  Deadline = 0
  ReadOutsideTxn = FALSE
  StaleRetry = FALSE
  ConflictAsSuccess = FALSE
  RetryAmbiguous = FALSE
  LostWakeup = FALSE
  AbortOnOpenWriter = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AckedApplied
INVARIANT NoLostUpdate
PROPERTY EveryCallSettles
CHECK_DEADLOCK FALSE
