\* expect: violates StagedSubmitterYieldsOnlyToHelper
\* RED by design. A status reader takes helper.lock for every phase it read:
\* holding it at Staged, it leaves registration to the submitter, and the
\* submitter, finding the lock held, leaves it to the helper, so nobody
\* registers and the update fails waiting for its helper.
\* EXPECTED: StagedSubmitterYieldsOnlyToHelper VIOLATED.
CONSTANTS
  Submitters = {s}
  Readers = {q}
  InitialPhases = {"staged", "accepted"}
  LockedReregistration = TRUE
  ReadUnderLock = TRUE
  LockedFirstRegistration = TRUE
  StatusGate = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT StagedSubmitterYieldsOnlyToHelper
CHECK_DEADLOCK FALSE
