\* RED by design: the test observer before the fix. It accepts an absent
\* route, so it acts between a teardown and the install of an operation whose
\* recheck preceded the withdrawal.
\* EXPECTED: ObservedWithdrawalHolds VIOLATED.
CONSTANTS
  RecheckBeforeInstall = TRUE
  ObserverNeedsRoute = FALSE
  Churn = TRUE
  RevokeTearsDown = FALSE
  PushChecksGrant = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoStaleInstall
INVARIANT ObservedWithdrawalHolds
CHECK_DEADLOCK FALSE
