\* RED by design: the reconciler before the fix. A sweep that read the grant
\* before its withdrawal tears the route down after it and installs the
\* collection again; the backfill pushes the document the observer wrote once
\* it saw the withdrawal reported and the base route standing (the CI failure).
\* EXPECTED: NoStaleInstall VIOLATED.
CONSTANTS
  RecheckBeforeInstall = FALSE
  ObserverNeedsRoute = TRUE
  Churn = TRUE
  RevokeTearsDown = FALSE
  PushChecksGrant = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoStaleInstall
INVARIANT ObservedWithdrawalHolds
CHECK_DEADLOCK FALSE
