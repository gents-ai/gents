\* RED by design. Breaks the arm-before-snapshot guard: the ready notice is
\* sent before every subscription is armed, so a snapshot can complete
\* before a change it would miss is subscribed.
\* EXPECTED: ConnectedAfterArmedSnapshot VIOLATED.
CONSTANTS
  K = 2
  MaxGen = 4
  Flat = 2
  Cap = 2
  MaxAttempts = 3
  MaxEnv = 3
  MaxChan = 2
  Revocation = "served"
  RenewalAsFailure = FALSE
  MakeBeforeBreak = TRUE
  Capped = TRUE
  OmittedIsEmpty = TRUE
  NamedNoEndpoint = TRUE
  GenerationCheck = TRUE
  ArmBeforeReady = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ConnectedAfterArmedSnapshot
CHECK_DEADLOCK FALSE
