\* GREEN with widening. Both nodes renew during every load and each load's
\* first publication overwrites an unowned row and moves every node's fence;
\* a widened load checks only its own node's fence.
\* EXPECTED: every invariant and property holds.
CONSTANTS
  Nodes = {"a", "b"}
  RenewNodes = {"a", "b"}
  LiveNodes = {"a", "b"}
  MaxWrites = 1
  K = 1
  MaxDrops = 0
  MaxRefreshes = 0
  EventScope = "node"
  EventsFenceReloads = FALSE
  PublicationsFenceReloads = TRUE
  RejectDelay = FALSE
  EventQueues = TRUE
  ArmFirst = TRUE
  FallbackOnReject = FALSE
  WidenNodes = {"a", "b"}
  MaxWidens = 1
  PersistentWiden = FALSE
  WidenedCheckAll = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoLostWrite
INVARIANT NoReadWithoutReason
PROPERTY NoStaleCommit
PROPERTY EventualPublication
PROPERTY Convergence
CHECK_DEADLOCK FALSE
