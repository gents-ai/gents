\* expect: violates SuccessorOpensStore
\* RED by design: the code after #3802, before this fix. The claim is released
\* when the last owner of the node's write gate drops it, at once, while the
\* engine keeps the data directory locked until the node's last handle drops,
\* which its owner does only after its shutdown returned.
\* EXPECTED: SuccessorOpensStore VIOLATED (BeginStop, CloseNode, Release, Start,
\* TryLock, Open: the acquirer takes the store and its engine finds the
\* directory locked, as in
\* `a_client_opened_while_its_predecessor_closes_waits_for_the_release`).
CONSTANTS
  H = h
  Acquirers = {a1, a2}
  AckAfterRelease = TRUE
  MarkReleasing = TRUE
  WaitOnReleasing = TRUE
  BoundedWait = TRUE
  KernelReleasesOnExit = TRUE
  CloseReleasesDirectory = FALSE
  ReleaseWaitsForDirectory = FALSE
  ReleaseByShutdownOwner = FALSE
  OtherAccess = FALSE
  HolderOutlivesAck = TRUE
  CanAbandon = FALSE
  CanCrash = TRUE
