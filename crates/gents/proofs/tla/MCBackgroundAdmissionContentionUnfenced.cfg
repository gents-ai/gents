\* RED: the admission sequence is load-bearing. Without the bump, concurrent
\* admissions count live rows by an untracked predicate read and all commit.
\* Attempts is unbounded here so only the budget can fail. No renewal runs.
\* EXPECTED: BudgetBound VIOLATED.
CONSTANTS
  N = 4
  Max = 2
  Attempts = 100
  StartAttempts = 4
  RenewAttempts = 4
  Renewals = 0
  RenewTicks = 1
  SequentialAdmission = FALSE
  BumpSequence = FALSE
  RedriveLostPoll = TRUE
  RenewalSpaced = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT BudgetBound
INVARIANT NoConflictLoss
INVARIANT ReceiptOnce

CHECK_DEADLOCK FALSE
