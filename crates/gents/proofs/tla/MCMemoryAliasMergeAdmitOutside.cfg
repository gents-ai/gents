\* expect: violates AliasAcyclic
\* RED: the admission read inside the transaction is load-bearing. A merge
\* that decides on aliases read before its transaction loses to the guard's
\* conflict, but its rebuild commits the stale admission: 2 into 1 lands
\* after 1 into 2 and the alias rows form a cycle.
CONSTANTS
  Requests = {r1, r2}
  Keys = {1, 2, 3}
  Seeded = {1, 2}
  Steps = 2
  Guard = TRUE
  AdmitInTxn = FALSE
  MinBreak = TRUE
  AppendOnly = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttemptLost
INVARIANT ResolveDeterministic
INVARIANT AliasAcyclic
CHECK_DEADLOCK FALSE
