\* GREEN. The optimistic send under the session's active turn. The
\* reservation and the submission are signed-conflict rebuilds with the
\* bounded TRANSACT_CONFLICT_MAX_RETRIES + 1 attempts per phase, and fewer
\* Agent session refreshes land in one attempt series than it has attempts.
\* Replies may be lost and sends refused; the person retries a failed message
\* under its original identity, up to three sends, and the runtime's create
\* is idempotent on that identity.
\* EXPECTED: every invariant, PendingResolves and EverySendSettles hold.
CONSTANTS
  Publications = 3
  Attempts = 4
  Redrive = TRUE
  ReserveRedrive = TRUE
  LostReply = TRUE
  Refusals = TRUE
  MaxSends = 3
  RetryFreshId = FALSE
  PayloadLost = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT CreatedOnce
INVARIANT RetainedUntilConfirmed
INVARIANT FailedOffersRetry
PROPERTY PendingResolves
PROPERTY EverySendSettles
CHECK_DEADLOCK FALSE
