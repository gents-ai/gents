\* GREEN. The submission is a signed-conflict rebuild: a confirmed conflict
\* re-reads the session, re-plans and signs a fresh graph, with the bounded
\* TRANSACT_CONFLICT_MAX_RETRIES + 1 attempts. Fewer Agent session refreshes
\* land in one attempt series than it has attempts, and a lost commit
\* response is reported, never rebuilt.
\* EXPECTED: every invariant and EverySubmissionSettles hold.
CONSTANTS
  Publications = 3
  Attempts = 4
  Redrive = TRUE
  LostResponse = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT CreatedOnce
PROPERTY EverySubmissionSettles
CHECK_DEADLOCK FALSE
