\* GREEN. The reservation and the submission are signed-conflict rebuilds: a
\* confirmed conflict re-reads the session, re-plans and signs a fresh graph,
\* with the bounded TRANSACT_CONFLICT_MAX_RETRIES + 1 attempts per phase.
\* Fewer Agent session refreshes land in one attempt series than it has
\* attempts, and a lost commit response is reported, never rebuilt. A lost
\* reservation response is repeated by Resume. Recovery reconciles an
\* unconfirmed send with its retained bytes while the original commit may
\* still land, under the premise that the owner is eventually reachable
\* (`OwnerReachable`; `OwnerUnreachable` shows it is load-bearing). The bytes
\* may be lost first; absence then stays unconfirmed ("wait") and the person
\* may set the send aside. `ReplayRejects` is off: `ReplayRejectedInFlight`
\* is the reported gap.
\* EXPECTED: every invariant, EverySubmissionSettles and UnconfirmedResolves hold.
CONSTANTS
  Publications = 3
  Attempts = 4
  Redrive = TRUE
  ReserveRedrive = TRUE
  LostResponse = TRUE
  Recovery = TRUE
  BytesLost = TRUE
  ReplayIdentical = TRUE
  OwnerReachable = TRUE
  ReplayRejects = FALSE
  SetAsideOffered = TRUE
  UnretainedPolicy = "wait"

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT CreatedOnce
INVARIANT NotDeliveredIsProven
INVARIANT NeverBlocked
PROPERTY EverySubmissionSettles
PROPERTY UnconfirmedResolves
CHECK_DEADLOCK FALSE
