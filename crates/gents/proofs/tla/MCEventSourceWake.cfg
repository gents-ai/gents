\* expect: holds
\* Both safeguards hold: whatever the transport drops or redelivers, every
\* written arrival is checkpointed and admitted exactly once.
CONSTANTS
  Docs = 2
  MaxDup = 1
  MaxLost = 1
  Rescan = TRUE
  Dedupe = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT CheckpointNeedsReceipt
INVARIANT AtMostOnce
PROPERTY EveryArrivalDelivered
CHECK_DEADLOCK FALSE
