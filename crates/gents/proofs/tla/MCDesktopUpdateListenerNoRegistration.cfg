\* GREEN. Registration is not fair: the listener may keep rejecting or never
\* settle, so no event ever arrives. The read run() starts with still settles
\* the selection, and waiting phases still re-read and then offer retry.
\* EXPECTED: TypeOK, MovedReadQueued and NoStuckPending hold.
CONSTANTS
  MaxVersion = 2
  ListenFailures = 1
  Mismatches = 1
  Selections = 1
  RereadBudget = 2
  InitialRead = TRUE
  FullAfterListen = TRUE
  Relisten = TRUE
  PendingReread = TRUE
  MismatchExit = TRUE

SPECIFICATION SpecListenerUnfair
INVARIANT TypeOK
INVARIANT MovedReadQueued
PROPERTY NoStuckPending
CHECK_DEADLOCK FALSE
