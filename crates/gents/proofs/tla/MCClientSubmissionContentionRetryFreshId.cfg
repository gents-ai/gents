\* RED: a retry under a new request identity. The first send commits but its
\* reply is lost, the deadline shows it failed, and Retry sends the payload
\* under a fresh identity, which the runtime admits as a second request.
\* EXPECTED: CreatedOnce VIOLATED.
CONSTANTS
  Publications = 0
  Attempts = 1
  Redrive = TRUE
  ReserveRedrive = TRUE
  LostReply = TRUE
  Refusals = FALSE
  MaxSends = 2
  RetryFreshId = TRUE
  PayloadLost = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT CreatedOnce
INVARIANT RetainedUntilConfirmed
INVARIANT FailedOffersRetry
CHECK_DEADLOCK FALSE
