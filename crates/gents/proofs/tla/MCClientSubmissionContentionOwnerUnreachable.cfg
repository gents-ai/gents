\* RED: green's owner-reachability premise is load-bearing. With retained
\* bytes and an owner that never answers, every reconcile returns
\* `SubmissionOutcomeUnknown` and the saved message awaits confirmation.
\* Set-aside is offered only without bytes, so nothing discards a send that
\* can still be proven.
\* EXPECTED: UnconfirmedResolves VIOLATED.
CONSTANTS
  Publications = 1
  Attempts = 2
  Redrive = TRUE
  ReserveRedrive = TRUE
  LostResponse = TRUE
  Recovery = TRUE
  BytesLost = FALSE
  ReplayIdentical = TRUE
  OwnerReachable = FALSE
  ReplayRejects = FALSE
  SetAsideOffered = TRUE
  UnretainedPolicy = "wait"

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT CreatedOnce
PROPERTY UnconfirmedResolves
CHECK_DEADLOCK FALSE
