\* expect: holds
\* GREEN. The send into a published session: the submission reads the
\* session's binding before its transaction, which then reads only the Agent,
\* so the Agent's session refreshes never abort it. The binding never changes
\* once published (Lean `TransactionFence.DeclaredFence.immutableBinding`).
\* Otherwise as MCClientSubmissionContention: rebuilt reservations, lost
\* replies, refusals and retries under one identity.
\* EXPECTED: every invariant, PendingResolves and EverySendSettles hold.
CONSTANTS
  Reserves = FALSE
  Publications = 3
  Attempts = 4
  Redrive = TRUE
  ReserveRedrive = TRUE
  LostReply = TRUE
  Refusals = TRUE
  MaxSends = 3
  RetryFreshId = FALSE
  PayloadLost = FALSE
  PublishedBinding = TRUE
  BindingChanges = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT CreatedOnce
INVARIANT RetainedUntilConfirmed
INVARIANT FailedOffersRetry
INVARIANT SubmittedUnderCurrentBinding
PROPERTY PendingResolves
PROPERTY EverySendSettles
CHECK_DEADLOCK FALSE
