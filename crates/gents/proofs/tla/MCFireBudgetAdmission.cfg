\* expect: holds
\* states: 10
\* Three fires of one Trigger admitted at once against a budget of two with one
\* receipt already in the window: the unique sequence aborts every stale
\* commit, so one more receipt is admitted and the rest are refused.
CONSTANTS
  Admissions = 3
  Budget = 2
  Seeded = 1
  UniqueSequence = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT BudgetBound
PROPERTY AllSettle
CHECK_DEADLOCK FALSE
