\* expect: violates NoConflictLoss
\* RED. Without the shared renewal gate, concurrent renewals on AgentRequest
\* abort every attempt of terminalize_execution until TermAttempts exhausts
\* (reproducing the production livelock when terminalize exceeds the renewal
\* cadence).
CONSTANTS
  TermAttempts = 4
  MaxRenewals = 5
  AllowRequeue = FALSE
  RenewalGate = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
CHECK_DEADLOCK FALSE
