\* RED by design. The driver advances the clock without first observing the
\* native entry, so the advance can land before the caller is polled and
\* arms its deadline from the already-advanced clock. The expiry is then
\* unreachable on the virtual clock and only wall time gets there.
\* EXPECTED: AdvanceFollowsArm VIOLATED (TLC reports the invariant first;
\* ObservableWithoutRealTime fails on the same schedule).
CONSTANTS
  Timeout = 1
  MaxAdvance = 1
  RequireArmed = FALSE
  ObserveTelemetry = FALSE
  PermitSemantics = TRUE
  TelemetrySuppressible = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AdvanceFollowsArm
INVARIANT ObservationImpliesAbandonment
PROPERTY ObservableWithoutRealTime
CHECK_DEADLOCK FALSE
