\* the commit, steps frame by frame until the reveal grows the list, then steps
\* the two counted frames; the wheel waits until the box
\* is the hit target at the pointer, and the owner keeps its 1 px guard. The
\* commit, both list heights and both extra reconciles interleave freely with
