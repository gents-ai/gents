\* RED by design. The rejected reset rule: a connected snapshot resets the
\* reconnect count. A runtime that accepts the arm and the snapshot and then
\* drops the stream starts every cycle at attempt 0 and is redialed at the
\* base delay forever.
\* EXPECTED: FlapBounded VIOLATED.
CONSTANTS
  K = 2
  MaxGen = 4
  Flat = 1
  Cap = 4
  MaxAttempts = 4
  MaxEnv = 3
  MaxChan = 2
  Revocation = "served"
  RenewalAsFailure = FALSE
  MakeBeforeBreak = TRUE
  Capped = TRUE
  OmittedIsEmpty = TRUE
  NamedNoEndpoint = TRUE
  GenerationCheck = TRUE
  ArmBeforeReady = TRUE
  Drops = TRUE
  ResetOnConnect = TRUE
  KeepEnded = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT FlapBounded
CHECK_DEADLOCK FALSE
