\* when the owner shows no request and definitely rejects the identical
\* replay, but the original commit may still be in flight and land later.
\* EXPECTED: NotDeliveredIsProven VIOLATED.
CONSTANTS
  Publications = 1
  Attempts = 2
  Redrive = TRUE
  ReserveRedrive = TRUE
  LostResponse = TRUE
  Recovery = TRUE
  BytesLost = FALSE
  ReplayIdentical = TRUE
  OwnerReachable = TRUE
  ReplayRejects = TRUE
  SetAsideOffered = TRUE
  UnretainedPolicy = "wait"

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT CreatedOnce
INVARIANT NotDeliveredIsProven
CHECK_DEADLOCK FALSE
