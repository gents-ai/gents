\* RED: in the owned loop's order the only concurrent session writers are the
\* running children, at most Max. A budget of Max attempts can lose to all of
\* them, so the attempt bound must exceed Max. No renewal runs.
\* EXPECTED: NoConflictLoss VIOLATED.
