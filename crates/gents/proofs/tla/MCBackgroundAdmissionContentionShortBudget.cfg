  N = 4
  Max = 2
  Attempts = 2
  StartAttempts = 4
  RenewAttempts = 4
  Renewals = 0
  RenewTicks = 1
  SequentialAdmission = TRUE
  BumpSequence = TRUE
  RedriveLostPoll = TRUE
  RenewalSpaced = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT BudgetBound
INVARIANT NoConflictLoss
INVARIANT ReceiptOnce

CHECK_DEADLOCK FALSE
