\* expect: violates NoAttemptLost
\* RED: appending an alias instead of moving rows is load-bearing. A merge
\* that rewrites the attempts its filtered read returned to cite the target
\* and deletes the merged problem does not see an attempt citing that
\* problem that commits after its read: the store does not validate an
\* arrival into a filtered read, so both commit and the attempt cites a
\* deleted problem.
CONSTANTS
  Requests = {r1, r2}
  Keys = {1, 2, 3}
  Seeded = {1, 2}
  Steps = 2
  Guard = TRUE
  AdmitInTxn = TRUE
  MinBreak = TRUE
  AppendOnly = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttemptLost
INVARIANT ResolveDeterministic
INVARIANT AliasAcyclic
CHECK_DEADLOCK FALSE
