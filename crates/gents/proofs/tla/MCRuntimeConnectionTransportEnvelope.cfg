\* revocation as a classified PERMISSION_DENIED errors envelope on the open
\* stream (and HTTP 403 on a read). Not the pinned runtime's behaviour.
\* EXPECTED: every invariant and property holds.
CONSTANTS
  K = 2
  MaxGen = 4
  Cap = 2
  MaxEnv = 3
  MaxChan = 2
  Revocation = "envelope"
  RenewalAsFailure = FALSE
  MakeBeforeBreak = TRUE
  WithheldClassified = TRUE
  NamedNoEndpoint = TRUE
  GenerationCheck = TRUE
  ArmBeforeReady = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ConnectedAfterArmedSnapshot
INVARIANT RemovalClears
INVARIANT NoEndpointNamed
INVARIANT RenewalNeverDisconnects
