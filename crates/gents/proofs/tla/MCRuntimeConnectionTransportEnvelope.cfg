\* GREEN. As MCRuntimeConnectionTransport, for a runtime that reports a
\* revocation as a classified PERMISSION_DENIED errors envelope on the open
\* stream (and HTTP 403 on a read): a refusal reconnects with the capped backoff and
\* reads as connecting. Not the pinned runtime's behaviour.
\* EXPECTED: every invariant and property holds.
CONSTANTS
  K = 2
  MaxGen = 4
  Flat = 2
  Cap = 2
  MaxAttempts = 3
  MaxEnv = 3
  MaxChan = 2
  Revocation = "envelope"
  RenewalAsFailure = FALSE
  MakeBeforeBreak = TRUE
  Capped = TRUE
  OmittedIsEmpty = TRUE
  NamedNoEndpoint = TRUE
  GenerationCheck = TRUE
  ArmBeforeReady = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ConnectedAfterArmedSnapshot
INVARIANT RemovalClears
INVARIANT NoEndpointNamed
INVARIANT RenewalNeverDisconnects
INVARIANT NoCauselessReconnect
INVARIANT ReconnectBounded
PROPERTY StaleNoticeInert
PROPERTY EventuallyConnected
PROPERTY RecoveredEventuallyArmed
PROPERTY RefusalReadsAsConnecting
PROPERTY NoEndpointEventuallyNamed
CHECK_DEADLOCK FALSE
