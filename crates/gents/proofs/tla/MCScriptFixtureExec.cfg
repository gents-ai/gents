\* GREEN. The script is never write-open in the spawning process; two
\* siblings spawn concurrently under Linux's rule.
\* EXPECTED: every invariant holds.
CONSTANTS
  Siblings = {s1, s2}
  InProcessWrite = FALSE
  ExecRefusesWriters = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoTextBusy
CHECK_DEADLOCK FALSE
