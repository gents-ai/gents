\* expect: holds
\* GREEN. The client hands a fresh delegation in for every entry waiting
\* for authority, reports what was refused, and asks again while anything
\* moves, across outages of the provider and its own offline periods.
\* EXPECTED: every invariant and property holds.
CONSTANTS
  Entries = {e1, e2}
  MaxOutages = 2
  MaxOffline = 1
  HandsIn = TRUE
  Reports = TRUE
  GiveUpAfter = 0

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReportsOnlyFailures
PROPERTY SettledStays
PROPERTY EveryEntryResolves
PROPERTY NeverSilentlyLost
CHECK_DEADLOCK FALSE
