\* GREEN. One round of raw single-attempt transactions, the native c64
\* experiment: no owner retry, a permit per writer so no gate wait, no
\* commit timeouts.
\* EXPECTED: every invariant, RoundProgress and EveryCallSettles hold.
CONSTANTS
  Writers = {w1, w2, w3}
  Iters = 1
  Attempts = 1
  Capacity = 3
  BoundedRetry = TRUE
  CanTimeout = FALSE
  CheckDeadline = FALSE
  Deadline = 0
  ReadOutsideTxn = FALSE
  StaleRetry = FALSE
  ConflictAsSuccess = FALSE
  RetryAmbiguous = FALSE
  LostWakeup = FALSE
  AbortOnOpenWriter = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AckedApplied
INVARIANT ConflictNotApplied
INVARIANT NoDoubleApply
INVARIANT NoLostUpdate
INVARIANT TestAccounting
INVARIANT AttemptBound
INVARIANT RoundProgress
PROPERTY EveryCallSettles
CHECK_DEADLOCK FALSE
