\* expect: violates ClientSettles
\* RED by design: the server premise dropped with no progress signal. A live
\* server that stops working on the commit still answers keepalive probes,
\* and the client cannot tell it from a slow one: any verdict of its own is
\* the ClientWindow failure, so it waits. Bounding a wedged commit belongs to
\* the server (defradb.rs), or to a published commit step (WedgedProgress).
\* EXPECTED: ClientSettles VIOLATED.
CONSTANTS
  MaxWork = 3
  MaxDelay = 1
  Ceiling = 2
  Detector = "none"
  Crashes = FALSE
  HostLoss = FALSE
  Keepalive = TRUE
  ServerBounded = FALSE
  Drops = FALSE
  OutcomeQuery = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT UnknownOnlyWithoutProgress
PROPERTY ClientSettles
CHECK_DEADLOCK FALSE
