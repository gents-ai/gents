\* expect: violates AllDone
\* RED: releasing the model-call permit when the stream ends is load-bearing.
\* A turn that keeps it while its tool calls wait holds the backend's only
\* permit, so its delegate starts but never makes its call.
CONSTANTS
  Roots = 1
  Levels = 3
  LevelWorkers = 2
  BackendLimit = 1
  PluginCalls = FALSE
  PermitAcrossTools = TRUE
  PluginOwnLimiter = FALSE
  AuxiliaryLane = TRUE
  TurnsEnd = TRUE
  SessionGate = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ServerWithinLimit
INVARIANT WorkersWithinLevels
INVARIANT OneTurnPerSession
PROPERTY AllDone
CHECK_DEADLOCK FALSE
