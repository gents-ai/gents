\* GREEN. The fixed design: request events are scoped to their source node and
\* stay off the reload fence, a rejected load requeues at once, and a rejected
\* refresh hands its node to the observer. Two nodes, renewals during every
\* load on both, a write, a stream drop and a direct refresh per node.
\* EXPECTED: every invariant and property holds.
