\* expect: holds
\* states: 600
\* GREEN: two turns of one Agent each start a delegate and wait for it,
\* with one worker per level and a backend that admits one call. A turn
\* waits for a level-zero worker only behind other turns, every delegate starts
\* on its own level while its turn waits, and plugin calls share the backend
\* pool, so every turn ends, every session's title audit starts, a
\* delegate's result wake waits for its turn to end, and the server never runs
\* two calls.
CONSTANTS
  Roots = 2
  Levels = 3
  LevelWorkers = 1
  BackendLimit = 1
  PluginCalls = TRUE
  PermitAcrossTools = FALSE
  PluginOwnLimiter = FALSE
  AuxiliaryLane = TRUE
  TurnsEnd = TRUE
  SessionGate = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ServerWithinLimit
INVARIANT WorkersWithinLevels
INVARIANT OneTurnPerSession
PROPERTY AllDone
PROPERTY TitlesStart
CHECK_DEADLOCK FALSE
