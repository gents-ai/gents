\* GREEN. The paced case (#3803): two chunks, then the pause. The drive
\* waits on the writer's flush deadline, a due write is appended, and the
\* client reader wakes on the app store and the runtime documents.
\* EXPECTED: every invariant and property holds.
CONSTANTS
  Chunks <- MCChunks
  FlushTimer = TRUE
  AppendOnDue = TRUE
  WakeOnAppStore = TRUE
  Budget = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoWithheldDuringPause
INVARIANT ObservedBeforeCompletion
INVARIANT NoSpuriousFailure
PROPERTY ChunksReachClient
PROPERTY Completes
CHECK_DEADLOCK FALSE
