\* GREEN. A generated script is written by a short-lived child process the
\* test reaps before its exec (write_executable_script); siblings fork the
\* test process, which never holds a write descriptor of the script.
\* EXPECTED: every invariant holds.
CONSTANTS
  Siblings = {s1, s2}
  Writer = "child"
  WaitForWriter = TRUE
  ExecRefusesWriters = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoTextBusy
CHECK_DEADLOCK FALSE
