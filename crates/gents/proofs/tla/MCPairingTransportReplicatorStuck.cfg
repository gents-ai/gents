\* MODE B/C — connect OK, replicator install fails. Dialable = TRUE so the
\* connection establishes and the control-plane collections subscribe, but
\* ReplicatorInstallable = FALSE models a replicator install that can never
\* succeed: either add_replicator's SEPARATE transport dial keeps timing out
\* (MODE B) or a pre-dial check fails — collection-cid not_found / filter
\* validation (MODE C, which the shareable-address fix does NOT cover). The edge
\* reaches Connected + subscribed + ~replicatorInstalled and stays there.
\*
\* EXPECTED RESULT: this is the diagnostic that exhibits the durable PARTIAL ROW
\* ("subscribed collections, replicator_addresses = null"). TLC reports an
\* INVARIANT VIOLATION on PartialApplyHasProgress and returns that exact partial
\* state as the counterexample (InstallReplicator is disabled, so progress is
\* impossible — a silent dead end). ReplicatorLiveness and EndToEndLiveness are
\* also violated. TypeOK and ReplicationImpliesReplicator still hold. A
\* diagnostic demonstration, not a passing check.
CONSTANTS
  Dialable = TRUE
  ReplicatorInstallable = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReplicationImpliesReplicator
INVARIANT PartialApplyHasProgress
PROPERTY ReplicatorLiveness
PROPERTY EndToEndLiveness
CHECK_DEADLOCK FALSE
