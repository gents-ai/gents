\* expect: violates OneTurnPerSession
\* RED: the claim's session decision is load-bearing once one Agent has more
\* than one worker. With eight workers per level a spare worker dequeues the
\* delegate's result wake while its turn still runs; claimed without the
\* decision, the wake runs beside the turn and the session runs two turns at
\* once. One worker per level hid this: the turn held the only worker the wake
\* could take.
CONSTANTS
  Roots = 1
  Levels = 3
  LevelWorkers = 8
  BackendLimit = 1
  PluginCalls = FALSE
  PermitAcrossTools = FALSE
  PluginOwnLimiter = FALSE
  AuxiliaryLane = TRUE
  TurnsEnd = TRUE
  SessionGate = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ServerWithinLimit
INVARIANT WorkersWithinLevels
INVARIANT OneTurnPerSession
PROPERTY AllDone
CHECK_DEADLOCK FALSE
