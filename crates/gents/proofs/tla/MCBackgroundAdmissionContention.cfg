\* GREEN. The owned loop runs one turn's calls in order (`run_batch` awaits
\* each `on_tool_call`: dispatch start, admission, receipt), the admission
\* bumps the request sequence, and each sibling-contended transaction has
\* Max + 2 attempts, the scaled REQUEST_SIBLING_MAX_ATTEMPTS; a dispatch start
\* and a renewal poll have the Standard 4. The lease renews twice during the
\* turn under the cadence premise, with one due poll per lease period, and the
\* renewal owner re-drives a poll that admission bumps exhaust. The cohort
\* plus two overflow calls mirrors the regression. While a call is in flight
\* its only concurrent writers are the running children (at most Max) and at
\* most one renewal, so every attempt budget outlasts them.
\* EXPECTED: every invariant and EveryCallSettles hold.
CONSTANTS
  N = 4
  Max = 2
  Attempts = 4
  StartAttempts = 4
  RenewAttempts = 4
  Renewals = 2
  RenewTicks = 1
  SequentialAdmission = TRUE
  BumpSequence = TRUE
  RedriveLostPoll = TRUE
  RenewalSpaced = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT BudgetBound
INVARIANT NoConflictLoss
INVARIANT ReceiptOnce
INVARIANT LeaseLive
PROPERTY EveryCallSettles
CHECK_DEADLOCK FALSE
