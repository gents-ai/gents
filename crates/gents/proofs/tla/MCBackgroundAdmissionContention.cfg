\* GREEN. The owned loop admits one turn's calls in order (`run_batch` awaits
\* each `on_tool_call`), the admission bumps the request sequence, and each
\* contended transaction has Max + 2 attempts, the scaled
\* REQUEST_SIBLING_MAX_ATTEMPTS. The cohort plus two overflow calls mirrors the
\* regression. Only running children (at most Max) write the session while a
\* call is in flight, so every attempt budget outlasts them.
\* EXPECTED: every invariant and EveryCallSettles hold.
CONSTANTS
  N = 4
  Max = 2
  Attempts = 4
  SequentialAdmission = TRUE
  BumpSequence = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT BudgetBound
INVARIANT NoConflictLoss
INVARIANT ReceiptOnce
PROPERTY EveryCallSettles
CHECK_DEADLOCK FALSE
