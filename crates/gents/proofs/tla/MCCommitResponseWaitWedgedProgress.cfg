\* expect: holds
\* GREEN upstream design, not yet offered by DefraDB: the server publishes
\* each commit step and the client gives up after Ceiling ticks without one.
\* A live, working host schedules a step within MaxDelay < Ceiling, so only a
\* wedged or dead server is reported unknown, and keepalive is not needed.
\* EXPECTED: every invariant and ClientSettles hold.
CONSTANTS
  MaxWork = 3
  MaxDelay = 1
  Ceiling = 2
  Detector = "progress"
  Crashes = TRUE
  HostLoss = TRUE
  Keepalive = FALSE
  ServerBounded = FALSE
  Drops = FALSE
  OutcomeQuery = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT UnknownOnlyWithoutProgress
PROPERTY ClientSettles
CHECK_DEADLOCK FALSE
