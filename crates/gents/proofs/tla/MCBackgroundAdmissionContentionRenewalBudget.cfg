\* RED: the renewal is a real contender. An admission reads the lease
\* deadline to fence its write, so one renewal commit costs it an attempt on
\* top of the Max running children. Max + 1 attempts, which outlast the
\* children alone, lose to the children plus one renewal: the second of the
\* two extra attempts is the renewal's.
\* EXPECTED: NoConflictLoss VIOLATED.
CONSTANTS
  N = 4
  Max = 2
  Attempts = 3
  StartAttempts = 4
  RenewAttempts = 4
  Renewals = 1
  RenewTicks = 1
  SequentialAdmission = TRUE
  BumpSequence = TRUE
  RedriveLostPoll = TRUE
  RenewalSpaced = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT BudgetBound
INVARIANT NoConflictLoss
INVARIANT ReceiptOnce
INVARIANT LeaseLive

CHECK_DEADLOCK FALSE
