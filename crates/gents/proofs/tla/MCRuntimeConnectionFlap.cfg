\* GREEN. A flapping runtime: reachable, it accepts the arm and the snapshot
\* and then drops the stream at any time. The reconnect count resets only
\* after the source stayed connected for the stable period, so at most
\* `Flat` reconnects in a row wait the base delay, and a recovered runtime is
\* still re-armed within `Cap` ticks.
\* EXPECTED: every invariant holds.
CONSTANTS
  K = 2
  MaxGen = 4
  Flat = 1
  Cap = 4
  MaxAttempts = 4
  MaxEnv = 3
  MaxChan = 2
  Revocation = "served"
  RenewalAsFailure = FALSE
  MakeBeforeBreak = TRUE
  Capped = TRUE
  OmittedIsEmpty = TRUE
  NamedNoEndpoint = TRUE
  GenerationCheck = TRUE
  ArmBeforeReady = TRUE
  Drops = TRUE
  ResetOnConnect = FALSE
  KeepEnded = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ConnectedAfterArmedSnapshot
INVARIANT RemovalClears
INVARIANT NoEndpointNamed
INVARIANT NoCauselessReconnect
INVARIANT ReArmedWithinCap
INVARIANT FlapBounded
INVARIANT ReconnectsWaitTheBackoff
CHECK_DEADLOCK FALSE
