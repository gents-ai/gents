\* expect: holds
\* GREEN. Each read holds the cell's status lock from its nonce to keeping
\* what it read, a refused request reports how the record kept differs from
\* the one it presented, and a resend is minted from the cell.
CONSTANTS
  Serialized = TRUE
  MintFromCell = TRUE
  ReportSincePresented = TRUE
  MaxRestarts = 1
  MaxReclocks = 1
  Readers = {"a", "b", "c"}

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadsDoNotOverlap
PROPERTY AudienceNeverOlder
PROPERTY ClockNeverOlder
PROPERTY MintsNewest
PROPERTY ResendsExactlyWhenStale
PROPERTY EveryReaderSettles
CHECK_DEADLOCK FALSE
