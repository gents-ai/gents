\* expect: violates NoRetryAfterMarker
\* RED: the pass after an elapsed backoff plans without reading the
\* marker. A marker written during the wait, when the sleep wins before
\* the next tick, launches the retry.
CONSTANTS
  Writer = "any"
  TickChecksMarker = TRUE
  TopChecksMarker = FALSE
  Global = "target"
  BackoffUnreached = FALSE
  Backoff = 2
  MaxDelay = 1
  Ceiling = 8
  Window = 0

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoRetryAfterMarker
CHECK_DEADLOCK FALSE
