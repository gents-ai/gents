\* expect: holds
\* states: 50
\* The interrupt writes only the marker; the claim and the wake read it by id.
\* Session writes outnumber the interrupt's attempts and it still commits.
CONSTANTS
  Wakes = {w1, w2}
  Requests = {r1}
  OtherWrites = 2
  Attempts = 4
  ClaimReadsMarker = TRUE
  WakeReadsMarker = TRUE
  InterruptReads = FALSE

SPECIFICATION Spec
INVARIANT InterruptedRequestDoesNotRun
INVARIANT LaterArrivalsAreNewTurns
INVARIANT InterruptNotPrevented
PROPERTY InterruptCommits
