\* expect: holds
\* states: 50
\* Production: the marker's access check reads the session document, and the
\* claim, the wake and one other session write are fewer than the interrupt's
\* attempts, so it commits and covers what was active and pending at its commit.
CONSTANTS
  Wakes = {w1}
  Requests = {r1}
  OtherWrites = 1
  Attempts = 4
  ClaimReadsMarker = TRUE
  WakeReadsMarker = TRUE
  InterruptReads = TRUE

SPECIFICATION Spec
INVARIANT InterruptedRequestDoesNotRun
INVARIANT LaterArrivalsAreNewTurns
INVARIANT InterruptNotPrevented
PROPERTY InterruptCommits
CHECK_DEADLOCK FALSE
