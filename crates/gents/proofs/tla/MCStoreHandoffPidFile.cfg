\* RED by design. Exclusion by a pid file instead of an OS lock: a holder
\* that crashes keeps the store, and the next process is refused by a dead
\* one.
\* EXPECTED: CrashedHolderNeverBlocks VIOLATED.
CONSTANTS
  H = h
  Acquirers = {a1, a2}
  AckAfterRelease = TRUE
  MarkReleasing = TRUE
  WaitOnReleasing = TRUE
  BoundedWait = TRUE
  KernelReleasesOnExit = FALSE
  CanCrash = TRUE
  CanHang = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NeverTwoHolders
INVARIANT CrashedHolderNeverBlocks
CHECK_DEADLOCK FALSE
