\* RED by design. Writers of different keys with every file guard on: the
\* read after the rename tells a writer what it saw, but a later rename
\* replaces a file an earlier writer accepted. The single-winner key, not
\* the metadata writer, is what keeps writers of one home in agreement.
\* EXPECTED: AgreedInstall VIOLATED.
CONSTANTS
  Writers = {w1, w2}
  UniqueStaging = TRUE
  RemoveBeforeRename = FALSE
  Reread = TRUE
  SingleWinnerKey = FALSE
  CanCrash = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT OkSawOwnMetadata
INVARIANT AgreedInstall
CHECK_DEADLOCK FALSE
