\* expect: violates ServerWithinLimit
\* RED: plugin calls sharing the backend pool is load-bearing. A limiter of
\* their own sized like the backend lets a delegate's plugin call run beside
\* another turn's model call, two calls at a server that admits one.
CONSTANTS
  Roots = 2
  Levels = 3
  LevelWorkers = 2
  BackendLimit = 1
  PluginCalls = TRUE
  PermitAcrossTools = FALSE
  PluginOwnLimiter = TRUE
  AuxiliaryLane = TRUE
  TurnsEnd = TRUE
  SessionGate = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ServerWithinLimit
INVARIANT WorkersWithinLevels
INVARIANT OneTurnPerSession
PROPERTY AllDone
CHECK_DEADLOCK FALSE
