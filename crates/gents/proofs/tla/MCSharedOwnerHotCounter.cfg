\* GREEN. Three writers, two increments each, through a gate of two permits
\* (fewer than the writers, so the gate is contended), the owner's four
\* attempts, and a commit phase that may time out with its landing unknown.
\* EXPECTED: every invariant and EveryCallSettles hold.
CONSTANTS
  Writers = {w1, w2, w3}
  Iters = 2
  Attempts = 4
  Capacity = 2
  BoundedRetry = TRUE
  CanTimeout = TRUE
  CheckDeadline = FALSE
  Deadline = 0
  ReadOutsideTxn = FALSE
  StaleRetry = FALSE
  ConflictAsSuccess = FALSE
  RetryAmbiguous = FALSE
  LostWakeup = FALSE
  AbortOnOpenWriter = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AckedApplied
INVARIANT ConflictNotApplied
INVARIANT NoDoubleApply
INVARIANT NoLostUpdate
INVARIANT TestAccounting
INVARIANT AttemptBound
INVARIANT PermitsAccounted
PROPERTY EveryCallSettles
CHECK_DEADLOCK FALSE
