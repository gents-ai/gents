\* expect: violates ReopenSucceeds
\* RED by design: the shutdown stops waiting for a task at its deadline and
\* returns while the task's worker has not yet polled it.
\* EXPECTED: ReopenSucceeds VIOLATED (Signal, GiveUp(t1), Joined or GiveUp
\* for t2, Return, Drop, Open: the opener finds the directory locked).
CONSTANTS
  Tasks = {t1, t2}
  JoinTasks = FALSE
  AwaitDirectory = FALSE
  CanWedge = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReopenSucceeds
CHECK_DEADLOCK FALSE
