\* expect: violates AliasAcyclic
\* RED: the guard a carried insert writes is load-bearing. A carry that
\* admits 2 -> 1 inside its transaction but writes no guard is admitted on a
\* read without the concurrent merge of 1 into 2, which is admitted on a
\* read without the carried row; they insert different unique
\* `from_problem_key` values, both commit, and the alias rows form a cycle.
CONSTANTS
  Requests = {r1, r2}
  Keys = {1, 2, 3}
  Seeded = {1, 2}
  Steps = 2
  Guard = TRUE
  AdmitInTxn = TRUE
  MinBreak = TRUE
  AppendOnly = TRUE
  Carried <- MCCarried
  CarryAdmits = TRUE
  CarryGuard = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttemptLost
INVARIANT ResolveDeterministic
INVARIANT AliasAcyclic
CHECK_DEADLOCK FALSE
