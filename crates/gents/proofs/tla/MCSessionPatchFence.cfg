\* expect: holds
\* GREEN. The scoped fence: a patch is rejected only by a step that reaches
\* its scope, and a rejected patch is read again without asking for the node.
\* Two scopes, one quiet; two concurrent readers; two writes of the busy
\* scope and a renewal of it during every patch read.
\* EXPECTED: every invariant and property holds.
CONSTANTS
  Sessions = {"open", "busy"}
  Quiet = {"open"}
  Readers = {"r1", "r2"}
  MaxWrites = 2
  K = 1
  Fence = "scope"
  PatchMovesScope = TRUE
  ReloadMovesScope = TRUE
  RejectResyncs = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY NoOlderRow
PROPERTY Convergence
PROPERTY QuietPatchPublishes
CHECK_DEADLOCK FALSE
