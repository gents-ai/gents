  Calls = {c1, c2}
  Tracked = TRUE
  FinalizerCounted = FALSE
  ShutdownAwaitsFlush = TRUE
  TerminalCas = TRUE
  Recovery = TRUE
  CanShutdown = TRUE
  CanExitAbruptly = FALSE
  Signal = "flush"
  Target = "terminal"
  SubscribeFirst = TRUE
  PollBudget = 2
  AfterRequest = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT GracefulExitFlushed
