\* expect: violates AckedHandoff
\* RED by design: `gents init` before the fix. Init holds the store while it
\* provisions the home, shuts its node down, drops its claim and returns; its
\* return is the acknowledgement its caller acts on (a second init, an archive
\* of the home, a reopen in the same process). It returned without awaiting
\* the release, which declares itself only as the claim drops, and its own
\* opener (`lock_init_store`) refuses any held lock, declared or not.
\* EXPECTED: AckedHandoff VIOLATED (BeginStop, Ack, Start, TryLock:
\* an init that starts after the previous init returned finds it still
\* releasing and is refused with "still shutting down").
CONSTANTS
  H = h
  Acquirers = {a1, a2}
  AckAfterRelease = FALSE
  MarkReleasing = TRUE
  WaitOnReleasing = FALSE
  BoundedWait = TRUE
  KernelReleasesOnExit = TRUE
  CloseReleasesDirectory = FALSE
  ReleaseWaitsForDirectory = TRUE
  ReleaseByShutdownOwner = TRUE
  OtherAccess = TRUE
  HolderOutlivesAck = FALSE
  CanAbandon = TRUE
  CanCrash = TRUE
  CanHang = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NeverTwoHolders
INVARIANT AckedHandoff
CHECK_DEADLOCK FALSE
