\* RED by design: the code before the #3820 fix. The driver re-polls the
\* generator through `select!` and the generator awaits the provider-work
\* reply, both suspension points, so the biased interrupt branch can drop the
\* stream while a received chunk sits in the reply.
\* EXPECTED: NoReceivedOutputDropped VIOLATED.
CONSTANTS
  Chunks = 2
  AtomicHandoff = FALSE
  DrainFlushes = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoReceivedOutputDropped
INVARIANT TerminalOnce
CHECK_DEADLOCK FALSE
