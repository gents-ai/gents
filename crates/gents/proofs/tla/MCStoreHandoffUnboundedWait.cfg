\* RED by design. An acquirer waits for a declared release with no
\* deadline: a shutdown that wedges, or another process that takes the
\* store first and keeps it, leaves it waiting forever.
\* EXPECTED: AcquirerSettles VIOLATED.
CONSTANTS
  H = h
  Acquirers = {a1, a2}
  AckAfterRelease = TRUE
  MarkReleasing = TRUE
  WaitOnReleasing = TRUE
  BoundedWait = FALSE
  KernelReleasesOnExit = TRUE
  CanCrash = TRUE
  CanHang = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NeverTwoHolders
PROPERTY AcquirerSettles
CHECK_DEADLOCK FALSE
