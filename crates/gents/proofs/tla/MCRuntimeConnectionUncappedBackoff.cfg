\* RED by design. The reconnect backoff doubles without a cap: after enough
\* consecutive outages a recovered runtime waits longer than `Cap` ticks
\* before the source dials it again.
\* EXPECTED: ReconnectBounded VIOLATED.
CONSTANTS
  K = 2
  MaxGen = 4
  Flat = 2
  Cap = 2
  MaxAttempts = 3
  MaxEnv = 3
  MaxChan = 2
  Revocation = "served"
  RenewalAsFailure = FALSE
  MakeBeforeBreak = TRUE
  Capped = FALSE
  OmittedIsEmpty = TRUE
  NamedNoEndpoint = TRUE
  GenerationCheck = TRUE
  ArmBeforeReady = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReconnectBounded
CHECK_DEADLOCK FALSE
