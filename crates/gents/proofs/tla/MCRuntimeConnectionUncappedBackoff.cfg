\* RED by design. The reconnect backoff doubles without a cap: after three
\* consecutive failed reconnects to an unreachable runtime (1, 2, 4 ticks),
\* the runtime recovers while the source waits 8 ticks, so it is re-armed
\* more than `Cap` ticks after it began answering.
\* EXPECTED: ReArmedWithinCap VIOLATED.
CONSTANTS
  K = 2
  MaxGen = 4
  Flat = 1
  Cap = 4
  MaxAttempts = 4
  MaxEnv = 3
  MaxChan = 2
  Revocation = "served"
  RenewalAsFailure = FALSE
  MakeBeforeBreak = TRUE
  Capped = FALSE
  OmittedIsEmpty = TRUE
  NamedNoEndpoint = TRUE
  GenerationCheck = TRUE
  ArmBeforeReady = TRUE
  Drops = FALSE
  ResetOnConnect = FALSE
  KeepEnded = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReArmedWithinCap
CHECK_DEADLOCK FALSE
