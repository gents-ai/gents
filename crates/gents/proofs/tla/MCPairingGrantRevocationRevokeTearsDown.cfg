\* RED by design: option (b), the withdrawal removing the collection from the
\* route in the same step. An install whose recheck preceded the withdrawal
\* still lands after it and backfills.
\* EXPECTED: StrictNoLeak VIOLATED.
CONSTANTS
  RecheckBeforeInstall = TRUE
  ObserverNeedsRoute = TRUE
  Churn = TRUE
  RevokeTearsDown = TRUE
  PushChecksGrant = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoStaleInstall
INVARIANT StrictNoLeak
CHECK_DEADLOCK FALSE
