\* expect: holds
\* GREEN, the delivered client: no detector of its own, TCP keepalive on
\* the connection, a server that answers every commit it works on and may die
\* or take its host with it. The connection does not break under a live
\* server (loopback; DefraDB closes only idle keep-alive connections, which
\* the pool retires first).
\* EXPECTED: every invariant and ClientSettles hold.
CONSTANTS
  MaxWork = 3
  MaxDelay = 1
  Ceiling = 2
  Detector = "none"
  Crashes = TRUE
  HostLoss = TRUE
  Keepalive = TRUE
  ServerBounded = TRUE
  Drops = FALSE
  OutcomeQuery = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT UnknownOnlyWithoutProgress
PROPERTY ClientSettles
CHECK_DEADLOCK FALSE
