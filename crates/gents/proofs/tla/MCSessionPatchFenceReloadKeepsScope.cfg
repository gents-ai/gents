\* expect: violates NoOlderRow
\* RED: a scope reload does not reject the patches of its scope.
\* EXPECTED: NoOlderRow VIOLATED (a patch read before a write publishes after
\* a reload that read after it, while the write's event is undelivered).
CONSTANTS
  Sessions = {"open", "busy"}
  Quiet = {"open"}
  Readers = {"r1", "r2"}
  MaxWrites = 2
  K = 1
  Fence = "scope"
  PatchMovesScope = TRUE
  ReloadMovesScope = FALSE
  RejectResyncs = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY NoOlderRow
CHECK_DEADLOCK FALSE
