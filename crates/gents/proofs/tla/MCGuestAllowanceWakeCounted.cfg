\* RED, the shipped ticker (afterburner f6d6d3f): one increment per wake.
\* With every wake late the allowance is counted in wake-ups and the guest
\* runs A * Late past it.
\* EXPECTED: StopsAtAllowance fails; EveryGuestReleased still holds (the stop
\* is late, not lost).
CONSTANTS
  P = 2
  A = 4
  Late = 2
  MaxCompile = 2
  CatchUp = FALSE
  EpochChecked = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT StopsAtAllowance
INVARIANT ReleaseFollowsStop
PROPERTY EveryGuestReleased
CHECK_DEADLOCK FALSE
