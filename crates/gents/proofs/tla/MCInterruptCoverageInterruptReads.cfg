\* expect: violates InterruptNotPrevented
\* The safeguard removed: the interrupt reads the session document, so as many
\* session writes as it has attempts each abort one and it fails.
CONSTANTS
  Wakes = {w1, w2}
  Requests = {r1}
  OtherWrites = 2
  OtherInterrupts = 0
  Attempts = 4
  ClaimReadsMarker = TRUE
  WakeReadsMarker = TRUE
  InterruptReads = TRUE

SPECIFICATION Spec
INVARIANT InterruptedRequestDoesNotRun
INVARIANT LaterArrivalsAreNewTurns
INVARIANT InterruptNotPrevented
PROPERTY InterruptCommits
CHECK_DEADLOCK FALSE
