\* expect: violates InterruptNotPrevented
\* The premise dropped: as many session writes land during the interrupt's
\* attempts as it has attempts, and each aborts one, so the interrupt fails.
CONSTANTS
  Wakes = {w1, w2}
  Requests = {r1}
  OtherWrites = 2
  Attempts = 4
  ClaimReadsMarker = TRUE
  WakeReadsMarker = TRUE
  InterruptReads = TRUE

SPECIFICATION Spec
INVARIANT InterruptedRequestDoesNotRun
INVARIANT LaterArrivalsAreNewTurns
INVARIANT InterruptNotPrevented
PROPERTY InterruptCommits
CHECK_DEADLOCK FALSE
