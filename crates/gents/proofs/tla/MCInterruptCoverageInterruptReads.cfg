\* expect: violates InterruptNotPrevented
\* The interrupt reads the session document instead of writing the marker:
\* the claims, wakes and other writes abort every attempt.
CONSTANTS
  Wakes = {w1, w2}
  Requests = {r1}
  OtherWrites = 2
  Attempts = 4
  ClaimReadsMarker = TRUE
  WakeReadsMarker = TRUE
  InterruptReads = TRUE

SPECIFICATION Spec
INVARIANT InterruptedRequestDoesNotRun
INVARIANT LaterArrivalsAreNewTurns
INVARIANT InterruptNotPrevented
PROPERTY InterruptCommits
CHECK_DEADLOCK FALSE
