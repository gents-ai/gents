\* expect: violates QuietPatchPublishes
\* RED: the scoped fence, but a rejected patch still asks the observer for the
\* node (the code before the change). One reader.
\* EXPECTED: QuietPatchPublishes VIOLATED (a rejected patch of the busy scope
\* reloads every scope; the reload's publication rejects the quiet scope's
\* patch in flight, which asks for the node again, forever).
CONSTANTS
  Sessions = {"open", "busy"}
  Quiet = {"open"}
  Readers = {"r1"}
  MaxWrites = 2
  K = 1
  Fence = "scope"
  PatchMovesScope = TRUE
  ReloadMovesScope = TRUE
  RejectResyncs = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY NoOlderRow
PROPERTY Convergence
PROPERTY QuietPatchPublishes
CHECK_DEADLOCK FALSE
