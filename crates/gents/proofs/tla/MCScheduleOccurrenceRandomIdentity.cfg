\* expect: violates AtMostOneRequestPerOccurrence
\* RED: the occurrence identity is load-bearing. With a random request identity
\* and the cursor written after the dispatch, a tick that reads the cursor
\* before the write lands (or after it failed, or after a restart) dispatches
\* the same occurrence again and a second request commits.
CONSTANTS
  Occurrences = 2
  MaxDispatches = 4
  MaxRestarts = 1
  Keyed = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AtMostOneRequestPerOccurrence
CHECK_DEADLOCK FALSE
