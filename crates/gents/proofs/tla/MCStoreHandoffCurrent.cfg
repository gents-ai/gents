\* RED by design: the code before the fix. A client installation answers
\* retire as soon as it accepts it and closes its store afterwards, a
\* stopping holder declares nothing, and an acquirer refuses any held lock.
\* EXPECTED: AckedHandoff VIOLATED (BeginStop, Ack, Start, TryLock: the
\* restarted client finds the retired installation still holding the store
\* and is refused with "already using").
CONSTANTS
  H = h
  Acquirers = {a1, a2}
  AckAfterRelease = FALSE
  MarkReleasing = FALSE
  WaitOnReleasing = FALSE
  BoundedWait = TRUE
  KernelReleasesOnExit = TRUE
  CanCrash = TRUE
  CanHang = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NeverTwoHolders
INVARIANT AckedHandoff
