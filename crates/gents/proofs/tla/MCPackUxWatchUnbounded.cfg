\* RED: the reviewed retry. Without a budget a stopped runtime is retried
\* forever and never reported. EXPECTED: EventualResume VIOLATED.
CONSTANTS
  RetryTransient = TRUE
  Reacquire = TRUE
  CancelOnSelect = TRUE
  CancelBeforeSelect = TRUE
  AtomicDeliver = TRUE
  CancelOnDestroy = TRUE
  NotifyStall = TRUE
  KeepFailuresOnAccept = TRUE
  BoundedRetry = FALSE
  Hazards = {"stop"}
  RetryBudget = 4
  OutageAttempts = 1
  MaxRestarts = 0
  MaxFaults = 0
  MaxRev = 1
  MaxSelects = 0

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoCrossNodeDelivery
INVARIANT RegistryReleased
INVARIANT NotSilent
INVARIANT TerminalNamed
PROPERTY EventualResume
PROPERTY NoLeakedWatch
PROPERTY EntryReleased
