\* RED by design. The test's order on Linux: the test process writes the
\* script while siblings fork, and a child holding the write descriptor
\* has not exec'd yet when the script is exec'd.
\* EXPECTED: NoTextBusy VIOLATED.
CONSTANTS
  Siblings = {s1, s2}
  InProcessWrite = TRUE
  ExecRefusesWriters = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoTextBusy
CHECK_DEADLOCK FALSE
