\* expect: violates NoTextBusy
\* RED by design. The test's old order on Linux: the test process writes
\* the script (with O_CLOEXEC, as std always opens) while siblings fork,
\* and a child holding the write descriptor has not exec'd yet when the
\* script is exec'd. O_CLOEXEC alone does not close this window.
\* EXPECTED: NoTextBusy VIOLATED.
CONSTANTS
  Siblings = {s1, s2}
  Writer = "test"
  WaitForWriter = TRUE
  ExecRefusesWriters = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoTextBusy
CHECK_DEADLOCK FALSE
