\* expect: violates ResendsExactlyWhenStale
\* RED. Ordered reads, but a refused request reports only what its own read
\* changed: queued behind a peer that kept the newer audience, its read
\* changes nothing and the request minted for the audience the home left is
\* told instead of sent again (#3963).
CONSTANTS
  Serialized = TRUE
  MintFromCell = TRUE
  ReportSincePresented = FALSE
  MaxRestarts = 1
  MaxReclocks = 0
  Readers = {"a", "b"}

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReadsDoNotOverlap
PROPERTY AudienceNeverOlder
PROPERTY ClockNeverOlder
PROPERTY MintsNewest
PROPERTY ResendsExactlyWhenStale
