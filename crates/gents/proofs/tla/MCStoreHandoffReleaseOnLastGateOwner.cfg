\* when the last owner of the node's write gate drops it, and another access on
\* the node is held across the shutdown: the release waits for that access,
\* whose holder drops it only once the shutdown returned.
\* EXPECTED: StopAcknowledged VIOLATED (the hangs of
\* `desired_materialization_rechecks_signed_authority_before_writing` and of
\* #3929).
