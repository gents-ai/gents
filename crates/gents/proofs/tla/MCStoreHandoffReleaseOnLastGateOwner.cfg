  AckAfterRelease = TRUE
  MarkReleasing = TRUE
  WaitOnReleasing = TRUE
  BoundedWait = TRUE
  KernelReleasesOnExit = TRUE
  CloseReleasesDirectory = TRUE
  ReleaseWaitsForDirectory = TRUE
  ReleaseByShutdownOwner = FALSE
  OtherAccess = TRUE
  HolderOutlivesAck = TRUE
  CanAbandon = TRUE
  CanCrash = TRUE
  CanHang = TRUE

