\* GREEN. Every guard on: run() reads in full once the listener resolves, a
\* rejected registration is retried, a waiting phase is re-read within its
\* budget and then offers retry, and a reply that cannot be shown fails
\* visibly, and a read whose selection moved leaves the moved selection's read
\* queued. One rejection, one bridge mismatch, one selection change, silent
\* and noticed arrival are all explored.
\* EXPECTED: TypeOK, ViewConverges and NoStuckPending hold.
CONSTANTS
  MaxVersion = 2
  ListenFailures = 1
  Mismatches = 1
  Selections = 1
  RereadBudget = 2
  InitialRead = TRUE
  FullAfterListen = TRUE
  Relisten = TRUE
  PendingReread = TRUE
  MismatchExit = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT MovedReadQueued
PROPERTY ViewConverges
PROPERTY NoStuckPending
CHECK_DEADLOCK FALSE
