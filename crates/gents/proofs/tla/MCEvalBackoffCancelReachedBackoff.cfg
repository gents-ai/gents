\* expect: violates TestPasses
\* RED: a reachable backoff. The run ends either way, so the test needs
\* an elapsed-time bound to tell the marker's end from the sleep's; a host
\* that delays the next tick past the backoff lets the sleep win.
CONSTANTS
  Writer = "test"
  TickChecksMarker = TRUE
  TopChecksMarker = TRUE
  Global = "target"
  BackoffUnreached = FALSE
  Backoff = 1
  MaxDelay = 1
  Ceiling = 8
  Window = 0

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT TestPasses
INVARIANT NoRetryAfterMarker
CHECK_DEADLOCK FALSE
