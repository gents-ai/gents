\* expect: holds
\* GREEN. The product: a marker written at any point of the run, against
\* a reachable backoff, is never missed. No retry launches once it exists
\* and the run stops.
CONSTANTS
  Writer = "any"
  TickChecksMarker = TRUE
  TopChecksMarker = TRUE
  Global = "target"
  BackoffUnreached = FALSE
  Backoff = 2
  MaxDelay = 1
  Ceiling = 8
  Window = 0

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoRetryAfterMarker
PROPERTY MarkerStopsRun
CHECK_DEADLOCK FALSE
