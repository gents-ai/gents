\* expect: holds
\* states: 100
\* Two occurrences, four dispatches and a restart, with every cursor write free
\* to land in any order, lag or fail: the occurrence's retry key answers every
\* re-dispatch with its one request, and concurrent dispatches of one
\* occurrence meet at the unique index.
CONSTANTS
  Occurrences = 2
  MaxDispatches = 4
  MaxRestarts = 1
  Keyed = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT AtMostOneRequestPerOccurrence
CHECK_DEADLOCK FALSE
