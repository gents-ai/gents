\* expect: violates UnknownOnlyWithoutProgress
\* RED by design: the connection breaks under a live server and the client
\* has no outcome query (the delivered client on a network that can drop a
\* connection). It cannot tell a commit that never arrived from one that
\* landed, so it reports a live server's outcome unknown.
\* EXPECTED: UnknownOnlyWithoutProgress VIOLATED.
CONSTANTS
  MaxWork = 3
  MaxDelay = 1
  Ceiling = 2
  Detector = "none"
  Crashes = TRUE
  HostLoss = TRUE
  Keepalive = TRUE
  ServerBounded = TRUE
  Drops = TRUE
  OutcomeQuery = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Agreement
INVARIANT UnknownOnlyWithoutProgress
PROPERTY ClientSettles
CHECK_DEADLOCK FALSE
