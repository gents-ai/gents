\* RED: the native reading before set-aside (`DeliveryUnconfirmed` with no way
\* out). The same send's original commit aborts after the bytes are lost; the
\* owner never shows it, so every check stays unconfirmed and the saved
\* message can be neither dismissed nor replaced.
\* EXPECTED: CreatedOnce holds; UnconfirmedResolves VIOLATED (stuck).
CONSTANTS
  Publications = 1
  Attempts = 2
  Redrive = TRUE
  ReserveRedrive = TRUE
  LostResponse = TRUE
  Recovery = TRUE
  BytesLost = TRUE
  ReplayIdentical = TRUE
  OwnerReachable = TRUE
  ReplayRejects = FALSE
  SetAsideOffered = FALSE
  UnretainedPolicy = "wait"

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT CreatedOnce
PROPERTY UnconfirmedResolves
CHECK_DEADLOCK FALSE
