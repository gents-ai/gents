\* RED: the client does not keep the payload of an unconfirmed message (an
\* in-memory send lost on restart). A failed message then has no Retry: the
\* person can only discard it or retype it as a new message.
\* EXPECTED: FailedOffersRetry VIOLATED (the dropped payload breaks
\* RetainedUntilConfirmed first; this config checks the stuck state).
CONSTANTS
  Publications = 0
  Attempts = 1
  Redrive = TRUE
  ReserveRedrive = TRUE
  LostReply = TRUE
  Refusals = FALSE
  MaxSends = 2
  RetryFreshId = FALSE
  PayloadLost = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT CreatedOnce
INVARIANT FailedOffersRetry
CHECK_DEADLOCK FALSE
