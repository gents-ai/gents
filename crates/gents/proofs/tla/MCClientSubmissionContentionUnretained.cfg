\* RED: the rejected `.refused` reading of an unproven send without retained
\* bytes (Lean `ClientSubmissionReceipt.result`). The response is lost while
\* the original commit is in flight, the caller loses the bytes, the owner
\* shows nothing yet, and the person is told it was not delivered.
\* EXPECTED: NotDeliveredIsProven VIOLATED (and CreatedOnce, once the person
\* resends and the original lands).
CONSTANTS
  Publications = 1
  Attempts = 2
  Redrive = TRUE
  ReserveRedrive = TRUE
  LostResponse = TRUE
  Recovery = TRUE
  BytesLost = TRUE
  ReplayIdentical = TRUE
  OwnerReachable = TRUE
  ReplayRejects = FALSE
  SetAsideOffered = TRUE
  UnretainedPolicy = "refuse"

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoConflictLoss
INVARIANT NotDeliveredIsProven
INVARIANT CreatedOnce
CHECK_DEADLOCK FALSE
