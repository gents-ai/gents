\* RED by design. The rejected reconcile: a source whose task ended (every
\* stream failure now ends it) is dropped by an unrelated directory
\* reconcile before its end notice is applied and restarted at once, so the
\* reconnect skips its backoff.
\* EXPECTED: ReconnectsWaitTheBackoff VIOLATED.
CONSTANTS
  K = 2
  MaxGen = 4
  Flat = 1
  Cap = 4
  MaxAttempts = 4
  MaxEnv = 3
  MaxChan = 2
  Revocation = "served"
  RenewalAsFailure = FALSE
  MakeBeforeBreak = TRUE
  Capped = TRUE
  OmittedIsEmpty = TRUE
  NamedNoEndpoint = TRUE
  GenerationCheck = TRUE
  ArmBeforeReady = TRUE
  Drops = FALSE
  ResetOnConnect = FALSE
  KeepEnded = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReconnectsWaitTheBackoff
CHECK_DEADLOCK FALSE
