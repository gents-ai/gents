\* RED diagnostic: with green's constants, admission bumps can exhaust a
\* renewal poll, so the re-drive is load-bearing; green proves the re-driven
\* poll keeps the lease live.
\* EXPECTED: RenewalNeverLost VIOLATED.
CONSTANTS
  N = 4
  Max = 2
  Attempts = 4
  StartAttempts = 4
  RenewAttempts = 4
  Renewals = 2
  RenewTicks = 1
  SequentialAdmission = TRUE
  BumpSequence = TRUE
  RedriveLostPoll = TRUE
  RenewalSpaced = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT RenewalNeverLost

CHECK_DEADLOCK FALSE
