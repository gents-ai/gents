\* expect: holds
\* The shutdown returns only once every background task dropped its handle,
\* so the caller's drop of the node frees the directory and the next open
\* takes it.
CONSTANTS
  Tasks = {t1, t2}
  JoinTasks = TRUE
  AwaitDirectory = FALSE
  CanWedge = FALSE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT ReopenSucceeds
INVARIANT ReturnReleasesEngine
PROPERTY OwnerOpens
CHECK_DEADLOCK FALSE
