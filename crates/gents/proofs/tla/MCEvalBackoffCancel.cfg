\* expect: holds
\* GREEN. The test: a global default enables the runner's target, the
\* backoff is unreached, and the observer waits on what it watches under
\* the hang ceiling. The test passes under every schedule and settles.
CONSTANTS
  Writer = "test"
  TickChecksMarker = TRUE
  TopChecksMarker = TRUE
  Global = "target"
  BackoffUnreached = TRUE
  Backoff = 2
  MaxDelay = 1
  Ceiling = 8
  Window = 0

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT TestPasses
INVARIANT NoRetryAfterMarker
PROPERTY ObserverSettles
PROPERTY MarkerStopsRun
CHECK_DEADLOCK FALSE
