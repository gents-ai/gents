\* expect: holds
\* states: 51000
\* The cycle break on its own: without the guard the alias rows can hold a
\* cycle (`NoGuard`), and the minimum-key break still resolves every key of
\* a merged problem to one problem and every attempt to a problem that
\* exists. AliasAcyclic is not checked here.
CONSTANTS
  Requests = {r1, r2}
  Keys = {1, 2, 3}
  Seeded = {1, 2}
  Steps = 2
  Guard = FALSE
  AdmitInTxn = TRUE
  MinBreak = TRUE
  AppendOnly = TRUE

SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoAttemptLost
INVARIANT ResolveDeterministic
CHECK_DEADLOCK FALSE
