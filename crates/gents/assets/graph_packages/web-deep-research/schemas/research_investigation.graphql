type WebResearchInvestigation {
  run_id: String @index @immutable
  assignment_id: String @index(unique: true) @immutable
  expected_total: String @immutable
  requested_source_count: String
  candidate_count: String
  scrape_attempt_count: String
  evidence_shortfall: String
  accepted_search_engines: String
  search_degradation: String
  retrieval_failures: String
  status: String
  summary: String
  gaps: String
}
