[package]
name = "gents-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared schemas, client turn-observation protocol, and collection row mirrors for gents"

[dependencies]
anyhow = { workspace = true }
bs58 = "0.5"
chrono = { workspace = true }
ciborium = "0.2"
gents-schemas = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

# rig-core is dev-only: the golden byte-compat tests in src/message.rs compare
# native serialization against live rig until Layer A removes rig entirely.
[dev-dependencies]
axum = "0.8"
rig-core.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "macros"] }
