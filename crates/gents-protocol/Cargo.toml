[package]
name = "gents-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared schemas, client turn-observation protocol, and collection row mirrors for Gents"

# `native` gates the reqwest-based GraphQL transport (`graphql::execute_graphql_async`,
# `execute_graphql_blocking`, `graphql_endpoint_available`): reqwest has no
# wasm32-wasip1 support, so a guest-compilable dependent (gents-loop) pulls
# this crate with `default-features = false` and never links it. Every other
# module (message, row, canonical, ...) is native/guest agnostic and always on.
[features]
default = ["native"]
native = ["dep:reqwest"]

[dependencies]
anyhow = { workspace = true }
bs58 = "0.5"
chrono = { workspace = true }
ciborium = "0.2"
gents-schemas = { workspace = true }
reqwest = { workspace = true, features = ["blocking"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
# Not `workspace = true`: the workspace's tokio pins `features = ["full"]`,
# which is unsupported on wasm32-wasip1 (only sync, macros, io-util, rt, time
# exist there) and workspace-inherited features only ever union, never
# subtract. An explicit, minimal feature list keeps this crate guest-buildable.
tokio = { version = "1", default-features = false, features = ["time"] }
tracing = { workspace = true }

# rig-core is dev-only: the golden byte-compat tests in src/message.rs compare
# native serialization against live rig until Layer A removes rig entirely.
[dev-dependencies]
axum = "0.8"
rig-core.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "macros"] }
