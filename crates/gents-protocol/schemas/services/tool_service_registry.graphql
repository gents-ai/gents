type ToolServiceRegistry @branchable @index(fields: ["node_did", "service_id"], unique: true) {
    service_id: String @index
    node_did: String @index
    display_name: String
    description: String
    hostname: String @index
    tailscale_ip: String
    lan_ip: String
    mcp_port: Int
    mcp_path: String
    send_node_did: Boolean
    enabled: Boolean @index
    tags: [String]
    status: String @index
    version: String
    updated_at: DateTime @index(direction: DESC)
}
