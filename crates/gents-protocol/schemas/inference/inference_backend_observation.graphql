type InferenceBackendObservation @policy(id: "$household", resource: "configuration") @index(fields: ["node_did", "backend_id"], unique: true) {
    node_did: String @index
    backend_id: String
    metadata_doc_id: String
    catalogs: JSON
    catalog_freshness: JSON
    last_probe: DateTime
    probe_status: String @index
    updated_at: DateTime
}
