type InferenceExecution @branchable @index(fields: ["agent_did", "execution_id"], unique: true) {
    execution_id: String
    agent_did: String @index
    display_name: String
    max_turns: Int
    max_total_tokens: Int
    stream_batch_ms: Int
    stream_liveness_timeout_secs: Int
    deadline_duration_secs: Int
    retry_policy_id: String @index
    tags: [String!]
    updated_at: DateTime @index(direction: DESC)
}
