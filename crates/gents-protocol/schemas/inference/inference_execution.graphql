type InferenceExecution @policy(id: "$household", resource: "configuration") @index(fields: ["node_did", "execution_id"], unique: true) {
    execution_id: String
    node_did: String @index
    display_name: String
    max_turns: Int
    max_total_tokens: Int
    max_invalid_tool_calls: Int
    repeated_tool_failure_limit: Int
    max_request_retries: Int
    stream_batch_ms: Int
    stream_liveness_timeout_secs: Int
    provider_idle_timeout_secs: Int
    title_timeout_secs: Int
    deadline_duration_secs: Int
    retry_policy_id: String @index
    tags: [String!]
    updated_at: DateTime @index(direction: DESC)
}
