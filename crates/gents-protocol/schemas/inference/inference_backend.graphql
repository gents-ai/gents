type InferenceBackend @index(fields: ["agent_did", "backend_id"], unique: true) {
    backend_id: String
    agent_did: String @index
    name: String @index
    provider_kind: String
    openai_wire_api: String
    endpoint: String
    auth: JSON
    connect_timeout_secs: Int
    discovery_timeout_secs: Int
    max_concurrent: Int
    max_queue_depth: Int
    enabled: Boolean @index
    tags: [String!]
    # Runtime observations are excluded from desired configuration writes.
    catalogs: JSON
    last_probe: DateTime
    probe_status: String @index
    updated_at: DateTime @index(direction: DESC)
}
