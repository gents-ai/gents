type InferenceRetryPolicy @policy(id: "$household", resource: "configuration") @index(fields: ["node_did", "retry_policy_id"], unique: true) {
    retry_policy_id: String
    node_did: String @index
    display_name: String
    max_transport_retries: Int
    backoff_ms: [Int]
    max_resample_retries: Int
    allow_repair: Boolean
    interactive_max_retries: Int
    max_rate_limit_wait_ms: Int
    tags: [String!]
    updated_at: DateTime @index(direction: DESC)
}
