type WebResearchSource {
  run_id: String @index @immutable
  source_id: String @index(unique: true) @immutable
  assignment_id: String @index
  url: String
  title: String
  publisher: String
  source_kind: String
  primary_source: String
  published_at: String
  fetched_at: String
  fetch_id: String @index
  content_hash: String
  matched_query: String
  retrieval_queries: String
  search_engines: String
  candidate_relevance_score: String
  content_relevance_score: String
  extraction_method: String
  content_integrity_verified: String
  verified_quote: String
  quote_verified: String
  relevance: String
}
