name: Release macOS gents

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without the v prefix; must match workspace.package.version.
        required: true
        type: string
        default: "0.10.1"
      codesign_timestamp:
        description: Timestamp mode for codesign. Signed releases notarize, so timestamping must succeed unless dry_run_unsigned is true.
        required: true
        type: choice
        default: auto
        options:
          - auto
          - enabled
          - none
      dry_run_unsigned:
        description: Manual dry-run only. Builds and packages an unsigned artifact that must not be deployed.
        required: true
        type: boolean
        default: false

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS || '4' }}
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Do not reuse linked artifacts from the target trees populated by PR jobs.
  CARGO_TARGET_ROOT: ${{ vars.CARGO_RELEASE_TARGET_ROOT || '/Users/admin/.cache/gents-cargo-target-release' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  RUSTC_WRAPPER: sccache
  RUST_BACKTRACE: "1"
  SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_CACHE_SIZE || '120G' }}
  SCCACHE_BASEDIRS: ${{ vars.SCCACHE_BASEDIRS }}
  SCCACHE_DIR: ${{ vars.SCCACHE_DIR || '/Users/admin/.cache/sccache' }}
  # Release builds must not consume compiler objects written by PR jobs. This
  # forces rustc to rebuild and replace every otherwise-cacheable result while
  # ephemeral, isolated macOS release runners remain future work.
  SCCACHE_RECACHE: "1"
  MACOS_CODESIGN_IDENTIFIER: com.source-inc.gents.cli
  MACOS_KEYCHAIN_ACCESS_GROUP_BASE: com.source-inc.gents
  TARGET_TRIPLE: aarch64-apple-darwin

jobs:
  build-sign-package:
    name: Build, sign, and package macOS CLI
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          workspace_version="$(awk '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          if [[ -z "${workspace_version}" ]]; then
            echo "::error::Could not read workspace.package.version from Cargo.toml."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_tag="v${workspace_version}"
            if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
              echo "::error::Release tag ${GITHUB_REF_NAME} does not match workspace version ${expected_tag}."
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${RELEASE_VERSION_INPUT}" != "${workspace_version}" ]]; then
              echo "::error::Requested release version ${RELEASE_VERSION_INPUT} does not match workspace version ${workspace_version}."
              exit 1
            fi
          else
            echo "::error::Unsupported release trigger ${GITHUB_EVENT_NAME}."
            exit 1
          fi

          echo "RELEASE_VERSION=${workspace_version}" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install protobuf compiler
        run: .github/scripts/setup-protoc.sh

      - name: Prepare disk-backed Rust build cache
        run: .github/scripts/setup-rust-build-cache.sh

      - name: Validate release signing mode
        env:
          DRY_RUN_UNSIGNED_INPUT: ${{ inputs.dry_run_unsigned }}
          TIMESTAMP_MODE_INPUT: ${{ inputs.codesign_timestamp }}
          TIMESTAMP_MODE_VAR: ${{ vars.MACOS_CODESIGN_TIMESTAMP_MODE }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CODESIGN_KEYCHAIN_PASSWORD }}
          MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail

          dry_run_unsigned="${DRY_RUN_UNSIGNED_INPUT:-false}"
          timestamp_mode="${TIMESTAMP_MODE_INPUT:-${TIMESTAMP_MODE_VAR:-auto}}"
          is_release_tag=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            is_release_tag=true
          fi

          if [[ "${is_release_tag}" == "true" && "${dry_run_unsigned}" == "true" ]]; then
            echo "::error::Tagged gents releases must be signed; dry_run_unsigned is not allowed for release tags."
            exit 1
          fi

          signing_enabled=true
          if [[ "${dry_run_unsigned}" == "true" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "::error::dry_run_unsigned is only allowed for manual workflow_dispatch runs."
              exit 1
            fi
            signing_enabled=false
          fi

          missing=()
          [[ -n "${MACOS_CODESIGN_IDENTITY}" ]] || missing+=("MACOS_CODESIGN_IDENTITY")
          [[ -n "${MACOS_CODESIGN_KEYCHAIN_PASSWORD}" ]] || missing+=("MACOS_CODESIGN_KEYCHAIN_PASSWORD")
          [[ -n "${MACOS_NOTARY_API_KEY}" ]] || missing+=("MACOS_NOTARY_API_KEY")
          [[ -n "${MACOS_NOTARY_ISSUER_ID}" ]] || missing+=("MACOS_NOTARY_ISSUER_ID")
          [[ -n "${MACOS_NOTARY_KEY_ID}" ]] || missing+=("MACOS_NOTARY_KEY_ID")

          if [[ "${signing_enabled}" == "true" && "${#missing[@]}" -gt 0 ]]; then
            printf "::error::Missing required macOS release secret(s): %s\n" "${missing[*]}"
            exit 1
          fi

          if [[ "${signing_enabled}" == "false" && "${#missing[@]}" -gt 0 ]]; then
            printf "::warning::Signing is disabled for this manual dry-run. Missing secret(s): %s\n" "${missing[*]}"
          fi

          case "${timestamp_mode}" in
            auto|enabled|none)
              ;;
            *)
              echo "::error::Unsupported timestamp mode '${timestamp_mode}'. Use auto, enabled, or none."
              exit 1
              ;;
          esac
          if [[ "${signing_enabled}" == "true" && "${timestamp_mode}" == "none" ]]; then
            echo "::error::Signed macOS releases must use a timestamped Developer ID signature for notarization."
            exit 1
          fi

          echo "SIGNING_ENABLED=${signing_enabled}" >> "${GITHUB_ENV}"
          echo "RELEASE_CODESIGN_TIMESTAMP_MODE=${timestamp_mode}" >> "${GITHUB_ENV}"

      - name: Preflight native signing keychain
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CODESIGN_KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_KEYCHAIN_PATH_VAR: ${{ vars.MACOS_CODESIGN_KEYCHAIN_PATH }}
        run: |
          set -euo pipefail

          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            echo "Skipping native signing keychain preflight for unsigned manual dry-run."
            exit 0
          fi

          keychain_path="${MACOS_CODESIGN_KEYCHAIN_PATH_VAR:-${HOME}/Library/Keychains/gents-signing.keychain-db}"
          keychain_password="${MACOS_CODESIGN_KEYCHAIN_PASSWORD}"
          login_keychain="${HOME}/Library/Keychains/login.keychain-db"
          original_keychains_path="${RUNNER_TEMP}/gents-original-keychains.txt"
          original_default_keychain_path="${RUNNER_TEMP}/gents-original-default-keychain.txt"

          if [[ ! -f "${keychain_path}" ]]; then
            echo "::error::Native macOS signing keychain not found at ${keychain_path}."
            exit 1
          fi

          echo "SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"
          security list-keychains -d user > "${original_keychains_path}"
          security default-keychain -d user > "${original_default_keychain_path}" || true
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"

          keychains=()
          while IFS= read -r keychain; do
            [[ -n "${keychain}" ]] && keychains+=("${keychain}")
          done < <(sed -e 's/^[[:space:]]*"//' -e 's/"$//' "${original_keychains_path}")

          security list-keychains -d user -s "${keychain_path}" "${login_keychain}" "${keychains[@]}"
          security list-keychains -s "${keychain_path}" "${login_keychain}" "${keychains[@]}"
          security default-keychain -d user -s "${keychain_path}"
          security default-keychain -s "${keychain_path}" || true
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          echo "Active user keychain search list:"
          security list-keychains -d user
          echo "Active default keychain search list:"
          security list-keychains
          echo "Active user default keychain:"
          security default-keychain -d user
          echo "Active default keychain:"
          security default-keychain

          identity_output="$(security find-identity -v -p codesigning "${keychain_path}")"
          printf '%s\n' "${identity_output}"
          active_identity_output="$(security find-identity -v -p codesigning)"
          printf '%s\n' "${active_identity_output}"
          identity_line="$(grep -F "${MACOS_CODESIGN_IDENTITY}" <<< "${identity_output}" | head -n 1 || true)"
          if [[ -z "${identity_line}" ]]; then
            echo "::error::Configured MACOS_CODESIGN_IDENTITY was not found in ${keychain_path}."
            exit 1
          fi
          signing_identity="$(awk '{ print $2 }' <<< "${identity_line}")"
          if [[ -z "${signing_identity}" ]]; then
            echo "::error::Could not extract signing identity fingerprint from native keychain identity."
            exit 1
          fi
          signing_identity_name="$(sed -E 's/^[[:space:]]*[0-9]+\) [A-Fa-f0-9]+ "(.+)"$/\1/' <<< "${identity_line}")"
          if [[ -z "${signing_identity_name}" || "${signing_identity_name}" == "${identity_line}" ]]; then
            echo "::error::Could not extract signing identity name from native keychain identity."
            exit 1
          fi
          echo "SIGNING_IDENTITY=${signing_identity}" >> "${GITHUB_ENV}"
          echo "SIGNING_IDENTITY_NAME=${signing_identity_name}" >> "${GITHUB_ENV}"

          smoke_bin="${RUNNER_TEMP}/gents-codesign-smoke"
          cp /bin/echo "${smoke_bin}"
          codesign --remove-signature "${smoke_bin}" 2>/dev/null || true
          codesign \
            --force \
            --sign "${signing_identity_name}" \
            --identifier "${MACOS_CODESIGN_IDENTIFIER}.smoke" \
            --timestamp=none \
            "${smoke_bin}"
          codesign --verify --strict --verbose=2 "${smoke_bin}"
          designated_requirement="$(codesign -d -r- "${smoke_bin}" 2>&1)"
          printf '%s\n' "${designated_requirement}"
          if grep -q 'designated => cdhash' <<< "${designated_requirement}"; then
            echo "::error::Native signing smoke test produced an ad-hoc cdhash designated requirement."
            exit 1
          fi

      - name: Build release binary
        env:
          # dsymutil needs the local symbol table and object-file debug map.
          # The next step extracts the dSYM and restores the normal stripped
          # release footprint before signing or packaging.
          CARGO_PROFILE_RELEASE_STRIP: "false"
        run: |
          set -euo pipefail
          rustc -Vv
          host_triple="$(rustc -Vv | awk '/^host:/ { print $2 }')"
          if [[ "${host_triple}" != "${TARGET_TRIPLE}" ]]; then
            echo "::error::Expected ${TARGET_TRIPLE} macOS runner, got ${host_triple}."
            exit 1
          fi
          cargo build -p gents-cli --release --locked
          file "${CARGO_TARGET_DIR}/release/gents"

      - name: Generate dSYM and strip release binary
        run: |
          .github/scripts/prepare-macos-release-dsym.sh \
            "${CARGO_TARGET_DIR}/release/gents" \
            "${CARGO_TARGET_DIR}/release/gents.dSYM"

      - name: Sign binary with native macOS identity
        env:
          MACOS_CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CODESIGN_KEYCHAIN_PASSWORD }}
          MACOS_APPLY_SE_ENTITLEMENTS: ${{ vars.MACOS_APPLY_SE_ENTITLEMENTS }}
        run: |
          set -euo pipefail

          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            echo "Skipping certificate import and codesign for unsigned manual dry-run."
            exit 0
          fi

          binary_path="${CARGO_TARGET_DIR}/release/gents"
          keychain_path="${SIGNING_KEYCHAIN}"
          signing_identity="${SIGNING_IDENTITY_NAME}"
          timestamp_mode="${RELEASE_CODESIGN_TIMESTAMP_MODE:-auto}"
          apple_team_id="$(sed -nE 's/^.*\(([A-Za-z0-9]+)\)$/\1/p' <<< "${signing_identity}" | tail -n 1)"
          entitlements_path="${RUNNER_TEMP}/entitlements.rendered.plist"

          if [[ -z "${keychain_path}" || -z "${signing_identity}" ]]; then
            echo "::error::Native signing keychain preflight did not provide SIGNING_KEYCHAIN/SIGNING_IDENTITY_NAME."
            exit 1
          fi
          if [[ -z "${apple_team_id}" ]]; then
            echo "::error::Could not extract Apple Team ID from SIGNING_IDENTITY_NAME '${signing_identity}'."
            exit 1
          fi
          echo "APPLE_TEAM_ID=${apple_team_id}" >> "${GITHUB_ENV}"

          # The release/entitlements.plist requests `keychain-access-groups`, a
          # RESTRICTED entitlement. On a Developer-ID, hardened-runtime binary
          # distributed outside the App Store, a restricted entitlement with no
          # embedded provisioning profile makes AMFI SIGKILL the process at launch
          # (exit 137, no output) — which made every released binary un-launchable
          # on macOS. Until a provisioning-profile path exists for Secure Enclave
          # identities, sign the standard release WITHOUT the entitlement so the
          # binary launches; it notarizes fine with hardened runtime alone. Opt in
          # only when the repo var MACOS_APPLY_SE_ENTITLEMENTS is "true" (and a
          # provisioning profile is in place).
          apply_entitlements="${MACOS_APPLY_SE_ENTITLEMENTS:-false}"
          if [[ "${apply_entitlements}" == "true" ]]; then
            sed "s/__APPLE_TEAM_ID__/${apple_team_id}/g" release/entitlements.plist > "${entitlements_path}"
            plutil -lint "${entitlements_path}"
            echo "Signing WITH keychain-access-groups entitlement (MACOS_APPLY_SE_ENTITLEMENTS=true)."
          else
            entitlements_path=""
            echo "Signing without the keychain-access-groups entitlement (default); see release-macos.yml for the Secure Enclave caveat."
          fi

          security unlock-keychain -p "${MACOS_CODESIGN_KEYCHAIN_PASSWORD}" "${keychain_path}"
          echo "Signing with native macOS identity from ${keychain_path}."

          sign_with_timestamp_arg() {
            local timestamp_arg="$1"
            # Avoid empty-array expansion under `set -u` (unsafe on bash 3.2);
            # branch on whether an entitlements file was rendered instead.
            if [[ -n "${entitlements_path}" ]]; then
              codesign \
                --force \
                --sign "${signing_identity}" \
                --identifier "${MACOS_CODESIGN_IDENTIFIER}" \
                --options runtime \
                --entitlements "${entitlements_path}" \
                "${timestamp_arg}" \
                "${binary_path}"
            else
              codesign \
                --force \
                --sign "${signing_identity}" \
                --identifier "${MACOS_CODESIGN_IDENTIFIER}" \
                --options runtime \
                "${timestamp_arg}" \
                "${binary_path}"
            fi
          }

          codesign --remove-signature "${binary_path}" 2>/dev/null || true

          case "${timestamp_mode}" in
            auto)
              sign_with_timestamp_arg "--timestamp"
              ;;
            enabled)
              sign_with_timestamp_arg "--timestamp"
              ;;
            none)
              echo "::error::Signed macOS releases must use --timestamp so notarization can succeed."
              exit 1
              ;;
            *)
              echo "::error::Unsupported timestamp mode '${timestamp_mode}'. Use auto, enabled, or none."
              exit 1
              ;;
          esac

      - name: Notarize signed binary
        env:
          MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail

          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            echo "Skipping notarization for unsigned manual dry-run."
            exit 0
          fi

          binary_path="${CARGO_TARGET_DIR}/release/gents"
          notary_dir="${RUNNER_TEMP}/gents-notary"
          staging_dir="${notary_dir}/payload"
          notary_zip="${notary_dir}/gents-notary.zip"
          notary_key_path="${notary_dir}/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"

          rm -rf "${notary_dir}"
          mkdir -p "${staging_dir}"
          cp "${binary_path}" "${staging_dir}/gents"
          chmod 0755 "${staging_dir}/gents"
          printf '%s\n' "${MACOS_NOTARY_API_KEY}" > "${notary_key_path}"
          chmod 0600 "${notary_key_path}"

          (
            cd "${staging_dir}"
            /usr/bin/ditto -c -k --keepParent gents "${notary_zip}"
          )

          xcrun notarytool submit "${notary_zip}" \
            --key "${notary_key_path}" \
            --key-id "${MACOS_NOTARY_KEY_ID}" \
            --issuer "${MACOS_NOTARY_ISSUER_ID}" \
            --wait

          # Raw CLI binaries are not a stapler-supported file format. The
          # Verify step keeps spctl as a diagnostic and gates on launch.

      - name: Verify signature
        env:
          MACOS_APPLY_SE_ENTITLEMENTS: ${{ vars.MACOS_APPLY_SE_ENTITLEMENTS }}
        run: |
          set -euo pipefail

          binary_path="${CARGO_TARGET_DIR}/release/gents"
          if [[ "${SIGNING_ENABLED}" == "true" ]]; then
            codesign --verify --strict --verbose=2 "${binary_path}"

            signature_details="$(codesign -d -vv "${binary_path}" 2>&1)"
            printf '%s\n' "${signature_details}"
            if ! grep -Fxq "Identifier=${MACOS_CODESIGN_IDENTIFIER}" <<< "${signature_details}"; then
              echo "::error::Signed release artifact does not have identifier ${MACOS_CODESIGN_IDENTIFIER}."
              exit 1
            fi
            if ! grep -q '^Authority=' <<< "${signature_details}"; then
              echo "::error::Signed release artifact has no signing authority. This usually means it is still ad-hoc signed."
              exit 1
            fi

            designated_requirement="$(codesign -d -r- "${binary_path}" 2>&1)"
            printf '%s\n' "${designated_requirement}"
            if grep -q 'designated => cdhash' <<< "${designated_requirement}"; then
              echo "::error::Signed release artifact still has an ad-hoc cdhash designated requirement."
              exit 1
            fi

            entitlements_output="$(codesign -d --entitlements - "${binary_path}" 2>&1)"
            printf '%s\n' "${entitlements_output}"
            # Only require the keychain-access-groups entitlement when it was
            # actually applied. By default it is intentionally omitted: as a
            # restricted entitlement with no provisioning profile it makes AMFI
            # kill the binary at launch. See the signing step's comment.
            if [[ "${MACOS_APPLY_SE_ENTITLEMENTS:-false}" == "true" ]]; then
              expected_access_group="${APPLE_TEAM_ID}.${MACOS_KEYCHAIN_ACCESS_GROUP_BASE}"
              if ! grep -Fq "<string>${expected_access_group}</string>" <<< "${entitlements_output}"; then
                echo "::error::Signed artifact is missing exact keychain access group ${expected_access_group}."
                exit 1
              fi
            elif grep -q 'keychain-access-groups' <<< "${entitlements_output}"; then
              echo "::error::Signed artifact carries keychain-access-groups but MACOS_APPLY_SE_ENTITLEMENTS is not true; this binary would be AMFI-killed at launch."
              exit 1
            fi

            spctl --assess --type execute --verbose=4 "${binary_path}" || \
              echo "::warning::spctl assessment rejected the raw CLI binary. This is expected for non-app executables; launch smoke remains authoritative."
          else
            codesign -dv "${binary_path}" || true
            echo "::warning::Unsigned manual dry-run artifact. Do not deploy this binary to steward agents."
          fi

          version_output="$("${binary_path}" version)"
          printf '%s\n' "${version_output}"
          expected_prefix="gents ${RELEASE_VERSION} ("
          if [[ "${version_output}" != "${expected_prefix}"* ]]; then
            echo "::error::gents version output does not start with '${expected_prefix}'."
            exit 1
          fi

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail

          artifact_basename="gents-${TARGET_TRIPLE}"
          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            artifact_basename="${artifact_basename}-unsigned-dry-run"
          fi

          package_parent="${RUNNER_TEMP}/package"
          package_root="${package_parent}/${artifact_basename}"
          symbols_parent="${RUNNER_TEMP}/symbols"
          dsym_bundle_basename="gents.dSYM"
          dsym_archive_basename="${artifact_basename}.dSYM"
          dist_dir="${RUNNER_TEMP}/dist"
          tarball="${dist_dir}/${artifact_basename}.tar.gz"
          checksum_file="${tarball}.sha256"
          dsym_tarball="${dist_dir}/${dsym_archive_basename}.tar.gz"
          dsym_checksum_file="${dsym_tarball}.sha256"

          rm -rf "${package_parent}" "${symbols_parent}" "${dist_dir}"
          mkdir -p "${package_root}" "${symbols_parent}" "${dist_dir}"
          cp "${CARGO_TARGET_DIR}/release/gents" "${package_root}/gents"
          chmod 0755 "${package_root}/gents"
          cp LICENSE "${package_root}/LICENSE"
          chmod 0644 "${package_root}/LICENSE"
          cp -R "${CARGO_TARGET_DIR}/release/gents.dSYM" "${symbols_parent}/${dsym_bundle_basename}"
          cp LICENSE "${symbols_parent}/LICENSE"
          chmod 0644 "${symbols_parent}/LICENSE"

          tar -C "${package_parent}" -czf "${tarball}" "${artifact_basename}"
          tar -C "${symbols_parent}" -czf "${dsym_tarball}" "${dsym_bundle_basename}" LICENSE
          (
            cd "${dist_dir}"
            shasum -a 256 "${artifact_basename}.tar.gz" > "${artifact_basename}.tar.gz.sha256"
            shasum -a 256 "${dsym_archive_basename}.tar.gz" > "${dsym_archive_basename}.tar.gz.sha256"
          )

          {
            echo "tarball=${tarball}"
            echo "checksum_file=${checksum_file}"
            echo "dsym_tarball=${dsym_tarball}"
            echo "dsym_checksum_file=${dsym_checksum_file}"
            echo "artifact_basename=${artifact_basename}"
          } >> "${GITHUB_OUTPUT}"
          ls -lh "${dist_dir}"

      - name: Verify packaged artifact
        env:
          ARTIFACT_BASENAME: ${{ steps.package.outputs.artifact_basename }}
          CHECKSUM_FILE: ${{ steps.package.outputs.checksum_file }}
          DSYM_CHECKSUM_FILE: ${{ steps.package.outputs.dsym_checksum_file }}
          DSYM_TARBALL: ${{ steps.package.outputs.dsym_tarball }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail

          dist_dir="$(dirname "${TARBALL}")"
          (
            cd "${dist_dir}"
            shasum -a 256 -c "$(basename "${CHECKSUM_FILE}")"
            shasum -a 256 -c "$(basename "${DSYM_CHECKSUM_FILE}")"
          )

          archive_files="$(tar -tzf "${TARBALL}" | sed '/\/$/d' | LC_ALL=C sort)"
          expected_binary="${ARTIFACT_BASENAME}/gents"
          expected_license="${ARTIFACT_BASENAME}/LICENSE"
          expected_files="$(printf '%s\n' "${expected_license}" "${expected_binary}")"
          if [[ "${archive_files}" != "${expected_files}" ]]; then
            echo "::error::Release archive must contain exactly ${expected_license} and ${expected_binary}; found:"
            printf '%s\n' "${archive_files}"
            exit 1
          fi
          dsym_archive_entries="$(tar -tzf "${DSYM_TARBALL}")"
          if grep -Ev '^(gents\.dSYM(/|$)|LICENSE$)' <<< "${dsym_archive_entries}" >/dev/null; then
            echo "::error::Symbol archive contains an entry outside gents.dSYM and LICENSE."
            printf '%s\n' "${dsym_archive_entries}"
            exit 1
          fi
          if ! grep -Fx 'LICENSE' <<< "${dsym_archive_entries}" >/dev/null; then
            echo "::error::Symbol archive is missing the Apache-2.0 LICENSE."
            exit 1
          fi

          verify_root="$(mktemp -d "${RUNNER_TEMP}/gents-macos-release-verify.XXXXXX")"
          trap 'rm -rf "${verify_root}"' EXIT
          binary_root="${verify_root}/binary"
          symbols_root="${verify_root}/symbols"
          mkdir -p "${binary_root}" "${symbols_root}"
          tar -xzf "${TARBALL}" -C "${binary_root}"
          tar -xzf "${DSYM_TARBALL}" -C "${symbols_root}"

          packaged_binary="${binary_root}/${expected_binary}"
          packaged_license="${binary_root}/${expected_license}"
          packaged_dsym="${symbols_root}/gents.dSYM"
          packaged_dsym_license="${symbols_root}/LICENSE"
          packaged_dwarf="${packaged_dsym}/Contents/Resources/DWARF/gents"
          if [[ ! -x "${packaged_binary}" || ! -s "${packaged_dwarf}" ]]; then
            echo "::error::Packaged Gents binary or gents.dSYM DWARF payload is missing."
            exit 1
          fi
          if ! cmp -s LICENSE "${packaged_license}" || ! cmp -s LICENSE "${packaged_dsym_license}"; then
            echo "::error::Packaged Apache-2.0 LICENSE is missing or differs from the repository LICENSE."
            exit 1
          fi

          version_output="$("${packaged_binary}" version)"
          printf '%s\n' "${version_output}"
          expected_prefix="gents ${RELEASE_VERSION} ("
          if [[ "${version_output}" != "${expected_prefix}"* ]]; then
            echo "::error::Packaged gents version output does not start with '${expected_prefix}'."
            exit 1
          fi

          binary_uuid="$(xcrun dwarfdump --uuid "${packaged_binary}" | awk '{ print $2, $3 }')"
          dsym_uuid="$(xcrun dwarfdump --uuid "${packaged_dsym}" | awk '{ print $2, $3 }')"
          if [[ -z "${binary_uuid}" || "${binary_uuid}" != "${dsym_uuid}" ]]; then
            echo "::error::Packaged binary/dSYM UUID mismatch: binary='${binary_uuid}' dSYM='${dsym_uuid}'."
            exit 1
          fi

          if [[ "${SIGNING_ENABLED}" == "true" ]]; then
            codesign --verify --strict --verbose=2 "${packaged_binary}"
            signature_details="$(codesign -d -vv "${packaged_binary}" 2>&1)"
            if ! grep -Fxq "Identifier=${MACOS_CODESIGN_IDENTIFIER}" <<< "${signature_details}"; then
              echo "::error::Packaged release artifact does not have identifier ${MACOS_CODESIGN_IDENTIFIER}."
              exit 1
            fi
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_basename }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum_file }}
            ${{ steps.package.outputs.dsym_tarball }}
            ${{ steps.package.outputs.dsym_checksum_file }}
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          CHECKSUM_FILE: ${{ steps.package.outputs.checksum_file }}
          DSYM_TARBALL: ${{ steps.package.outputs.dsym_tarball }}
          DSYM_CHECKSUM_FILE: ${{ steps.package.outputs.dsym_checksum_file }}
        run: |
          set -euo pipefail

          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            echo "::error::Refusing to attach unsigned artifacts to a GitHub Release."
            exit 1
          fi

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "Signed gents macOS release artifact." \
              || gh release view "${GITHUB_REF_NAME}" >/dev/null
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            "${TARBALL}" \
            "${CHECKSUM_FILE}" \
            "${DSYM_TARBALL}" \
            "${DSYM_CHECKSUM_FILE}" \
            --clobber

      - name: Restore keychain search list
        if: always()
        run: |
          set -euo pipefail
          original_keychains_path="${RUNNER_TEMP}/gents-original-keychains.txt"
          original_default_keychain_path="${RUNNER_TEMP}/gents-original-default-keychain.txt"

          if [[ -f "${original_keychains_path}" ]]; then
            keychains=()
            while IFS= read -r keychain; do
              [[ -n "${keychain}" ]] && keychains+=("${keychain}")
            done < <(sed -e 's/^[[:space:]]*"//' -e 's/"$//' "${original_keychains_path}")

            if [[ "${#keychains[@]}" -gt 0 ]]; then
              security list-keychains -d user -s "${keychains[@]}" || true
              security list-keychains -s "${keychains[@]}" || true
            fi
          fi

          if [[ -f "${original_default_keychain_path}" ]]; then
            default_keychain="$(sed -e 's/^[[:space:]]*"//' -e 's/"$//' "${original_default_keychain_path}")"
            if [[ -n "${default_keychain}" ]]; then
              security default-keychain -d user -s "${default_keychain}" || true
              security default-keychain -s "${default_keychain}" || true
            fi
          fi

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh
