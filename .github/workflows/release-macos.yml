name: Release macOS defra-agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      codesign_timestamp:
        description: Timestamp mode for codesign. Auto retries with --timestamp=none if timestamping is unavailable.
        required: true
        type: choice
        default: auto
        options:
          - auto
          - enabled
          - none
      dry_run_unsigned:
        description: Manual dry-run only. Builds and packages an unsigned artifact that must not be deployed.
        required: true
        type: boolean
        default: false

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  MACOS_CODESIGN_IDENTIFIER: org.sourcenetwork.defra-agent
  TARGET_TRIPLE: aarch64-apple-darwin

jobs:
  build-sign-package:
    name: Build, sign, and package macOS CLI
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rewrite Git SSH dependencies to HTTPS
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_REPO_PAT}" ]]; then
            echo "::error::Missing PRIVATE_REPO_PAT; required to fetch private Source Network git dependencies."
            exit 1
          fi
          git config --global url."https://${PRIVATE_REPO_PAT}@github.com/sourcenetwork/".insteadOf "https://github.com/sourcenetwork/"
          git config --global url."https://${PRIVATE_REPO_PAT}@github.com/sourcenetwork/".insteadOf "ssh://git@github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Validate release signing mode
        env:
          DRY_RUN_UNSIGNED_INPUT: ${{ inputs.dry_run_unsigned }}
          MACOS_CODESIGN_CERT_P12_BASE64: ${{ secrets.MACOS_CODESIGN_CERT_P12_BASE64 }}
          MACOS_CODESIGN_CERT_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERT_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail

          dry_run_unsigned="${DRY_RUN_UNSIGNED_INPUT:-false}"
          is_release_tag=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            is_release_tag=true
          fi

          if [[ "${is_release_tag}" == "true" && "${dry_run_unsigned}" == "true" ]]; then
            echo "::error::Tagged defra-agent releases must be signed; dry_run_unsigned is not allowed for release tags."
            exit 1
          fi

          signing_enabled=true
          if [[ "${dry_run_unsigned}" == "true" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "::error::dry_run_unsigned is only allowed for manual workflow_dispatch runs."
              exit 1
            fi
            signing_enabled=false
          fi

          missing=()
          [[ -n "${MACOS_CODESIGN_CERT_P12_BASE64}" ]] || missing+=("MACOS_CODESIGN_CERT_P12_BASE64")
          [[ -n "${MACOS_CODESIGN_CERT_PASSWORD}" ]] || missing+=("MACOS_CODESIGN_CERT_PASSWORD")
          [[ -n "${MACOS_CODESIGN_IDENTITY}" ]] || missing+=("MACOS_CODESIGN_IDENTITY")

          if [[ "${signing_enabled}" == "true" && "${#missing[@]}" -gt 0 ]]; then
            printf "::error::Missing required macOS signing secret(s): %s\n" "${missing[*]}"
            exit 1
          fi

          if [[ "${signing_enabled}" == "false" && "${#missing[@]}" -gt 0 ]]; then
            printf "::warning::Signing is disabled for this manual dry-run. Missing secret(s): %s\n" "${missing[*]}"
          fi

          echo "SIGNING_ENABLED=${signing_enabled}" >> "${GITHUB_ENV}"

      - name: Build release binary
        run: |
          set -euo pipefail
          rustc -Vv
          host_triple="$(rustc -Vv | awk '/^host:/ { print $2 }')"
          if [[ "${host_triple}" != "${TARGET_TRIPLE}" ]]; then
            echo "::error::Expected ${TARGET_TRIPLE} macOS runner, got ${host_triple}."
            exit 1
          fi
          cargo build -p defra-agent-cli --release
          file target/release/defra-agent

      - name: Import signing certificate
        env:
          MACOS_CODESIGN_CERT_P12_BASE64: ${{ secrets.MACOS_CODESIGN_CERT_P12_BASE64 }}
          MACOS_CODESIGN_CERT_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERT_PASSWORD }}
          MACOS_CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CODESIGN_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            echo "Skipping certificate import for unsigned manual dry-run."
            exit 0
          fi

          keychain_path="${RUNNER_TEMP}/defra-agent-signing.keychain-db"
          keychain_password="${MACOS_CODESIGN_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          cert_path="${RUNNER_TEMP}/defra-agent-codesign.p12"

          printf '%s' "${MACOS_CODESIGN_CERT_P12_BASE64}" | base64 -D > "${cert_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CODESIGN_CERT_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

          echo "SIGNING_KEYCHAIN=${keychain_path}" >> "${GITHUB_ENV}"
          rm -f "${cert_path}"

      - name: Sign release binary
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          TIMESTAMP_MODE_INPUT: ${{ inputs.codesign_timestamp }}
          TIMESTAMP_MODE_VAR: ${{ vars.MACOS_CODESIGN_TIMESTAMP_MODE }}
        run: |
          set -euo pipefail

          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            echo "Skipping codesign for unsigned manual dry-run."
            exit 0
          fi

          binary_path="target/release/defra-agent"
          timestamp_mode="${TIMESTAMP_MODE_INPUT:-${TIMESTAMP_MODE_VAR:-auto}}"

          sign_with_timestamp_arg() {
            local timestamp_arg="$1"
            codesign \
              --force \
              --sign "${MACOS_CODESIGN_IDENTITY}" \
              --identifier "${MACOS_CODESIGN_IDENTIFIER}" \
              "${timestamp_arg}" \
              --keychain "${SIGNING_KEYCHAIN}" \
              "${binary_path}"
          }

          case "${timestamp_mode}" in
            auto)
              if ! sign_with_timestamp_arg "--timestamp"; then
                echo "::warning::codesign timestamping failed; retrying with --timestamp=none for this signed artifact."
                sign_with_timestamp_arg "--timestamp=none"
              fi
              ;;
            enabled)
              sign_with_timestamp_arg "--timestamp"
              ;;
            none)
              sign_with_timestamp_arg "--timestamp=none"
              ;;
            *)
              echo "::error::Unsupported timestamp mode '${timestamp_mode}'. Use auto, enabled, or none."
              exit 1
              ;;
          esac

      - name: Verify signature
        env:
          REQUIRE_SPCTL_VAR: ${{ vars.MACOS_CODESIGN_SPCTL_REQUIRED }}
        run: |
          set -euo pipefail

          binary_path="target/release/defra-agent"
          if [[ "${SIGNING_ENABLED}" == "true" ]]; then
            codesign --verify --strict --verbose=2 "${binary_path}"
            codesign -d -r- "${binary_path}"

            spctl_required="${REQUIRE_SPCTL_VAR:-false}"
            if [[ "${spctl_required}" == "true" ]]; then
              spctl --assess --type execute --verbose=4 "${binary_path}"
            else
              spctl --assess --type execute --verbose=4 "${binary_path}" || \
                echo "::warning::spctl assessment failed or is not applicable. This does not fail internal/self-signed signing."
            fi
          else
            codesign -dv "${binary_path}" || true
            echo "::warning::Unsigned manual dry-run artifact. Do not deploy this binary to steward agents."
          fi

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail

          artifact_basename="defra-agent-${TARGET_TRIPLE}"
          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            artifact_basename="${artifact_basename}-unsigned-dry-run"
          fi

          package_parent="${RUNNER_TEMP}/package"
          package_root="${package_parent}/${artifact_basename}"
          dist_dir="${RUNNER_TEMP}/dist"
          tarball="${dist_dir}/${artifact_basename}.tar.gz"
          checksum_file="${tarball}.sha256"

          rm -rf "${package_parent}" "${dist_dir}"
          mkdir -p "${package_root}" "${dist_dir}"
          cp target/release/defra-agent "${package_root}/defra-agent"
          chmod 0755 "${package_root}/defra-agent"

          tar -C "${package_parent}" -czf "${tarball}" "${artifact_basename}"
          shasum -a 256 "${tarball}" > "${checksum_file}"

          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "checksum_file=${checksum_file}" >> "${GITHUB_OUTPUT}"
          echo "artifact_basename=${artifact_basename}" >> "${GITHUB_OUTPUT}"
          ls -lh "${dist_dir}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_basename }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum_file }}
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          CHECKSUM_FILE: ${{ steps.package.outputs.checksum_file }}
        run: |
          set -euo pipefail

          if [[ "${SIGNING_ENABLED}" != "true" ]]; then
            echo "::error::Refusing to attach unsigned artifacts to a GitHub Release."
            exit 1
          fi

          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes "Signed defra-agent macOS release artifact."
          gh release upload "${GITHUB_REF_NAME}" "${TARBALL}" "${CHECKSUM_FILE}" --clobber

      - name: Delete temporary keychain
        if: always()
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          git config --global --remove-section "url.https://${PRIVATE_REPO_PAT:-}@github.com/sourcenetwork/" 2>/dev/null || true
          keychain_path="${SIGNING_KEYCHAIN:-${RUNNER_TEMP}/defra-agent-signing.keychain-db}"
          if [[ -f "${keychain_path}" ]]; then
            security delete-keychain "${keychain_path}" || true
          fi
