name: Desktop UI QA Sweep

on:
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: Bombadil exploration time limit
        required: true
        default: 5m
  schedule:
    - cron: "17 9 * * 1-5"

env:
  DESKTOP_QA_FUZZ_TIME: ${{ github.event.inputs.fuzz_time || '5m' }}

jobs:
  desktop-ui-qa-sweep:
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Install frontend dependencies
        working-directory: apps/desktop-tauri
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/desktop-tauri
        run: npx playwright install chromium

      - name: Check desktop formatting
        working-directory: apps/desktop-tauri
        run: npm run format:check

      - name: Build desktop frontend
        working-directory: apps/desktop-tauri
        run: npm run build

      - name: Run desktop unit tests
        working-directory: apps/desktop-tauri
        run: npm run test:ui:unit

      - name: Run desktop browser journeys
        working-directory: apps/desktop-tauri
        run: npm run test:ui:e2e

      - name: Capture deterministic desktop screenshots
        working-directory: apps/desktop-tauri
        run: npm run test:ui:screenshots

      - name: Run desktop visual baselines
        working-directory: apps/desktop-tauri
        run: npm run test:ui:visual

      - name: Run longer desktop Bombadil sweep
        working-directory: apps/desktop-tauri
        run: npm run test:ui:fuzz -- --time-limit "${DESKTOP_QA_FUZZ_TIME}"

      - name: Upload desktop QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-qa-artifacts
          if-no-files-found: ignore
          path: |
            apps/desktop-tauri/test-results
            apps/desktop-tauri/playwright-report
            apps/desktop-tauri/playwright-screenshots-report
            apps/desktop-tauri/playwright-visual-report
