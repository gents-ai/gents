name: Editor transport

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - crates/**
      - .github/workflows/editor-windows.yml
      - .github/scripts/editor-native-tests.py
      - .github/scripts/test-editor-native-tests.py
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - crates/**
      - .github/workflows/editor-windows.yml
      - .github/scripts/editor-native-tests.py
      - .github/scripts/test-editor-native-tests.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 .github/scripts/test-editor-native-tests.py

  named-pipes:
    needs: driver
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: 16777216
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install migration and callback fixture targets
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1
      - name: Install protobuf compiler
        run: choco install protoc --yes --no-progress
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: editor-windows
          cache-on-failure: "true"
          cache-workspace-crates: "false"
          cache-bin: "false"
      - name: Compile native binaries and transport tests in one feature graph
        run: python .github/scripts/editor-native-tests.py compile --profile ci-native --manifest "$env:RUNNER_TEMP/editor-native-tests.json"
      - name: Check the native protocol descriptor
        run: |
          $artifacts = Get-Content -Raw "$env:RUNNER_TEMP/editor-native-tests.json" | ConvertFrom-Json
          $hosts = @($artifacts | Where-Object { $_.role -eq 'binary' -and $_.name -eq 'gents-client-host' })
          if ($hosts.Count -ne 1) { throw "Expected one compiled native host." }
          $hostPath = $hosts[0].path
          $hostInfo = & $hostPath --describe | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($hostInfo.os -ne "windows" -or $hostInfo.arch -ne "x86_64" -or -not $hostInfo.transportSupported) {
            throw "The native host did not advertise its Windows transport."
          }
      - name: Exercise private pipe ownership and attachment lifecycle
        timeout-minutes: 20
        run: python .github/scripts/editor-native-tests.py bridge --manifest "$env:RUNNER_TEMP/editor-native-tests.json"
      - name: Exercise metadata, ownership, runtime input and console shutdown
        timeout-minutes: 25
        run: python .github/scripts/editor-native-tests.py host --manifest "$env:RUNNER_TEMP/editor-native-tests.json"
      - name: Exercise native process deadline and cancellation
        run: python .github/scripts/editor-native-tests.py process --manifest "$env:RUNNER_TEMP/editor-native-tests.json"
      - name: Retain native compiler timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editor-windows-build-timings
          path: target/cargo-timings/
          if-no-files-found: ignore

  adapters:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install migration fixture target
        run: rustup target add wasm32-unknown-unknown
      - name: Install protobuf compiler
        run: choco install protoc --yes --no-progress
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: editor-windows-adapters
          cache-on-failure: "true"
          cache-workspace-crates: "false"
          cache-bin: "false"
      - name: Check the native client and desktop adapters
        run: cargo check --locked -p gents-client-host -p gents-desktop-tauri
