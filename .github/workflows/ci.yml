name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_candidate:
        description: Run the full non-PR candidate suites.
        required: true
        type: boolean
        default: true
      candidate_sha:
        description: Exact 40-character commit SHA expected at the dispatched ref.
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each 32-core Studio runs at most two gents jobs concurrently. Keep eight
  # cores free for the OS and other host services.
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS || '12' }}
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TARGET_ROOT: ${{ vars.CARGO_TARGET_ROOT || '/Users/admin/.cache/gents-cargo-target' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  LEAN_CACHE_ROOT: ${{ vars.LEAN_CACHE_ROOT || '/Users/admin/.cache/gents-lean' }}
  RUSTC_WRAPPER: sccache
  RUST_BACKTRACE: "1"
  SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_CACHE_SIZE || '60G' }}
  # The host service and clients normalize every registered checkout root.
  SCCACHE_BASEDIRS: ${{ vars.SCCACHE_BASEDIRS }}
  SCCACHE_DIR: ${{ vars.SCCACHE_DIR || '/Users/admin/.cache/sccache' }}

jobs:
  rename-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify immutable full-candidate dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FULL_CANDIDATE: ${{ inputs.full_candidate }}
        run: |
          set -euo pipefail
          if [[ "${FULL_CANDIDATE}" != "true" ]]; then
            echo "::error::Manual CI dispatches must select full_candidate."
            exit 1
          fi
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::candidate_sha ${CANDIDATE_SHA} does not match checked-out GITHUB_SHA ${GITHUB_SHA}."
            exit 1
          fi

      - name: Check rename tool syntax
        run: bash -n scripts/rename-to-gents.sh

      - name: Run rename tool self-test
        run: scripts/rename-to-gents.sh self-test

      - name: Reject stale product identifiers
        run: scripts/rename-to-gents.sh guard all

  rust-and-cli:
    name: rust-and-cli (${{ matrix.suite }})
    needs: rename-guard
    runs-on: [self-hosted, macOS, ARM64, studio]
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime, cli, desktop, support]
    # A cold runner instance must compile and link every Rust target. Each
    # runner process owns a durable target directory; sccache is host-shared.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install support-suite Rust components
        if: matrix.suite == 'support'
        run: |
          rustup component add rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cargo_dir="$(dirname "$(rustup which cargo)")"
          echo "${cargo_dir}" >> "$GITHUB_PATH"
          "${cargo_dir}/cargo" --version
          "$HOME/.elan/bin/elan" --version

      - name: Install protobuf compiler
        run: .github/scripts/setup-protoc.sh

      - name: Prepare disk-backed Rust build cache
        run: .github/scripts/setup-rust-build-cache.sh

      # Runtime conformance tests load the generated Lean contract. Mathlib
      # publishes matching precompiled artifacts; without this step Lake
      # recompiles the dependency graph from source in every clean checkout.
      - name: Prepare persistent Lean build cache
        if: matrix.suite == 'runtime'
        run: .github/scripts/setup-lean-build-cache.sh

      - name: Download precompiled Mathlib artifacts
        if: matrix.suite == 'runtime'
        working-directory: crates/gents/proofs
        run: lake exe cache get

      - name: Check formatting
        if: matrix.suite == 'support'
        run: cargo fmt --all --check

      - name: Assert native-e2e excluded from production capabilities
        if: matrix.suite == 'support'
        run: ./scripts/check-native-e2e-capabilities.sh

      # Together these four jobs compile and link the FULL workspace target
      # surface — examples, benches, every test target, and the desktop crates.
      # This preserves the #646 construction-site fence without doing a
      # metadata-only cargo check pass before the test-profile build.
      - name: Compile and link runtime targets
        if: matrix.suite == 'runtime'
        run: cargo test -p gents --all-targets --no-run

      - name: Compile and link CLI targets
        if: matrix.suite == 'cli'
        run: cargo test -p gents-cli --all-targets --no-run

      - name: Compile and link desktop targets
        if: matrix.suite == 'desktop'
        run: |
          cargo test \
            -p gents-desktop-core \
            -p gents-desktop \
            -p gents-desktop-bridge \
            -p fixture-domain-plugin \
            -p gents-fixture-host \
            --all-targets --no-run
          cargo test -p gents-desktop-tauri --all-targets --no-run

      - name: Compile and link support targets
        if: matrix.suite == 'support'
        run: |
          cargo test \
            -p gents-lean-contract \
            -p gents-migration \
            -p gents-lens-fixture-add-label \
            -p gents-fs-runner \
            -p gents-protocol \
            -p gents-schemas \
            --all-targets --no-run

      - name: Build the WASM lens target
        if: matrix.suite == 'support'
        run: cargo build -p gents-lens-fixture-add-label --target wasm32-unknown-unknown

      - name: Run migration package tests
        if: matrix.suite == 'support'
        run: |
          cargo test -p gents-migration -p gents-lens-fixture-add-label

      - name: Run PR runtime smoke tests
        if: matrix.suite == 'runtime' && github.event_name == 'pull_request'
        run: |
          cargo test -p gents --lib runtime_status::tests::
          cargo test -p gents --lib toolset::tests::read_only_bash

      - name: Run PR CLI smoke tests
        if: matrix.suite == 'cli' && github.event_name == 'pull_request'
        run: |
          cargo test -p gents-cli --test cli_server server_startup_with_iroh_p2p_reports_runtime_connectivity -- --nocapture --test-threads=1
          cargo test -p gents-cli --test cli_status -- --nocapture --test-threads=1
          cargo test -p gents-cli --test cli_reconciliation reconciled_runtime_sends_generation_two_tools_and_completes_tool_loop -- --nocapture --test-threads=1

      - name: Run full library and integration tests
        if: matrix.suite == 'runtime' && github.event_name != 'pull_request'
        run: cargo test -p gents --lib --tests

      - name: Run desktop Rust package tests
        if: matrix.suite == 'desktop'
        run: |
          cargo test \
            -p gents-desktop-core \
            -p gents-desktop \
            -p gents-desktop-bridge \
            -p fixture-domain-plugin \
            -p gents-fixture-host
          cargo test -p gents-desktop-tauri --lib

      - name: Run full CLI test suite
        if: matrix.suite == 'cli' && github.event_name != 'pull_request'
        run: cargo test -p gents-cli -- --nocapture --test-threads=1

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

  lean-proofs:
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cargo_dir="$(dirname "$(rustup which cargo)")"
          echo "${cargo_dir}" >> "$GITHUB_PATH"
          "${cargo_dir}/cargo" --version
          "$HOME/.elan/bin/elan" --version

      - name: Install protobuf compiler
        run: .github/scripts/setup-protoc.sh

      - name: Prepare disk-backed Rust build cache
        run: .github/scripts/setup-rust-build-cache.sh

      - name: Prepare persistent Lean build cache
        run: .github/scripts/setup-lean-build-cache.sh

      - name: Download precompiled Mathlib artifacts
        working-directory: crates/gents/proofs
        run: lake exe cache get

      - name: Reject Lean sorry placeholders
        working-directory: crates/gents/proofs
        run: |
          if find . -type f -name '*.lean' -exec grep -n -E '(^|[^[:alnum:]_])sorry([^[:alnum:]_]|$)' {} +; then
            echo "::error::Lean proof sources must not contain sorry placeholders."
            exit 1
          fi

      - name: Build proofs
        working-directory: crates/gents/proofs
        run: lake build

      - name: Run proof conformance tests
        run: cargo test -p gents --test conformance

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

  desktop-ui:
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Build and test desktop packages
        run: |
          npm run check:package-boundaries
          npm run build:packages
          npm run test:packages
          npm run build --workspace @source-inc/fixture-host-ui
          # Exercise the same relative output path used by the release workflow.
          ./scripts/pack-desktop-packages.sh target/desktop-npm-ci

      - name: Install Playwright browser
        working-directory: apps/gents-desktop
        run: npx playwright install chromium

      - name: Check desktop formatting
        working-directory: apps/gents-desktop
        run: npm run format:check

      - name: Build desktop frontend
        working-directory: apps/gents-desktop
        run: npm run build

      - name: Run desktop unit tests
        working-directory: apps/gents-desktop
        run: npm test

      - name: Run desktop browser journeys
        working-directory: apps/gents-desktop
        run: npm run test:ui:e2e

      - name: Run desktop Bombadil smoke
        working-directory: apps/gents-desktop
        run: npm run test:ui:fuzz -- --time-limit 30s

      # Bombadil has no --seed; the recorded trace is the only exact-replay
      # handle. Upload it on success too so a failing run can be bisected
      # against a known-good trace (npm run test:ui:fuzz -- --reproduce <dir>).
      - name: Upload Bombadil trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-bombadil-trace
          if-no-files-found: ignore
          retention-days: 30
          path: apps/gents-desktop/test-results/bombadil

      - name: Upload desktop UI artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-artifacts
          if-no-files-found: ignore
          path: |
            apps/gents-desktop/test-results
            apps/gents-desktop/playwright-report
            apps/gents-desktop/playwright-screenshots-report
