name: CI

# The pull request gate. `plan` maps the change to the crates it touches and
# their reverse dependents and selects jobs; every job runs a `make gate-run`
# recipe, so `make gate` runs the same commands locally. A draft is linted
# across the changed crates and their dependents and tested on the crates it
# changes; a pull request that is ready for review, and a merge queue entry,
# also test the dependents; a push to main selects everything. `gate` is the
# one check to require, so it must run on every event a merge waits for.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  # A daily run of main's archived test groups that ignores the test-result
  # cache, so a cache defect cannot hide a regression for longer than a day.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      full_candidate:
        description: Run the whole gate on the dispatched commit.
        required: true
        type: boolean
        default: true
      candidate_sha:
        description: Exact 40-character commit SHA expected at the dispatched ref.
        required: true
        type: string
      only:
        description: Space-separated gate jobs for a focused rerun (lint, contract, test:cli, ts-unit, ...); empty runs all.
        required: false
        type: string
        default: ""
      runner_overrides:
        description: JSON object from runner role to label list for this run only (roles in .github/ci-runners.json); empty uses the inventory.
        required: false
        type: string
        default: ""
      portable_shards:
        description: Build the portable groups once and run their tests as this many slices on this run only; empty uses GENTS_CI_PORTABLE_SHARDS, 0 keeps one job per group.
        required: false
        type: string
        default: ""
      test_cache:
        description: Test-result cache for the in-build portable slice on this run only (off, on, or full to run every test and record); empty uses GENTS_CI_TEST_CACHE.
        required: false
        type: string
        default: ""

# A new push to a pull request cancels its run in progress. A run of main, a
# merge queue entry or a dispatch finishes: main's post-merge run is the only
# run of each merged commit. GitHub keeps the newest waiting run per group.
concurrency:
  # The scheduled run queues apart from main's pushes so neither replaces the other.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Each 32-core Studio runs at most two gents jobs concurrently. Keep eight
  # cores free for the OS and other host services.
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS || '12' }}
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # A runner keeps its Cargo target tree between jobs only for pushes to main
  # and pull requests from this repository's own branches. Fork pull requests
  # and every other event build in a job-scoped tree, so build outputs,
  # build-script outputs included, never cross into another trust domain's job.
  # test-rust-build-space.py evaluates this condition per event.
  GENTS_CI_KEEP_TARGET_TREE: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
    (github.event_name == 'pull_request' &&
    github.event.pull_request.head.repo.full_name == github.repository) }}
  # Only runs of this repository's own code record test results: pushes to
  # main, the scheduled run, merge queue entries, dispatches and pull requests
  # from this repository's branches. Fork pull requests never record.
  GATE_TEST_CACHE_TRUSTED: >-
    ${{ github.event_name == 'push' || github.event_name == 'schedule' ||
    github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' ||
    (github.event_name == 'pull_request' &&
    github.event.pull_request.head.repo.full_name == github.repository) }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  LEAN_CACHE_ROOT: ${{ vars.LEAN_CACHE_ROOT || '/Users/admin/.cache/gents-lean' }}
  RUSTC_WRAPPER: sccache
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: ${{ vars.RUST_TEST_THREADS || vars.CARGO_BUILD_JOBS || '12' }}
  SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_CACHE_SIZE || '120G' }}
  # The host service and clients normalize every registered checkout root.
  SCCACHE_BASEDIRS: ${{ vars.SCCACHE_BASEDIRS }}
  SCCACHE_DIR: ${{ vars.SCCACHE_DIR || '/Users/admin/.cache/sccache' }}
  # Compile locally instead of failing the job if the host server drops a request.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  # Every job runs where the plan's runs_on says: the runner roles in
  # .github/ci-runners.json, a hosted runner for a fork pull request, or a
  # role's fallback while GENTS_CI_FALLBACK is `hosted`. The plan itself
  # cannot read the plan, so its labels are the inventory's `linux` role
  # (test_gate.py keeps them equal).
  plan:
    runs-on: >-
      ${{ ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository) ||
      vars.GENTS_CI_FALLBACK == 'hosted') && 'ubuntu-latest' ||
      fromJSON('["self-hosted","Linux","X64","ci-linux"]') }}
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
      tests: ${{ steps.plan.outputs.tests }}
      archives: ${{ steps.plan.outputs.archives }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List the files the pull request changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "${RUNNER_TEMP}/changed-files.txt"
          count="$(wc -l < "${RUNNER_TEMP}/changed-files.txt")"
          echo "The pull request changes ${count} paths."
          # The API lists at most 3000 files; a larger change selects everything.
          if (( count == 0 || count >= 3000 )); then
            echo "GATE_EVERYTHING=true" >> "$GITHUB_ENV"
          fi

      # A queue entry is its base plus every pull request queued ahead of it
      # and its own; the diff covers all of them.
      - name: List the files the merge queue entry changes
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git diff --name-only --no-renames "${BASE_SHA}" HEAD > "${RUNNER_TEMP}/changed-files.txt"
          count="$(wc -l < "${RUNNER_TEMP}/changed-files.txt")"
          echo "The merge queue entry changes ${count} paths."
          if (( count == 0 )); then
            echo "GATE_EVERYTHING=true" >> "$GITHUB_ENV"
          fi

      - name: Install the pinned Rust toolchain
        run: .github/scripts/setup-rust.sh

      - name: Select gate jobs
        id: plan
        env:
          GATE_EVERYTHING: >-
            ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group')
            && 'true' || env.GATE_EVERYTHING }}
          # The scheduled run is the full test-cache run of the archived groups.
          GATE_ONLY: ${{ github.event_name == 'schedule' && 'build:portable' || inputs.only }}
          # scripts/ci/gate.py test_cache_mode reads these.
          GATE_EVENT: ${{ github.event_name }}
          GATE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GATE_TEST_CACHE_INPUT: ${{ inputs.test_cache }}
          GATE_TEST_CACHE: ${{ vars.GENTS_CI_TEST_CACHE }}
          GATE_TEST_CACHE_MAIN: ${{ vars.GENTS_CI_TEST_CACHE_MAIN }}
          GATE_RUNNER_OVERRIDES: ${{ inputs.runner_overrides }}
          GATE_FALLBACK: ${{ vars.GENTS_CI_FALLBACK }}
          GATE_FORK: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository }}
          GATE_PORTABLE_SHARDS: ${{ inputs.portable_shards || vars.GENTS_CI_PORTABLE_SHARDS }}
          GATE_RUNTIME_ISOLATED: ${{ vars.GENTS_CI_RUNTIME_ISOLATED }}
          # Inside a stack only the top is tested in full: lower layers may be
          # intentionally red. A pull request into the default branch always is.
          GATE_TIER: >-
            ${{ (github.event_name != 'pull_request' ||
            (github.event.pull_request.draft == false &&
            (github.event.pull_request.base.ref == github.event.repository.default_branch ||
            github.event.pull_request.stack == null ||
            github.event.pull_request.stack.position == github.event.pull_request.stack.size)))
            && 'full' || 'draft' }}
        run: python3 scripts/ci/gate.py plan --files "${RUNNER_TEMP}/changed-files.txt"

  repository-guard:
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify immutable full-candidate dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FULL_CANDIDATE: ${{ inputs.full_candidate }}
        run: |
          set -euo pipefail
          if [[ "${FULL_CANDIDATE}" != "true" ]]; then
            echo "::error::Manual CI dispatches must select full_candidate."
            exit 1
          fi
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::candidate_sha ${CANDIDATE_SHA} does not match checked-out GITHUB_SHA ${GITHUB_SHA}."
            exit 1
          fi

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Install the pinned Rust toolchain and shellcheck
        run: |
          .github/scripts/setup-rust.sh
          .github/scripts/setup-shellcheck.sh

      - name: Check gate selection and test guards
        run: make gate-selftest

      - name: Check the live node backstop
        run: |
          shellcheck .github/scripts/host-runtime-service.sh .github/scripts/setup-rust-build-cache.sh \
            .github/scripts/setup-shellcheck.sh
          python3 .github/scripts/test-host-runtime-service.py

      - name: Check Harbor runner syntax
        run: |
          bash -n scripts/harbor/run_gents.sh
          bash -n scripts/measure-gents-binary.sh
          bash -n scripts/measure-gents-build-attribution.sh
          bash -n .github/scripts/desktop-runtime-journey.sh
          bash -n .github/scripts/setup-macos-rust-toolchain.sh .github/scripts/setup-cmake.sh
          shellcheck -s sh scripts/harbor/run_gents.sh
          shellcheck scripts/measure-gents-binary.sh
          shellcheck scripts/measure-gents-build-attribution.sh
          shellcheck .github/scripts/desktop-runtime-journey.sh
          shellcheck .github/scripts/setup-macos-rust-toolchain.sh .github/scripts/setup-cmake.sh

      - name: Check the macOS toolchain selection
        run: python3 .github/scripts/test-macos-rust-toolchain.py

      - name: Check isolated runtime runner validation
        run: python3 .github/scripts/test-isolated-runtime-runner.py

      - name: Run Harbor runner self-test
        run: scripts/harbor/run_gents.sh self-test

      - name: Run build attribution parser self-test
        run: scripts/measure-gents-build-attribution.sh self-test

      - name: Report jobs a fork pull request skips
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || 'a deleted repository' }}
        run: |
          message="This pull request comes from ${HEAD_REPOSITORY}, so jobs that run on self-hosted runners (lint, contract, test, build, shard, desktop-ui-bombadil, core-packs build, adapter-interop) are skipped and gate fails if the plan selected one; the other jobs run on GitHub-hosted runners. A maintainer reruns the change from a branch of this repository to test it on the self-hosted runners."
          echo "::notice title=Self-hosted jobs skipped for a fork::${message}"
          printf '### Self-hosted jobs skipped for a fork\n\n%s\n' "${message}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check runner build-space reclamation
        run: python3 .github/scripts/test-rust-build-space.py

      - name: Check the runner-local Lean cache link
        run: |
          shellcheck .github/scripts/setup-lean-build-cache.sh
          python3 .github/scripts/test-setup-lean-build-cache.py

      - name: Run Harbor agent adapter tests
        run: python3 scripts/harbor/test_gents_agent.py

      - name: Check the eval ladder and live Engineer eval drivers
        run: |
          bash -n scripts/evals/run-ladder.sh
          python3 scripts/evals/test_ladder_batch.py
          python3 scripts/evals/test_ladder_baseline.py
          python3 scripts/evals/test_live_engineer_eval.py

      - name: Check compiler-tool download recovery
        run: |
          bash -n .github/scripts/setup-afterburner-toolchains.sh
          shellcheck .github/scripts/setup-afterburner-toolchains.sh
          python3 .github/scripts/test-afterburner-downloads.py

  publish-control-tests:
    # Focused, network-free tests for the staged-prerelease publication
    # control script (fake gh). No secrets; read-only token.
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run publication control tests
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            python=python3
          else
            python3 -m venv "${RUNNER_TEMP}/yaml-venv"
            "${RUNNER_TEMP}/yaml-venv/bin/pip" install --quiet pyyaml==6.0.2
            python="${RUNNER_TEMP}/yaml-venv/bin/python"
          fi
          "${python}" .github/scripts/test-publish-staged-prerelease.py

  fmt:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'fmt')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 10
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: .github/scripts/setup-rust.sh
      - name: Check formatting
        run: make gate-run JOB=fmt

  # The product build without test features, then clippy over every target of
  # the changed crates and their dependents.
  lint:
    needs: [plan, repository-guard]
    # Fork pull requests never run on a self-hosted runner: its account shares
    # the Cargo home, the compiler cache and the kept target trees with every
    # other runner on the host (test-rust-build-space.py checks every job).
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'lint')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.macos }}
    timeout-minutes: 90
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      - uses: ./.github/actions/rust-runner
        with:
          role: macos

      - name: Install cargo-hakari
        run: .github/scripts/setup-hakari.sh

      - name: Check the product build and clippy
        run: make gate-run JOB=lint

      - name: Record Rust dependency graph metrics
        env:
          MEASURE_MODE: graph
          OUTPUT_JSON: ${{ runner.temp }}/gents-build-graph-${{ github.sha }}.json
        run: |
          scripts/measure-gents-binary.sh
          jq -e '
            .schema_version == 2
            and .dependencies.root_package == "gents-cli"
            and .dependencies.target == .target_triple
            and .dependencies.normal_packages > 0
            and .dependencies.all_target_normal_packages >= .dependencies.normal_packages
            and (.dependencies.duplicate_packages | length) == .dependencies.duplicate_package_names
          ' "${OUTPUT_JSON}" >/dev/null

      - name: Upload Rust dependency graph metrics
        uses: actions/upload-artifact@v7
        with:
          name: gents-build-graph-${{ github.sha }}
          path: ${{ runner.temp }}/gents-build-graph-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

  # Proofs, the files generated from them, the one-consumer-per-family scan
  # and, when the runtime group does not run them, the structure ratchets.
  contract:
    needs: [plan, repository-guard]
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'contract')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.macos }}
    timeout-minutes: 90
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      - uses: ./.github/actions/rust-runner
        with:
          lean: "true"
          role: macos

      - uses: actions/setup-node@v7
        if: fromJSON(needs.plan.outputs.plan).contract.ts_lean
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install workspace frontend dependencies
        if: fromJSON(needs.plan.outputs.plan).contract.ts_lean
        run: npm ci

      - name: Check proofs, generated files and structure
        run: make gate-run JOB=contract

      # Here rather than in repository-guard: this job already has the
      # proofs' Lean toolchain and dependencies, which a cold guard runner
      # spent its whole 10 minutes fetching.
      - name: Check the test-result cache against its Lean model
        if: fromJSON(needs.plan.outputs.plan).contract.test_cache_model
        run: .github/scripts/check-test-cache-model.sh

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

  # One job per group of crates that holds a changed crate or a dependent.
  # Each job starts from an empty RUNNER_TEMP target tree; the host sccache
  # service supplies cached rlibs, so parallel jobs share compilation.
  test:
    name: test (${{ matrix.group }})
    needs: [plan, repository-guard]
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.plan.outputs.tests == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      # Enable only after provisioning a separate OS account and runner. The
      # configured path must be the running fleet node's actual gents home.
      - name: Verify isolated runtime runner
        if: matrix.group == 'runtime' && vars.GENTS_CI_RUNTIME_ISOLATED == 'true'
        env:
          GENTS_CI_FLEET_HOME: ${{ vars.GENTS_CI_FLEET_HOME }}
          GENTS_CI_FLEET_USER: ${{ vars.GENTS_CI_FLEET_USER }}
        run: |
          python3 .github/scripts/check-isolated-runtime-runner.py
          echo "LEAN_CACHE_ROOT=$HOME/.cache/gents-lean" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"

      - uses: ./.github/actions/rust-runner
        with:
          lean: "true"
          afterburner: ${{ matrix.go }}
          role: ${{ matrix.role }}

      - name: Run tests for ${{ matrix.packages }}
        run: make gate-run JOB="test:${{ matrix.group }}"

      - name: Collect migration lens diagnostics on failure
        if: failure() && matrix.group == 'foundation'
        run: python3 .github/scripts/collect-migration-lens-diagnostics.py "${RUNNER_TEMP}/gents-migration-lenses"

      - name: Upload migration lens diagnostics
        if: failure() && matrix.group == 'foundation'
        uses: actions/upload-artifact@v7
        with:
          name: gents-migration-lenses-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gents-migration-lenses
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

  # With GATE_PORTABLE_SHARDS set, the portable groups' crates compile once
  # here into a nextest archive; `shard` runs slices of it and compiles nothing.
  build:
    name: build (${{ matrix.archive }})
    needs: [plan, repository-guard]
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'build:portable')
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.archives) }}
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      # A single slice runs its tests in this job, and the Lean-backed ones
      # need the built contract: without it 12 waited out 600 s behind the
      # proofs lock (dispatch 43780116459).
      - uses: ./.github/actions/rust-runner
        with:
          lean: ${{ matrix.run && 'true' || 'false' }}

      - name: Install cargo-nextest
        run: .github/scripts/setup-nextest.sh

      - name: Build the ${{ matrix.archive }} test archive
        env:
          GATE_TEST_CACHE_REPORT: ${{ runner.temp }}/test-cache-report.json
        run: make gate-run JOB="build:${{ matrix.archive }}"

      - name: Upload the test cache report
        if: always() && matrix.test_cache != 'off'
        uses: actions/upload-artifact@v7
        with:
          name: gents-test-cache-${{ matrix.archive }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-cache-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the ${{ matrix.archive }} test archive
        if: ${{ !matrix.run }}
        uses: actions/upload-artifact@v7
        with:
          name: gents-tests-${{ matrix.archive }}
          path: ${{ runner.temp }}/gents-tests
          if-no-files-found: error
          compression-level: 0
          # Re-running failed slices needs the run's archive; a rebuilt one replaces it.
          overwrite: true
          retention-days: 1

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

  shard:
    name: test (${{ matrix.archive }} ${{ matrix.index }}/${{ matrix.count }})
    needs: [plan, build]
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'shard:portable')
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      - uses: ./.github/actions/rust-runner
        with:
          lean: "true"

      - name: Install cargo-nextest
        run: .github/scripts/setup-nextest.sh

      - name: Download the ${{ matrix.archive }} test archive
        uses: actions/download-artifact@v7
        with:
          name: gents-tests-${{ matrix.archive }}
          path: ${{ runner.temp }}/gents-tests

      - name: Run slice ${{ matrix.index }} of ${{ matrix.count }}
        run: make gate-run JOB="shard:${{ matrix.archive }}:${{ matrix.index }}"

      - name: Upload the slice's JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gents-junit-${{ matrix.archive }}-${{ matrix.index }}-of-${{ matrix.count }}-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect migration lens diagnostics on failure
        if: failure()
        run: python3 .github/scripts/collect-migration-lens-diagnostics.py "${RUNNER_TEMP}/gents-migration-lenses"

      - name: Upload migration lens diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gents-migration-lenses-${{ github.sha }}-${{ matrix.index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gents-migration-lenses
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

  desktop-packages:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'ts-packages')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 15
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Check, build, test and pack the desktop packages
        run: make gate-run JOB=ts-packages

  desktop-ui:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'ts-unit')
    # This job exercises browser-only code. Keep scarce macOS capacity for the
    # Rust/Lean work that benefits from persistent host caches.
    name: desktop-ui (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.browser }}
    # On two Playwright workers the browser journeys take 24 to 37 minutes on
    # a hosted four-core runner (#3786); each third takes about 9 to 12.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
          - { suite: browser, shard: 1/3 }
          - { suite: browser, shard: 2/3 }
          - { suite: browser, shard: 3/3 }
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      DESKTOP_UI_E2E_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      # A hosted runner is a fresh machine: install the browsers' system
      # libraries as root. A self-hosted browser runner has them installed
      # once by its operator (`npx playwright install-deps chromium webkit`)
      # and keeps the browsers in its account's cache.
      - name: Use the Ubuntu archive for browser system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path

          for path in Path('/etc/apt').rglob('*'):
              if not path.is_file():
                  continue
              if path.suffix not in {'.sources', '.list'} and path.name != 'apt-mirrors.txt':
                  continue
              original = path.read_text(encoding='utf-8')
              updated = original
              for scheme in ('http', 'https'):
                  updated = updated.replace(
                      f'{scheme}://azure.archive.ubuntu.com/ubuntu',
                      'https://archive.ubuntu.com/ubuntu',
                  )
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  print(f'Using the Ubuntu archive in {path}')
          PYTHON

      # The unit lane's interaction budgets drive Chromium; the journeys
      # also need WebKit.
      - name: Install Playwright browsers
        working-directory: apps/gents-desktop
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          BROWSERS: ${{ matrix.suite == 'browser' && 'chromium webkit' || 'chromium' }}
        run: |
          read -ra browsers <<< "${BROWSERS}"
          if [[ "${HOSTED}" == true ]]; then
            npx playwright install --with-deps "${browsers[@]}"
          else
            npx playwright install "${browsers[@]}"
          fi

      - name: Run the desktop ${{ matrix.suite }} suite
        run: make gate-run JOB="ts-${{ matrix.suite }}"

      - name: Upload desktop UI artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-artifacts-${{ matrix.suite }}-${{ strategy.job-index }}
          if-no-files-found: ignore
          path: |
            apps/gents-desktop/test-results
            apps/gents-desktop/playwright-report
            apps/gents-desktop/playwright-screenshots-report

  desktop-ui-bombadil:
    needs: plan
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'ts-fuzz')
    # Bombadil's exact Linux failure trace passes on macOS, so this smoke
    # stays on macOS while the portable UI suite runs on Linux.
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.macos }}
    # A runner's first checkout is a full clone; the smoke itself keeps its
    # 10-minute bound on its own step.
    timeout-minutes: 30
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/gents-desktop
        run: npx playwright install chromium

      - name: Run desktop Bombadil smoke
        timeout-minutes: 10
        run: make gate-run JOB=ts-fuzz

      # Bombadil has no --seed; the recorded trace is the only exact-replay
      # handle. Upload it on success too so a failing run can be bisected
      # against a known-good trace (npm run test:ui:fuzz -- --reproduce <dir>).
      - name: Upload Bombadil trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-bombadil-trace
          if-no-files-found: ignore
          retention-days: 30
          path: apps/gents-desktop/test-results/bombadil

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

  triage-hygiene:
    # The issue-triage bot holds `issues: write` and runs on a daily cron. These
    # tests are the only fence on its decision function, so every pull request
    # must run them.
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The triage scripts import `node:` built-ins only, so this job needs no
      # `npm ci` and therefore no npm cache.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run triage-hygiene tests
        run: npm run test:triage

  notary-control-tests:
    # Focused, network-free tests for the staged-artifact notarization control
    # scripts. They need real macOS ditto/shasum and no secrets. Draft PRs run
    # them too.
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.macos }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run notarization control tests
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            python=python3
          else
            python3 -m venv "${RUNNER_TEMP}/yaml-venv"
            "${RUNNER_TEMP}/yaml-venv/bin/pip" install --quiet pyyaml==6.0.2
            python="${RUNNER_TEMP}/yaml-venv/bin/python"
          fi
          bash -n .github/scripts/notarize-staged-artifact.sh
          "${python}" .github/scripts/test-notarize-staged-artifact.py
          "${python}" .github/scripts/test-rc1-notary-auth.py
          "${python}" .github/scripts/test-release-signing-mode.py

  # The one check to require: every job that runs on every event, and every
  # job the plan selected, succeeded. A skip passes only for a job the plan
  # left out (scripts/ci/gate.py verdict).
  gate:
    if: always()
    needs:
      - plan
      - repository-guard
      - fmt
      - lint
      - contract
      - test
      - build
      - shard
      - desktop-packages
      - desktop-ui
      - desktop-ui-bombadil
      - publish-control-tests
      - triage-hygiene
      - notary-control-tests
    # A failed plan has no runs_on; the verdict still reports it.
    runs-on: >-
      ${{ needs.plan.outputs.plan && fromJSON(needs.plan.outputs.plan).runs_on.linux ||
      'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          GATE_FORK: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository }}
        run: python3 scripts/ci/gate.py verdict
