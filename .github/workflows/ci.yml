name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_candidate:
        description: Run the full non-PR candidate suites.
        required: true
        type: boolean
        default: true
      candidate_sha:
        description: Exact 40-character commit SHA expected at the dispatched ref.
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS || '4' }}
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  RUSTC_WRAPPER: sccache
  RUST_BACKTRACE: "1"
  SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_CACHE_SIZE || '60G' }}
  SCCACHE_DIR: ${{ vars.SCCACHE_DIR || '/Users/admin/.cache/sccache' }}

jobs:
  rename-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify immutable full-candidate dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FULL_CANDIDATE: ${{ inputs.full_candidate }}
        run: |
          set -euo pipefail
          if [[ "${FULL_CANDIDATE}" != "true" ]]; then
            echo "::error::Manual CI dispatches must select full_candidate."
            exit 1
          fi
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::candidate_sha ${CANDIDATE_SHA} does not match checked-out GITHUB_SHA ${GITHUB_SHA}."
            exit 1
          fi

      - name: Check rename tool syntax
        run: bash -n scripts/rename-to-gents.sh

      - name: Run rename tool self-test
        run: scripts/rename-to-gents.sh self-test

      - name: Reject stale product identifiers
        run: scripts/rename-to-gents.sh guard all

  rust-and-cli:
    needs: [rename-guard, lean-proofs]
    if: ${{ always() }}
    runs-on: [self-hosted, macOS, ARM64, studio]
    # A cold self-hosted checkout must compile and link every Rust test target;
    # repository/path changes invalidate the disk-backed build cache.
    timeout-minutes: 180
    steps:
      - name: Require rename guard
        if: ${{ needs.rename-guard.result != 'success' }}
        run: |
          echo "::error::rename-guard must pass before the Rust and CLI suites run (got '${{ needs.rename-guard.result }}')."
          exit 1

      - name: Require Lean/Rust contract gate
        if: ${{ needs.lean-proofs.result != 'success' }}
        run: |
          echo "::error::lean-proofs must pass before the Rust and CLI suites run (got '${{ needs.lean-proofs.result }}')."
          exit 1

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rewrite Git SSH dependencies to HTTPS
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_REPO_PAT}" ]]; then
            echo "::error::Missing PRIVATE_REPO_PAT; required to fetch private Source Network git dependencies."
            exit 1
          fi
          auth_url="https://x-access-token:${PRIVATE_REPO_PAT}@github.com/sourcenetwork/"
          git config --global --add url."${auth_url}".insteadOf "https://github.com/sourcenetwork/"
          git config --global --add url."${auth_url}".insteadOf "ssh://git@github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cargo_dir="$(dirname "$(rustup which cargo)")"
          echo "${cargo_dir}" >> "$GITHUB_PATH"
          "${cargo_dir}/cargo" --version
          "$HOME/.elan/bin/elan" --version

      - name: Install protobuf compiler
        run: |
          set -euo pipefail

          protoc_path=""
          if [[ -x "/opt/homebrew/bin/protoc" ]]; then
            protoc_path="/opt/homebrew/bin/protoc"
          elif command -v protoc >/dev/null 2>&1; then
            protoc_path="$(command -v protoc)"
          else
            if ! command -v brew >/dev/null 2>&1; then
              echo "::error::protoc is missing and Homebrew is not available to install protobuf."
              exit 1
            fi
            brew install protobuf
            protoc_path="$(brew --prefix protobuf)/bin/protoc"
          fi

          if [[ ! -x "${protoc_path}" ]]; then
            echo "::error::protoc was not found at ${protoc_path}."
            exit 1
          fi

          echo "$(dirname "${protoc_path}")" >> "${GITHUB_PATH}"
          echo "PROTOC=${protoc_path}" >> "${GITHUB_ENV}"
          "${protoc_path}" --version

      - name: Prepare disk-backed Rust build cache
        run: .github/scripts/setup-rust-build-cache.sh

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Assert native-e2e excluded from production capabilities
        run: ./scripts/check-native-e2e-capabilities.sh

      # Compile the FULL target surface — examples, every test target, and the
      # desktop crates — which the test steps below do not cover. A PR that adds
      # a required field to a widely-constructed struct breaks literal
      # construction sites in these uncovered targets; this fails fast on them
      # instead of letting the breakage slip to main and land on the next PR
      # (#646). It also warms the build cache for the test steps that follow.
      - name: Compile all targets
        run: cargo check --workspace --all-targets

      - name: Build the WASM lens target
        run: cargo build -p agent-tool-call-lifecycle-v1-to-v2-lens --target wasm32-unknown-unknown

      # Guards the noq 1.0.1 active_connections underflow fix (gents#634 /
      # n0-computer/noq#743). Vendored under third_party/; not a workspace member.
      - name: noq-proto double-reset regression
        run: cargo test --manifest-path third_party/noq-proto/Cargo.toml regression_double_stateless_reset_single_draining

      - name: Run PR smoke tests
        if: github.event_name == 'pull_request'
        run: |
          cargo test -p gents --lib runtime_status::tests::
          cargo test -p gents --lib toolset::tests::read_only_bash
          cargo test -p gents-cli --test cli_server server_startup_with_iroh_p2p_reports_runtime_connectivity -- --nocapture --test-threads=1
          cargo test -p gents-cli --test cli_status -- --nocapture --test-threads=1
          cargo test -p gents-cli --test cli_reconciliation reconciled_runtime_sends_generation_two_tools_and_completes_tool_loop -- --nocapture --test-threads=1
          cargo test -p gents-desktop-core
          cargo test -p gents-desktop
          cargo test -p gents-desktop-bridge
          cargo test -p gents-desktop-tauri --lib
          cargo test -p fixture-domain-plugin --lib
          cargo check -p gents-fixture-host --all-targets

      - name: Run full library and integration tests
        if: github.event_name != 'pull_request'
        run: cargo test -p gents --lib --tests

      - name: Run desktop Rust package tests
        if: github.event_name != 'pull_request'
        run: |
          cargo test -p gents-desktop-core
          cargo test -p gents-desktop
          cargo test -p gents-desktop-bridge
          cargo test -p gents-desktop-tauri --lib
          cargo test -p fixture-domain-plugin --lib
          cargo check -p gents-fixture-host --all-targets

      - name: Run full CLI test suite
        if: github.event_name != 'pull_request'
        run: cargo test -p gents-cli -- --nocapture --test-threads=1

      - name: Cleanup git auth
        if: always()
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git config --global --remove-section "url.https://x-access-token:${PRIVATE_REPO_PAT:-}@github.com/sourcenetwork/" 2>/dev/null || true
          git config --global --remove-section "url.https://${PRIVATE_REPO_PAT:-}@github.com/sourcenetwork/" 2>/dev/null || true

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

  lean-proofs:
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rewrite Git SSH dependencies to HTTPS
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_REPO_PAT}" ]]; then
            echo "::error::Missing PRIVATE_REPO_PAT; required to fetch private Source Network git dependencies."
            exit 1
          fi
          auth_url="https://x-access-token:${PRIVATE_REPO_PAT}@github.com/sourcenetwork/"
          git config --global --add url."${auth_url}".insteadOf "https://github.com/sourcenetwork/"
          git config --global --add url."${auth_url}".insteadOf "ssh://git@github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cargo_dir="$(dirname "$(rustup which cargo)")"
          echo "${cargo_dir}" >> "$GITHUB_PATH"
          "${cargo_dir}/cargo" --version
          "$HOME/.elan/bin/elan" --version

      - name: Install protobuf compiler
        run: |
          set -euo pipefail

          protoc_path=""
          if [[ -x "/opt/homebrew/bin/protoc" ]]; then
            protoc_path="/opt/homebrew/bin/protoc"
          elif command -v protoc >/dev/null 2>&1; then
            protoc_path="$(command -v protoc)"
          else
            if ! command -v brew >/dev/null 2>&1; then
              echo "::error::protoc is missing and Homebrew is not available to install protobuf."
              exit 1
            fi
            brew install protobuf
            protoc_path="$(brew --prefix protobuf)/bin/protoc"
          fi

          if [[ ! -x "${protoc_path}" ]]; then
            echo "::error::protoc was not found at ${protoc_path}."
            exit 1
          fi

          echo "$(dirname "${protoc_path}")" >> "${GITHUB_PATH}"
          echo "PROTOC=${protoc_path}" >> "${GITHUB_ENV}"
          "${protoc_path}" --version

      - name: Prepare disk-backed Rust build cache
        run: .github/scripts/setup-rust-build-cache.sh

      - name: Reject Lean sorry placeholders
        working-directory: crates/gents/proofs
        run: |
          if find . -type f -name '*.lean' -exec grep -n -E '(^|[^[:alnum:]_])sorry([^[:alnum:]_]|$)' {} +; then
            echo "::error::Lean proof sources must not contain sorry placeholders."
            exit 1
          fi

      - name: Build proofs
        working-directory: crates/gents/proofs
        run: lake build

      - name: Run proof conformance tests
        run: cargo test -p gents --test conformance

      - name: Cleanup git auth
        if: always()
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git config --global --remove-section "url.https://x-access-token:${PRIVATE_REPO_PAT:-}@github.com/sourcenetwork/" 2>/dev/null || true
          git config --global --remove-section "url.https://${PRIVATE_REPO_PAT:-}@github.com/sourcenetwork/" 2>/dev/null || true

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

  desktop-ui:
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" --version

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Build and test desktop packages
        run: |
          npm run check:package-boundaries
          npm run build:packages
          npm run test:packages
          npm run build --workspace @source-inc/fixture-host-ui
          ./scripts/pack-desktop-packages.sh

      - name: Install Playwright browser
        working-directory: apps/gents-desktop
        run: npx playwright install chromium

      - name: Check desktop formatting
        working-directory: apps/gents-desktop
        run: npm run format:check

      - name: Build desktop frontend
        working-directory: apps/gents-desktop
        run: npm run build

      - name: Run desktop unit tests
        working-directory: apps/gents-desktop
        run: npm test

      - name: Run desktop browser journeys
        working-directory: apps/gents-desktop
        run: npm run test:ui:e2e

      - name: Run desktop Bombadil smoke
        working-directory: apps/gents-desktop
        run: npm run test:ui:fuzz -- --time-limit 30s

      - name: Upload desktop UI artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-artifacts
          if-no-files-found: ignore
          path: |
            apps/gents-desktop/test-results
            apps/gents-desktop/playwright-report
            apps/gents-desktop/playwright-screenshots-report
