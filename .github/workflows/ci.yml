name: CI

# The pull request gate. `plan` maps the change to the crates it touches and
# their reverse dependents and selects jobs; every job runs a `make gate-run`
# recipe, so `make gate` runs the same commands locally. A draft is linted
# across the changed crates and their dependents and tested on the crates it
# changes; a pull request that is ready for review, and a merge queue entry,
# also test the dependents. Main is not run on push: every change lands
# through the merge queue, whose run is the change's test, and the nightly
# scheduled run selects everything on main. `gate` is the one check to
# require, so it must run on every event a merge waits for.
#
# A unit of gate work (a job, or a matrix entry) is skipped only if an
# identical input key passed before on the same platform: the plan keys each
# unit by the files the gate says can change it, what the plan asks of it and
# its platform, and a pull request or queue entry skips units whose key a run
# of this repository recorded (scripts/ci/reuse.py). The nightly run and a
# dispatch look nothing up, so a cached pass cannot hide an intermittent
# failure past a day; every same-repository pass records its key.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]
  # A daily run of main: the archived test groups ignoring the test-result
  # cache, so a cache defect cannot hide a regression for longer than a day,
  # and the portable groups that have a macOS role on macOS, uncached, so a
  # platform difference the Linux runs cannot see surfaces within a day.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      full_candidate:
        description: Run the whole gate on the dispatched commit.
        required: true
        type: boolean
        default: true
      candidate_sha:
        description: Exact 40-character commit SHA expected at the dispatched ref.
        required: true
        type: string
      only:
        description: Space-separated gate jobs for a focused rerun (lint, contract, test:cli, ts-unit, ...); empty runs all.
        required: false
        type: string
        default: ""
      runner_overrides:
        description: JSON object from runner role to label list for this run only (roles in .github/ci-runners.json); empty uses the inventory.
        required: false
        type: string
        default: ""
      portable_shards:
        description: Build the portable groups once and run their tests as this many slices on this run only; empty uses GENTS_CI_PORTABLE_SHARDS, 0 keeps one job per group.
        required: false
        type: string
        default: ""

# A new push to a pull request cancels its run in progress. A merge queue
# entry, the scheduled run or a dispatch finishes. GitHub keeps the newest
# waiting run per group.
concurrency:
  # The scheduled run queues apart from dispatches of main so neither replaces the other.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Each 32-core Studio runs at most two gents jobs concurrently. Keep eight
  # cores free for the OS and other host services.
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS || '12' }}
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # A runner keeps its Cargo target tree between jobs only for main (a push,
  # its merge queue or its scheduled run) and pull requests from this
  # repository's own branches: all build this repository's code. Fork pull requests and
  # every other event build in a job-scoped tree, so build outputs,
  # build-script outputs included, never cross into another trust domain's job.
  # test-rust-build-space.py evaluates this condition per event.
  GENTS_CI_KEEP_TARGET_TREE: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
    (github.event_name == 'merge_group' && startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')) ||
    (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
    (github.event_name == 'pull_request' &&
    github.event.pull_request.head.repo.full_name == github.repository) }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  LEAN_CACHE_ROOT: ${{ vars.LEAN_CACHE_ROOT || '/Users/admin/.cache/gents-lean' }}
  RUSTC_WRAPPER: sccache
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: ${{ vars.RUST_TEST_THREADS || vars.CARGO_BUILD_JOBS || '12' }}
  SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_CACHE_SIZE || '120G' }}
  # The host service and clients normalize every registered checkout root.
  SCCACHE_BASEDIRS: ${{ vars.SCCACHE_BASEDIRS }}
  SCCACHE_DIR: ${{ vars.SCCACHE_DIR || '/Users/admin/.cache/sccache' }}
  # Compile locally instead of failing the job if the host server drops a request.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  # Every job runs where the plan's runs_on says: the runner roles in
  # .github/ci-runners.json, a hosted runner for a fork pull request, or a
  # role's fallback while GENTS_CI_FALLBACK is `hosted`. A pull request's
  # self-hosted jobs also require the inventory's reserve label, leaving the
  # reserved runners to the merge queue. The plan itself cannot read the plan,
  # so its labels are the inventory's `linux` role (test_gate.py keeps them equal).
  plan:
    runs-on: >-
      ${{ ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository) ||
      vars.GENTS_CI_FALLBACK == 'hosted') && 'ubuntu-latest' ||
      github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","ci-linux","ci-pr"]') ||
      fromJSON('["self-hosted","Linux","X64","ci-linux"]') }}
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    permissions:
      # The recorded passes are the repository's artifacts.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
      tests: ${{ steps.plan.outputs.tests }}
      archives: ${{ steps.plan.outputs.archives }}
      shards: ${{ steps.plan.outputs.shards }}
      desktop_ui: ${{ steps.plan.outputs.desktop_ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List the files the pull request changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "${RUNNER_TEMP}/changed-files.txt"
          count="$(wc -l < "${RUNNER_TEMP}/changed-files.txt")"
          echo "The pull request changes ${count} paths."
          # The API lists at most 3000 files; a larger change selects everything.
          if (( count == 0 || count >= 3000 )); then
            echo "GATE_EVERYTHING=true" >> "$GITHUB_ENV"
          fi

      # A queue entry is its base plus every pull request queued ahead of it
      # and its own; the diff covers all of them.
      - name: List the files the merge queue entry changes
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git diff --name-only --no-renames "${BASE_SHA}" HEAD > "${RUNNER_TEMP}/changed-files.txt"
          count="$(wc -l < "${RUNNER_TEMP}/changed-files.txt")"
          echo "The merge queue entry changes ${count} paths."
          if (( count == 0 )); then
            echo "GATE_EVERYTHING=true" >> "$GITHUB_ENV"
          fi

      - name: Install the pinned Rust toolchain
        run: .github/scripts/setup-rust.sh

      - name: Select gate jobs
        id: plan
        env:
          GATE_EVERYTHING: >-
            ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group')
            && 'true' || env.GATE_EVERYTHING }}
          # gate.py selects the scheduled run's jobs itself (resolve_plan).
          GATE_ONLY: ${{ inputs.only }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_RUNNER_OVERRIDES: ${{ inputs.runner_overrides }}
          GATE_FALLBACK: ${{ vars.GENTS_CI_FALLBACK }}
          GATE_FORK: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository }}
          GATE_PORTABLE_SHARDS: ${{ inputs.portable_shards || vars.GENTS_CI_PORTABLE_SHARDS }}
          GATE_RUNTIME_ISOLATED: ${{ vars.GENTS_CI_RUNTIME_ISOLATED }}
          GATE_REUSE: >-
            ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group')
            && 'lookup' || 'record' }}
          GH_TOKEN: ${{ github.token }}
          # Inside a stack only the top is tested in full: lower layers may be
          # intentionally red. A pull request into the default branch always is.
          GATE_TIER: >-
            ${{ (github.event_name != 'pull_request' ||
            (github.event.pull_request.draft == false &&
            (github.event.pull_request.base.ref == github.event.repository.default_branch ||
            github.event.pull_request.stack == null ||
            github.event.pull_request.stack.position == github.event.pull_request.stack.size)))
            && 'full' || 'draft' }}
        run: python3 scripts/ci/gate.py plan --files "${RUNNER_TEMP}/changed-files.txt"

  repository-guard:
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify immutable full-candidate dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FULL_CANDIDATE: ${{ inputs.full_candidate }}
        run: |
          set -euo pipefail
          if [[ "${FULL_CANDIDATE}" != "true" ]]; then
            echo "::error::Manual CI dispatches must select full_candidate."
            exit 1
          fi
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::candidate_sha ${CANDIDATE_SHA} does not match checked-out GITHUB_SHA ${GITHUB_SHA}."
            exit 1
          fi

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Install the pinned Rust toolchain and shellcheck
        run: |
          .github/scripts/setup-rust.sh
          .github/scripts/setup-shellcheck.sh

      - name: Check gate selection and test guards
        run: make gate-selftest

      - name: Check the workflow artifact names
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            python=python3
          else
            python3 -m venv "${RUNNER_TEMP}/yaml-venv"
            "${RUNNER_TEMP}/yaml-venv/bin/pip" install --quiet pyyaml==6.0.2
            python="${RUNNER_TEMP}/yaml-venv/bin/python"
          fi
          "${python}" .github/scripts/check-artifact-names.py

      - name: Check the live node backstop
        run: |
          shellcheck .github/scripts/host-runtime-service.sh .github/scripts/setup-rust-build-cache.sh \
            .github/scripts/setup-shellcheck.sh .github/scripts/setup-ruff.sh .github/scripts/install-browser-deps.sh
          python3 .github/scripts/test-host-runtime-service.py

      - name: Check Harbor runner syntax
        run: |
          bash -n scripts/harbor/run_gents.sh
          bash -n scripts/measure-gents-binary.sh
          bash -n scripts/measure-gents-build-attribution.sh
          bash -n .github/scripts/desktop-runtime-journey.sh
          bash -n .github/scripts/setup-macos-rust-toolchain.sh .github/scripts/setup-cmake.sh
          shellcheck -s sh scripts/harbor/run_gents.sh
          shellcheck scripts/measure-gents-binary.sh
          shellcheck scripts/measure-gents-build-attribution.sh
          shellcheck .github/scripts/desktop-runtime-journey.sh
          shellcheck .github/scripts/setup-macos-rust-toolchain.sh .github/scripts/setup-cmake.sh

      - name: Check the macOS toolchain selection
        run: python3 .github/scripts/test-macos-rust-toolchain.py

      - name: Check isolated runtime runner validation
        run: python3 .github/scripts/test-isolated-runtime-runner.py

      - name: Run Harbor runner self-test
        run: scripts/harbor/run_gents.sh self-test

      - name: Run build attribution parser self-test
        run: scripts/measure-gents-build-attribution.sh self-test

      - name: Report jobs a fork pull request skips
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || 'a deleted repository' }}
        run: |
          message="This pull request comes from ${HEAD_REPOSITORY}, so jobs that run on self-hosted runners (lint, lint-variants, contract, test, build, shard, desktop-ui-bombadil, core-packs build, adapter-interop) are skipped and gate fails if the plan selected one; the other jobs run on GitHub-hosted runners. A maintainer reruns the change from a branch of this repository to test it on the self-hosted runners."
          echo "::notice title=Self-hosted jobs skipped for a fork::${message}"
          printf '### Self-hosted jobs skipped for a fork\n\n%s\n' "${message}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check runner build-space reclamation
        run: python3 .github/scripts/test-rust-build-space.py

      - name: Check the runner-local Lean cache link
        run: |
          shellcheck .github/scripts/setup-lean-build-cache.sh
          python3 .github/scripts/test-setup-lean-build-cache.py

      # A merge once dropped gate.py's `import shutil`; only the cache path,
      # which no pull request ran, reached the missing name.
      - name: Install ruff
        run: .github/scripts/setup-ruff.sh

      - name: Check the CI scripts for undefined names
        run: ruff check --no-cache --select F821,F822,F823 scripts/ci .github/scripts scripts/evals

      - name: Run Harbor agent adapter tests
        run: python3 scripts/harbor/test_gents_agent.py

      - name: Check the eval ladder and live Engineer eval drivers
        run: |
          bash -n scripts/evals/run-ladder.sh
          python3 scripts/evals/test_suites.py
          python3 scripts/evals/test_ladder_batch.py
          python3 scripts/evals/test_live_engineer_eval.py
          bash -n scripts/evals/run-container.sh scripts/evals/container/entrypoint.sh
          shellcheck scripts/evals/run-container.sh scripts/evals/container/entrypoint.sh
          python3 scripts/evals/container/test_relay.py
          python3 scripts/evals/container/test_orchestrate.py

      - name: Check compiler-tool download recovery
        run: |
          bash -n .github/scripts/setup-afterburner-toolchains.sh
          shellcheck .github/scripts/setup-afterburner-toolchains.sh
          python3 .github/scripts/test-afterburner-downloads.py

  publish-control-tests:
    # Focused, network-free tests for the staged-prerelease publication
    # control script (fake gh). No secrets; read-only token.
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run publication control tests
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            python=python3
          else
            python3 -m venv "${RUNNER_TEMP}/yaml-venv"
            "${RUNNER_TEMP}/yaml-venv/bin/pip" install --quiet pyyaml==6.0.2
            python="${RUNNER_TEMP}/yaml-venv/bin/python"
          fi
          "${python}" .github/scripts/test-publish-staged-prerelease.py

  fmt:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'fmt')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 10
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: .github/scripts/setup-rust.sh
      - name: Check formatting
        run: make gate-run JOB=fmt

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: fmt

  # The product build without test features, then clippy over every target of
  # the changed crates and their dependents. It and lint-variants run side by
  # side on the portable runners, within their role's compile parallelism.
  lint:
    needs: plan
    # Fork pull requests never run on a self-hosted runner: its account shares
    # the Cargo home, the compiler cache and the kept target trees with every
    # other runner on the host (test-rust-build-space.py checks every job).
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'lint')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.portable }}
    timeout-minutes: 90
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      CARGO_BUILD_JOBS: ${{ fromJSON(needs.plan.outputs.plan).build_jobs.portable || vars.CARGO_BUILD_JOBS || '12' }}
    steps:
      # actions/checkout runs `git submodule` about ten times per job (status,
      # then foreach to set and remove credentials, again in its post step). On
      # some Studio runner processes every command that the Xcode bundle's
      # git-submodule shell script spawns stalls about 6 s, so each call takes
      # about 100 s: 12 minutes in the step and 5 more in its post step. The
      # repository has no submodules, so a self-hosted macOS runner fetches and
      # checks out the commit with plain git, the same depth-1 fetch, forced
      # checkout and `git clean -ffdx` as actions/checkout, and persists no
      # credentials. Every other runner keeps actions/checkout.
      - &checkout-self-hosted-macos
        name: Check out the commit with plain git
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        env:
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          git config --local remote.origin.url "https://github.com/${CHECKOUT_REPOSITORY}"
          git config --local gc.auto 0
          # The token reaches git through its environment: never argv or .git/config.
          basic="$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${basic}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}" \
            git -c protocol.version=2 fetch --no-tags --no-recurse-submodules --depth=1 \
            origin "+${CHECKOUT_SHA}:refs/remotes/origin/ci-checkout"
          git checkout --quiet --force --detach "${CHECKOUT_SHA}"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "${CHECKOUT_SHA}"

      - &checkout-elsewhere
        if: runner.os != 'macOS' || runner.environment != 'self-hosted'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      - uses: ./.github/actions/rust-runner
        with:
          role: portable

      - name: Install cargo-hakari
        run: .github/scripts/setup-hakari.sh

      - name: Check the product build and clippy
        run: make gate-run JOB=lint

      - name: Record Rust dependency graph metrics
        env:
          MEASURE_MODE: graph
          OUTPUT_JSON: ${{ runner.temp }}/gents-build-graph-${{ github.sha }}.json
        run: |
          scripts/measure-gents-binary.sh
          jq -e '
            .schema_version == 2
            and .dependencies.root_package == "gents-cli"
            and .dependencies.target == .target_triple
            and .dependencies.normal_packages > 0
            and .dependencies.all_target_normal_packages >= .dependencies.normal_packages
            and (.dependencies.duplicate_packages | length) == .dependencies.duplicate_package_names
          ' "${OUTPUT_JSON}" >/dev/null

      - name: Upload Rust dependency graph metrics
        uses: actions/upload-artifact@v7
        with:
          name: gents-build-graph-${{ github.sha }}
          path: ${{ runner.temp }}/gents-build-graph-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: lint

  # The builds beside the product's: clippy over the live suites in their own
  # incremental tree, the CLI's Vera feature, gents-loop for WASI and the
  # desktop app's native-e2e capability check, for the crates the change reaches.
  lint-variants:
    needs: plan
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'lint-variants')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.portable }}
    timeout-minutes: 90
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      CARGO_BUILD_JOBS: ${{ fromJSON(needs.plan.outputs.plan).build_jobs.portable || vars.CARGO_BUILD_JOBS || '12' }}
    steps:
      - *checkout-self-hosted-macos
      - *checkout-elsewhere

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      - uses: ./.github/actions/rust-runner
        with:
          role: portable

      - name: Check the live suites, the Vera and WASI builds and the desktop capabilities
        run: make gate-run JOB=lint-variants

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: lint-variants

  # Proofs, the files generated from them, the one-consumer-per-family scan
  # and, when the foundation group does not run them, the structure ratchets.
  contract:
    needs: plan
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'contract')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.portable }}
    timeout-minutes: 90
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      CARGO_BUILD_JOBS: ${{ fromJSON(needs.plan.outputs.plan).build_jobs.portable || vars.CARGO_BUILD_JOBS || '12' }}
      RUST_TEST_THREADS: "8"
      PROFILE: ci-native
      TLA_JOBS: "2"
      TLA_HEAP: "2g"
    steps:
      - *checkout-self-hosted-macos
      - *checkout-elsewhere

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      - uses: ./.github/actions/rust-runner
        with:
          lean: "true"
          role: portable

      - uses: actions/setup-node@v7
        if: fromJSON(needs.plan.outputs.plan).contract.ts_lean
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        if: fromJSON(needs.plan.outputs.plan).contract.ts_lean
        run: npm ci

      - name: Check proofs, generated files and structure
        run: make gate-run JOB=contract

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: contract

  # One job per group of crates that holds a changed crate or a dependent.
  # Each job starts from an empty RUNNER_TEMP target tree; the host sccache
  # service supplies cached rlibs, so parallel jobs share compilation. A role's
  # `jobs` in .github/ci-runners.json bound the job's compile and test parallelism.
  test:
    name: ${{ matrix.job }}
    needs: plan
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.plan.outputs.tests == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      CARGO_BUILD_JOBS: ${{ matrix.build_jobs || vars.CARGO_BUILD_JOBS || '12' }}
      RUST_TEST_THREADS: ${{ matrix.test_threads || vars.RUST_TEST_THREADS || vars.CARGO_BUILD_JOBS || '12' }}
      PROFILE: ${{ (matrix.job == 'test:native' || matrix.job == 'test:macos-only') && 'ci-native' || '' }}
    steps:
      - *checkout-self-hosted-macos
      - *checkout-elsewhere

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      # Enable only after provisioning a separate OS account and runner. The
      # configured path must be the running fleet node's actual gents home.
      - name: Verify isolated runtime runner
        if: matrix.role == 'runtime-isolated'
        env:
          GENTS_CI_FLEET_HOME: ${{ vars.GENTS_CI_FLEET_HOME }}
          GENTS_CI_FLEET_USER: ${{ vars.GENTS_CI_FLEET_USER }}
        run: |
          python3 .github/scripts/check-isolated-runtime-runner.py
          echo "LEAN_CACHE_ROOT=$HOME/.cache/gents-lean" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"

      - name: Compile native tests directly with the runner's Cargo target cache
        if: matrix.job == 'test:native' && runner.os == 'macOS'
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - uses: ./.github/actions/rust-runner
        with:
          lean: "true"
          afterburner: ${{ matrix.go }}
          role: ${{ matrix.role }}

      # The native group's jobs run their tests under nextest.
      - name: Install cargo-nextest
        if: matrix.group == 'native'
        run: .github/scripts/setup-nextest.sh

      - name: Run ${{ matrix.job }}
        run: make gate-run JOB="${{ matrix.job }}"

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: ${{ matrix.unit }}

  # With GATE_PORTABLE_SHARDS set, the portable groups' crates compile once
  # here. With one slice it runs here, as the role's hash partitions, straight
  # from the build; with more they go into a nextest archive and `shard` runs
  # slices of it, compiling nothing.
  build:
    name: build (${{ matrix.archive }}${{ matrix.partition && format(' {0}/{1}', matrix.partition, matrix.partitions) || '' }})
    needs: plan
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'build:portable')
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.archives) }}
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      CARGO_BUILD_JOBS: ${{ matrix.build_jobs || vars.CARGO_BUILD_JOBS || '12' }}
      RUST_TEST_THREADS: ${{ matrix.test_threads || vars.RUST_TEST_THREADS || vars.CARGO_BUILD_JOBS || '12' }}
    steps:
      - *checkout-self-hosted-macos
      - *checkout-elsewhere

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      # A single slice and the Vera feature tests run in this job, and the
      # Lean-backed ones need the built contract: without it 12 waited out
      # 600 s behind the proofs lock (dispatch 43780116459).
      # The contract builds beside the Rust compile instead (gate.py run_build):
      # it took 2.5 to 10 minutes before the compile started (PR #3926's runs).
      - uses: ./.github/actions/rust-runner
        with:
          role: portable
          lean: ${{ (matrix.run || matrix.vera) && 'true' || 'false' }}
          lean-contract: deferred
          afterburner: ${{ matrix.run && matrix.go && 'true' || 'false' }}

      - name: Install cargo-nextest
        run: .github/scripts/setup-nextest.sh

      - name: Build the ${{ matrix.archive }} tests
        run: make gate-run JOB="build:${{ matrix.archive }}${{ matrix.partition && format(':{0}', matrix.partition) || '' }}"

      - name: Upload the ${{ matrix.archive }} test archive
        if: ${{ !matrix.run }}
        uses: actions/upload-artifact@v7
        with:
          name: gents-tests-${{ matrix.archive }}
          path: ${{ runner.temp }}/gents-tests
          if-no-files-found: error
          compression-level: 0
          # Re-running failed slices needs the run's archive; a rebuilt one replaces it.
          overwrite: true
          retention-days: 1

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: ${{ matrix.unit }}

  shard:
    name: test (${{ matrix.archive }} ${{ matrix.index }}/${{ matrix.count }})
    needs: [plan, build]
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'shard:portable')
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      CARGO_BUILD_JOBS: ${{ matrix.build_jobs || vars.CARGO_BUILD_JOBS || '12' }}
      RUST_TEST_THREADS: ${{ matrix.test_threads || vars.RUST_TEST_THREADS || vars.CARGO_BUILD_JOBS || '12' }}
    steps:
      - *checkout-self-hosted-macos
      - *checkout-elsewhere

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      - uses: ./.github/actions/rust-runner
        with:
          lean: "true"
          afterburner: ${{ matrix.go && 'true' || 'false' }}

      - name: Install cargo-nextest
        run: .github/scripts/setup-nextest.sh

      - name: Download the ${{ matrix.archive }} test archive
        uses: actions/download-artifact@v7
        with:
          name: gents-tests-${{ matrix.archive }}
          path: ${{ runner.temp }}/gents-tests

      - name: Run slice ${{ matrix.index }} of ${{ matrix.count }}
        run: make gate-run JOB="shard:${{ matrix.archive }}:${{ matrix.index }}"

      - name: Upload the slice's JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gents-junit-${{ matrix.archive }}-${{ matrix.index }}-of-${{ matrix.count }}-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

  desktop-packages:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'ts-packages')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 15
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Check, build, test and pack the desktop packages
        run: make gate-run JOB=ts-packages

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: ts-packages

  desktop-ui:
    needs: plan
    if: >-
      contains(fromJSON(needs.plan.outputs.jobs), 'ts-unit') ||
      contains(fromJSON(needs.plan.outputs.jobs), 'ts-browser')
    # This job exercises browser-only code. Keep scarce macOS capacity for the
    # Rust/Lean work that benefits from persistent host caches.
    name: desktop-ui (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.browser }}
    # The unit suite and the browser shards (gate.py BROWSER_SHARDS) the
    # plan did not reuse. The job allows a cold browser install (30) plus the
    # suite (25).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.desktop_ui) }}
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      DESKTOP_UI_E2E_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      # A hosted runner is a fresh machine: install the browsers' system
      # libraries as root. A self-hosted browser runner has them installed
      # once by its operator (`npx playwright install-deps chromium webkit`)
      # and keeps the browsers in its account's cache. On a hosted runner the
      # apt download alone took 27 minutes from a slow Ubuntu mirror (run
      # 44319819879), so the packages and the browsers are cached, keyed by
      # the runner image, the Playwright version and the browsers a lane needs.
      - name: Select the browsers and their cache key
        id: browsers
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          if [[ "${SUITE}" == browser ]]; then browsers="chromium webkit"; else browsers="chromium"; fi
          version="$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)"
          echo "list=${browsers}" >> "${GITHUB_OUTPUT}"
          echo "key=${ImageOS:-self}-${ImageVersion:-self}-playwright-${version}-${browsers// /-}" >> "${GITHUB_OUTPUT}"

      - name: Restore the browser packages and browsers
        id: browser-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v5.0.5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-browser-archives
          key: browsers-${{ steps.browsers.outputs.key }}

      - name: Use the Ubuntu archive for browser system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path

          for path in Path('/etc/apt').rglob('*'):
              if not path.is_file():
                  continue
              if path.suffix not in {'.sources', '.list'} and path.name != 'apt-mirrors.txt':
                  continue
              original = path.read_text(encoding='utf-8')
              updated = original
              for scheme in ('http', 'https'):
                  updated = updated.replace(
                      f'{scheme}://azure.archive.ubuntu.com/ubuntu',
                      'https://archive.ubuntu.com/ubuntu',
                  )
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  print(f'Using the Ubuntu archive in {path}')
          PYTHON
          # Downloaded packages go to the cached directory, and a stalled
          # mirror fails a request instead of holding the step.
          mkdir -p "${HOME}/.cache/apt-browser-archives/partial"
          printf '%s\n' \
            "Dir::Cache::Archives \"${HOME}/.cache/apt-browser-archives\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/90browser-dependencies >/dev/null

      # The unit lane's interaction budgets drive Chromium; the journeys
      # also need WebKit. Its own timeout keeps a slow install from spending
      # the suite's time; the system packages download in parallel
      # (install-browser-deps.sh), and a warm cache takes about a minute.
      - name: Install Playwright browsers
        working-directory: apps/gents-desktop
        timeout-minutes: 30
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          BROWSERS: ${{ steps.browsers.outputs.list }}
        run: |
          read -ra browsers <<< "${BROWSERS}"
          if [[ "${HOSTED}" == true ]]; then
            ../../.github/scripts/install-browser-deps.sh "${HOME}/.cache/apt-browser-archives" "${browsers[@]}"
            # The cache saves as this user; apt may have written as root.
            sudo chown -R "$(id -u):$(id -g)" "${HOME}/.cache/apt-browser-archives"
          fi
          npx playwright install "${browsers[@]}"

      # Saved as soon as the install ends, even when it or a later step fails,
      # so one runner's cold download warms the next run's.
      - name: Save the browser packages and browsers
        if: >-
          always() && runner.environment == 'github-hosted' &&
          steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-browser-archives
          key: browsers-${{ steps.browsers.outputs.key }}

      - name: Run the desktop ${{ matrix.suite }} suite
        timeout-minutes: 25
        run: make gate-run JOB="ts-${{ matrix.suite }}"

      - name: Upload desktop UI artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-artifacts-${{ matrix.suite }}-${{ strategy.job-index }}
          if-no-files-found: ignore
          path: |
            apps/gents-desktop/test-results
            apps/gents-desktop/playwright-report
            apps/gents-desktop/playwright-screenshots-report

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: ${{ matrix.unit }}

  desktop-ui-bombadil:
    needs: plan
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.plan.outputs.jobs), 'ts-fuzz')
    # Bombadil's exact Linux failure trace passes on macOS, so this smoke
    # stays on macOS while the portable UI suite runs on Linux.
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.macos }}
    # A runner's first checkout is a full clone; the smoke itself keeps its
    # 10-minute bound on its own step.
    timeout-minutes: 30
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - *checkout-self-hosted-macos
      - *checkout-elsewhere

      - name: Record the host's live Gents node
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh record

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/gents-desktop
        run: npx playwright install chromium

      - name: Run desktop Bombadil smoke
        timeout-minutes: 10
        run: make gate-run JOB=ts-fuzz

      # Bombadil has no --seed; the recorded trace is the only exact-replay
      # handle. Upload it on success too so a failing run can be bisected
      # against a known-good trace (npm run test:ui:fuzz -- --reproduce <dir>).
      - name: Upload Bombadil trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-bombadil-trace
          if-no-files-found: ignore
          retention-days: 30
          path: apps/gents-desktop/test-results/bombadil

      # Read-only; fails the job when one of its steps stopped the host's live node.
      - name: Check the host's live Gents node is still running
        if: always() && runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: .github/scripts/host-runtime-service.sh verify

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: ts-fuzz

  triage-hygiene:
    # The issue-triage bot holds `issues: write` and runs on a daily cron. These
    # tests are the only fence on its decision function, so every pull request
    # must run them.
    needs: plan
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.linux }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The triage scripts import `node:` built-ins only, so this job needs no
      # `npm ci` and therefore no npm cache.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run triage-hygiene tests
        run: npm run test:triage

  notary-control-tests:
    # Focused, network-free tests for the staged-artifact notarization control
    # scripts. They need real macOS ditto/shasum and no secrets; run when
    # notarization or release-signing scripts change.
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'notary-control')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.macos }}
    timeout-minutes: 20
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - *checkout-self-hosted-macos
      - *checkout-elsewhere

      - name: Run notarization control tests
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' 2>/dev/null; then
            python=python3
          else
            python3 -m venv "${RUNNER_TEMP}/yaml-venv"
            "${RUNNER_TEMP}/yaml-venv/bin/pip" install --quiet pyyaml==6.0.2
            python="${RUNNER_TEMP}/yaml-venv/bin/python"
          fi
          bash -n .github/scripts/notarize-staged-artifact.sh
          "${python}" .github/scripts/test-notarize-staged-artifact.py
          "${python}" .github/scripts/test-rc1-notary-auth.py
          "${python}" .github/scripts/test-release-signing-mode.py

      - name: Record the pass
        if: success()
        uses: ./.github/actions/gate-record
        with:
          unit: notary-control

  # The one check to require: every job that runs on every event, and every
  # job the plan selected, succeeded. A skip passes only for a job the plan
  # left out (scripts/ci/gate.py verdict).
  gate:
    if: always()
    needs:
      - plan
      - repository-guard
      - fmt
      - lint
      - lint-variants
      - contract
      - test
      - build
      - shard
      - desktop-packages
      - desktop-ui
      - desktop-ui-bombadil
      - publish-control-tests
      - triage-hygiene
      - notary-control-tests
    # A failed plan has no runs_on; the verdict still reports it.
    runs-on: >-
      ${{ needs.plan.outputs.plan && fromJSON(needs.plan.outputs.plan).runs_on.linux ||
      'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            crates/gents/proofs/tla/scripts

      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
          GATE_FORK: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name != github.repository }}
        run: python3 scripts/ci/gate.py verdict
