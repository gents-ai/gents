name: CI

# The pull request gate. `plan` maps the change to the crates it touches and
# their reverse dependents and selects jobs; every job runs a `make gate-run`
# recipe, so `make gate` runs the same commands locally. A draft is linted
# across the changed crates and their dependents and tested on the crates it
# changes; a pull request that is ready for review also tests the dependents;
# a push to main selects everything.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      full_candidate:
        description: Run the whole gate on the dispatched commit.
        required: true
        type: boolean
        default: true
      candidate_sha:
        description: Exact 40-character commit SHA expected at the dispatched ref.
        required: true
        type: string
      only:
        description: Space-separated gate jobs for a focused rerun (lint, contract, test:cli, ts-unit, ...); empty runs all.
        required: false
        type: string
        default: ""
      portable_runner:
        description: JSON runner label list for the portable test groups on this run only; empty uses GENTS_CI_PORTABLE_RUNNER.
        required: false
        type: string
        default: ""

# A run in progress finishes; GitHub keeps only the newest waiting run per
# group, so a branch that is pushed every few minutes still gets results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Each 32-core Studio runs at most two gents jobs concurrently. Keep eight
  # cores free for the OS and other host services.
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS || '12' }}
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  LEAN_CACHE_ROOT: ${{ vars.LEAN_CACHE_ROOT || '/Users/admin/.cache/gents-lean' }}
  RUSTC_WRAPPER: sccache
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: ${{ vars.RUST_TEST_THREADS || vars.CARGO_BUILD_JOBS || '12' }}
  SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_CACHE_SIZE || '120G' }}
  # The host service and clients normalize every registered checkout root.
  SCCACHE_BASEDIRS: ${{ vars.SCCACHE_BASEDIRS }}
  SCCACHE_DIR: ${{ vars.SCCACHE_DIR || '/Users/admin/.cache/sccache' }}
  # Compile locally instead of failing the job if the host server drops a request.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List the files the pull request changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "${RUNNER_TEMP}/changed-files.txt"
          count="$(wc -l < "${RUNNER_TEMP}/changed-files.txt")"
          echo "The pull request changes ${count} paths."
          # The API lists at most 3000 files; a larger change selects everything.
          if (( count == 0 || count >= 3000 )); then
            echo "GATE_EVERYTHING=true" >> "$GITHUB_ENV"
          fi

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Select gate jobs
        id: plan
        env:
          GATE_EVERYTHING: ${{ github.event_name != 'pull_request' && 'true' || env.GATE_EVERYTHING }}
          GATE_ONLY: ${{ inputs.only }}
          GATE_PORTABLE_RUNNER: ${{ inputs.portable_runner || vars.GENTS_CI_PORTABLE_RUNNER }}
          GATE_RUNTIME_ISOLATED: ${{ vars.GENTS_CI_RUNTIME_ISOLATED }}
          # Inside a stack only the top is tested in full: lower layers may be
          # intentionally red. A pull request into the default branch always is.
          GATE_TIER: >-
            ${{ (github.event_name != 'pull_request' ||
            (github.event.pull_request.draft == false &&
            (github.event.pull_request.base.ref == github.event.repository.default_branch ||
            github.event.pull_request.stack == null ||
            github.event.pull_request.stack.position == github.event.pull_request.stack.size)))
            && 'full' || 'draft' }}
        run: python3 scripts/ci/gate.py plan --files "${RUNNER_TEMP}/changed-files.txt"

  repository-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify immutable full-candidate dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FULL_CANDIDATE: ${{ inputs.full_candidate }}
        run: |
          set -euo pipefail
          if [[ "${FULL_CANDIDATE}" != "true" ]]; then
            echo "::error::Manual CI dispatches must select full_candidate."
            exit 1
          fi
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ "${CANDIDATE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "::error::candidate_sha ${CANDIDATE_SHA} does not match checked-out GITHUB_SHA ${GITHUB_SHA}."
            exit 1
          fi

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Check gate selection and test guards
        run: |
          rustup toolchain install --no-self-update
          make gate-selftest

      - name: Check Harbor runner syntax
        run: |
          bash -n scripts/harbor/run_gents.sh
          bash -n scripts/measure-gents-binary.sh
          bash -n scripts/measure-gents-build-attribution.sh
          bash -n .github/scripts/desktop-runtime-journey.sh
          bash -n .github/scripts/setup-macos-rust-toolchain.sh .github/scripts/setup-cmake.sh
          shellcheck -s sh scripts/harbor/run_gents.sh
          shellcheck scripts/measure-gents-binary.sh
          shellcheck scripts/measure-gents-build-attribution.sh
          shellcheck .github/scripts/desktop-runtime-journey.sh
          shellcheck .github/scripts/setup-macos-rust-toolchain.sh .github/scripts/setup-cmake.sh

      - name: Check the macOS toolchain selection
        run: python3 .github/scripts/test-macos-rust-toolchain.py

      - name: Check isolated runtime runner validation
        run: python3 .github/scripts/test-isolated-runtime-runner.py

      - name: Run Harbor runner self-test
        run: scripts/harbor/run_gents.sh self-test

      - name: Run build attribution parser self-test
        run: scripts/measure-gents-build-attribution.sh self-test

      - name: Check runner build-space reclamation
        run: python3 .github/scripts/test-rust-build-space.py

      - name: Run Harbor agent adapter tests
        run: python3 scripts/harbor/test_gents_agent.py

      - name: Check compiler-tool download recovery
        run: |
          bash -n .github/scripts/setup-afterburner-toolchains.sh
          shellcheck .github/scripts/setup-afterburner-toolchains.sh
          python3 .github/scripts/test-afterburner-downloads.py

  publish-control-tests:
    # Focused, network-free tests for the staged-prerelease publication
    # control script (fake gh). No secrets; read-only token.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run publication control tests
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/publish-venv"
          "${RUNNER_TEMP}/publish-venv/bin/pip" install --quiet pyyaml==6.0.2
          "${RUNNER_TEMP}/publish-venv/bin/python" .github/scripts/test-publish-staged-prerelease.py

  fmt:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'fmt')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Check formatting
        run: make gate-run JOB=fmt

  # The product build without test features, then clippy over every target of
  # the changed crates and their dependents.
  lint:
    needs: [plan, repository-guard]
    if: contains(fromJSON(needs.plan.outputs.jobs), 'lint')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.studio }}
    timeout-minutes: 90
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-runner

      - name: Check the product build and clippy
        run: make gate-run JOB=lint

      - name: Record Rust dependency graph metrics
        env:
          MEASURE_MODE: graph
          OUTPUT_JSON: ${{ runner.temp }}/gents-build-graph-${{ github.sha }}.json
        run: |
          scripts/measure-gents-binary.sh
          jq -e '
            .schema_version == 2
            and .dependencies.root_package == "gents-cli"
            and .dependencies.target == .target_triple
            and .dependencies.normal_packages > 0
            and .dependencies.all_target_normal_packages >= .dependencies.normal_packages
            and (.dependencies.duplicate_packages | length) == .dependencies.duplicate_package_names
          ' "${OUTPUT_JSON}" >/dev/null

      - name: Upload Rust dependency graph metrics
        uses: actions/upload-artifact@v7
        with:
          name: gents-build-graph-${{ github.sha }}
          path: ${{ runner.temp }}/gents-build-graph-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

  # Proofs, the files generated from them, the one-consumer-per-family scan
  # and, when the runtime group does not run them, the structure ratchets.
  contract:
    needs: [plan, repository-guard]
    if: contains(fromJSON(needs.plan.outputs.jobs), 'contract')
    runs-on: ${{ fromJSON(needs.plan.outputs.plan).runs_on.studio }}
    timeout-minutes: 90
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-runner
        with:
          lean: "true"

      - uses: actions/setup-node@v7
        if: fromJSON(needs.plan.outputs.plan).contract.ts_lean
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install workspace frontend dependencies
        if: fromJSON(needs.plan.outputs.plan).contract.ts_lean
        run: npm ci

      - name: Check proofs, generated files and structure
        run: make gate-run JOB=contract

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

  # One job per group of crates that holds a changed crate or a dependent.
  # Each job starts from an empty RUNNER_TEMP target tree; the host sccache
  # service supplies cached rlibs, so parallel jobs share compilation.
  test:
    name: test (${{ matrix.group }})
    needs: [plan, repository-guard]
    if: needs.plan.outputs.tests == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Enable only after provisioning a separate OS account and runner. The
      # configured path must be the running fleet node's actual gents home.
      - name: Verify isolated runtime runner
        if: matrix.group == 'runtime' && vars.GENTS_CI_RUNTIME_ISOLATED == 'true'
        env:
          GENTS_CI_FLEET_HOME: ${{ vars.GENTS_CI_FLEET_HOME }}
          GENTS_CI_FLEET_USER: ${{ vars.GENTS_CI_FLEET_USER }}
        run: |
          python3 .github/scripts/check-isolated-runtime-runner.py
          echo "LEAN_CACHE_ROOT=$HOME/.cache/gents-lean" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"

      - uses: ./.github/actions/rust-runner
        with:
          lean: "true"
          afterburner: ${{ matrix.go }}

      - name: Run tests for ${{ matrix.packages }}
        run: make gate-run JOB="test:${{ matrix.group }}"

      - name: Collect migration lens diagnostics on failure
        if: failure() && matrix.group == 'foundation'
        run: python3 .github/scripts/collect-migration-lens-diagnostics.py "${RUNNER_TEMP}/gents-migration-lenses"

      - name: Upload migration lens diagnostics
        if: failure() && matrix.group == 'foundation'
        uses: actions/upload-artifact@v7
        with:
          name: gents-migration-lenses-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gents-migration-lenses
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

  desktop-packages:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'ts-packages')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Check, build, test and pack the desktop packages
        run: make gate-run JOB=ts-packages

  desktop-ui:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'ts-unit')
    # This job exercises browser-only code. Keep scarce macOS capacity for the
    # Rust/Lean work that benefits from persistent host caches.
    name: desktop-ui (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, browser]
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Use the Ubuntu archive for browser system dependencies
        if: matrix.suite == 'browser'
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path

          for path in Path('/etc/apt').rglob('*'):
              if not path.is_file():
                  continue
              if path.suffix not in {'.sources', '.list'} and path.name != 'apt-mirrors.txt':
                  continue
              original = path.read_text(encoding='utf-8')
              updated = original
              for scheme in ('http', 'https'):
                  updated = updated.replace(
                      f'{scheme}://azure.archive.ubuntu.com/ubuntu',
                      'https://archive.ubuntu.com/ubuntu',
                  )
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  print(f'Using the Ubuntu archive in {path}')
          PYTHON

      - name: Install Playwright browsers
        if: matrix.suite == 'browser'
        working-directory: apps/gents-desktop
        run: npx playwright install --with-deps chromium webkit

      - name: Run the desktop ${{ matrix.suite }} suite
        run: make gate-run JOB="ts-${{ matrix.suite }}"

      - name: Upload desktop UI artifacts
        if: failure() && matrix.suite == 'browser'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-artifacts
          if-no-files-found: ignore
          path: |
            apps/gents-desktop/test-results
            apps/gents-desktop/playwright-report
            apps/gents-desktop/playwright-screenshots-report

  desktop-ui-bombadil:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'ts-fuzz')
    # Bombadil's exact Linux failure trace passes on macOS, so this smoke
    # stays on a Studio while the portable UI suite runs on hosted Linux.
    runs-on: [self-hosted, macOS, ARM64, studio, studio-2, ci-cli]
    timeout-minutes: 10
    env:
      GATE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install workspace frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/gents-desktop
        run: npx playwright install chromium

      - name: Run desktop Bombadil smoke
        run: make gate-run JOB=ts-fuzz

      # Bombadil has no --seed; the recorded trace is the only exact-replay
      # handle. Upload it on success too so a failing run can be bisected
      # against a known-good trace (npm run test:ui:fuzz -- --reproduce <dir>).
      - name: Upload Bombadil trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-ui-bombadil-trace
          if-no-files-found: ignore
          retention-days: 30
          path: apps/gents-desktop/test-results/bombadil

  triage-hygiene:
    # The issue-triage bot holds `issues: write` and runs on a daily cron. These
    # tests are the only fence on its decision function, so every pull request
    # must run them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The triage scripts import `node:` built-ins only, so this job needs no
      # `npm ci` and therefore no npm cache.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run triage-hygiene tests
        run: npm run test:triage

  notary-control-tests:
    # Focused, network-free tests for the staged-artifact notarization control
    # scripts. They need real macOS ditto/shasum, so they run on a hosted
    # macOS runner with no secrets. Draft PRs run them too.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run notarization control tests
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/notary-venv"
          "${RUNNER_TEMP}/notary-venv/bin/pip" install --quiet pyyaml==6.0.2
          bash -n .github/scripts/notarize-staged-artifact.sh
          "${RUNNER_TEMP}/notary-venv/bin/python" .github/scripts/test-notarize-staged-artifact.py
          "${RUNNER_TEMP}/notary-venv/bin/python" .github/scripts/test-rc1-notary-auth.py
          "${RUNNER_TEMP}/notary-venv/bin/python" .github/scripts/test-release-signing-mode.py

  # The one check to require: every job the plan selected succeeded.
  gate:
    if: always()
    needs:
      - plan
      - repository-guard
      - fmt
      - lint
      - contract
      - test
      - desktop-packages
      - desktop-ui
      - desktop-ui-bombadil
      - publish-control-tests
      - triage-hygiene
      - notary-control-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          bad = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          for name, result in sorted(bad.items()):
              print(f"::error::{name}: {result}")
          sys.exit(1 if bad else 0)
          PYTHON
