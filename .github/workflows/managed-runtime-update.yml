name: Managed runtime update

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/managed-runtime-update.yml'
      - '.github/scripts/test-managed-self-update.py'
      - 'crates/gents-cli/src/service_update*'
      - 'crates/gents-cli/src/native_service*'
      - 'crates/gents-cli/src/native_service/**'
      - 'crates/gents-cli/src/cli/args.rs'
      - 'crates/gents-cli/src/lib.rs'
      - 'crates/gents-cli/src/commands/prepare_runtime*'
      - 'crates/gents-cli/src/http/runtime_control.rs'
      - 'crates/gents/src/runtime_service.rs'
      - 'crates/gents/src/agent/runtime/startup.rs'
      - 'crates/gents-desktop-bridge/**'
      - 'crates/gents/src/tool_call_lifecycle/**'
      - 'crates/gents/src/mailbox/**'
      - 'crates/gents/src/agent.rs'
      - 'crates/gents-cli/src/commands/serve.rs'
      - 'crates/gents-cli/src/network_settings.rs'
      - 'crates/gents-cli/src/home_state.rs'
      - 'crates/gents-protocol/src/serve_lifecycle/**'
      - 'crates/gents-cli/src/service_update/**'
      - 'crates/gents/src/home.rs'
      - 'crates/gents/src/toolset/shared/command.rs'
      - 'crates/gents/src/toolset/shared/command_credentials*'
      - 'crates/gents-migration/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: managed-runtime-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-handoff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '16777216'
      CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: /usr/bin/clang
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies and start the fixture user manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev libssl-dev pkg-config protobuf-compiler
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install repository Rust toolchain and fixture targets
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown wasm32-wasip1
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: managed-runtime-update
          cache-on-failure: "true"
          cache-workspace-crates: "false"
          cache-bin: "false"
      - name: Build isolated native-service executable
        run: cargo build --locked -p gents-cli --bin gents --features native-e2e --profile fast-dev
      - name: Exercise agent update and supervised recovery
        run: |
          python3 .github/scripts/test-managed-self-update.py --binary target/fast-dev/gents
          python3 .github/scripts/test-managed-self-update.py --binary target/fast-dev/gents --scenario backup-failure
          python3 .github/scripts/test-managed-self-update.py --binary target/fast-dev/gents --scenario busy-timeout
          python3 .github/scripts/test-managed-self-update.py --binary target/fast-dev/gents --scenario health-failure
          python3 .github/scripts/test-managed-self-update.py --binary target/fast-dev/gents --scenario config-health-failure
