name: Notarize staged signed macOS artifact (CI control)

# Notarizes an already Developer-ID-signed macOS .app that an operator staged
# as <inbox>/<sha256>.zip on the studio-1 runner host. No build, no re-signing,
# no release/tag write. Submission is duplicate-guarded against Apple's own
# submission history (deterministic name from the artifact SHA-256) and the
# submission id is recorded before any waiting; ambiguous outcomes are
# continued with mode=resume, never by submitting again. Dispatch is trusted
# only from the default branch of gents-ai/gents. See
# docs/notarize-staged-artifact.md.

on:
  workflow_dispatch:
    inputs:
      artifact_sha256:
        description: SHA-256 (lowercase hex) of the staged zip; file must be <inbox>/<sha256>.zip.
        required: true
        type: string
      mode:
        description: submit (new submission, duplicate-guarded) or resume (continue an existing submission id).
        required: true
        type: choice
        default: submit
        options:
          - submit
          - resume
      submission_id:
        description: Existing notary submission UUID (resume mode only; leave empty for submit).
        required: false
        type: string
        default: ""

concurrency:
  group: notarize-staged-artifact
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GENTS_REPO: gents-ai/gents
  NOTARY_INBOX_DIR: /Users/admin/gents-notary-inbox
  EXPECTED_TEAM_ID: NXJ753WW5X
  EXPECTED_BUNDLE_ID: com.source-inc.gents
  # SHA-256 of the existing "Developer ID Application: John Zampolin
  # (NXJ753WW5X)" leaf certificate (SHA-1 4855F05BB34BFB227F828F9856DA05D2D02E7D0F).
  EXPECTED_LEAF_CERT_SHA256: ffe161226e3ba89575fbb2fa4e0ffc2f7b0a7c99de8fc2f696a24fb8d74f1baf

jobs:
  notarize:
    name: Verify, notarize and staple staged artifact
    runs-on: [self-hosted, macOS, ARM64, studio, studio-1, ci-support]
    timeout-minutes: 150
    steps:
      # Runs BEFORE checkout so no untrusted ref executes repository code on
      # the self-hosted runner.
      - name: Job-level trusted context guard (pre-checkout)
        env:
          TRUSTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "::error::Only workflow_dispatch events are accepted."
            exit 1
          fi
          if [[ "${GITHUB_REPOSITORY}" != "${GENTS_REPO}" ]]; then
            echo "::error::Expected repository ${GENTS_REPO}, got ${GITHUB_REPOSITORY}."
            exit 1
          fi
          if [[ -z "${TRUSTED_DEFAULT_BRANCH}" ]]; then
            echo "::error::Default branch was empty; refusing to proceed."
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/${TRUSTED_DEFAULT_BRANCH}" ]]; then
            echo "::error::Only 'refs/heads/${TRUSTED_DEFAULT_BRANCH}' is trusted, got '${GITHUB_REF}'."
            exit 1
          fi
          if [[ -n "${GITHUB_HEAD_REF:-}" ]]; then
            echo "::error::Head ref '${GITHUB_HEAD_REF}' present; refusing."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (peeled commit)
        with:
          persist-credentials: false

      - name: Preflight runtime tools
        run: |
          set -euo pipefail
          for tool in python3 shasum ditto codesign xcrun spctl; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "::error::required tool '${tool}' not found on runner"
              exit 1
            }
          done
          bash -n .github/scripts/notarize-staged-artifact.sh

      - name: Verify, notarize and staple
        id: notarize
        env:
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          NOTARY_MODE: ${{ inputs.mode }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
          NOTARY_OUTPUT_DIR: ${{ runner.temp }}/notary-output
          MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
        run: bash .github/scripts/notarize-staged-artifact.sh

      # Always upload so the receipt (submission id) survives any later
      # failure. The credential directory is never under this path.
      - name: Upload receipt and notarized outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (peeled commit)
        with:
          name: notarize-staged-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notary-output
          if-no-files-found: warn
          retention-days: 30
