name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      inference_endpoint:
        description: OpenAI-compatible base URL, including /v1
        required: true
        default: http://workstation-1:8000/v1
      model_name:
        description: Model name served by the endpoint
        required: true
        default: MiniMax-M2.7-NVFP4

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  DEFRA_AGENT_CLI_E2E_MODEL_ENDPOINT: ${{ github.event.inputs.inference_endpoint }}
  DEFRA_AGENT_CLI_E2E_MODEL_NAME: ${{ github.event.inputs.model_name }}
  DEFRA_AGENT_CLI_E2E_API_KEY: ${{ secrets.AGENT_DAEMON_API_KEY }}
  AGENT_DAEMON_API_KEY: ${{ secrets.AGENT_DAEMON_API_KEY }}

jobs:
  live-cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite Git SSH dependencies to HTTPS
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git config --global url."https://${PRIVATE_REPO_PAT}@github.com/sourcenetwork/".insteadOf "ssh://git@github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run live CLI smoke test
        run: cargo test -p defra-agent-cli --test cli_e2e standard_onboarding_live_demo_runs_real_conversation_with_filesystem_tools -- --ignored --nocapture --test-threads=1
