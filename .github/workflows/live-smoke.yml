name: Live Smoke

on:
  workflow_dispatch:
    inputs:
      inference_endpoint:
        description: OpenAI-compatible base URL, including /v1
        required: true
        default: http://100.73.235.38:8000/v1
      model_name:
        description: Model name served by the endpoint
        required: true
        default: GLM-5.2

env:
  CARGO_BUILD_JOBS: ${{ vars.CARGO_BUILD_JOBS || '4' }}
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  RUSTC_WRAPPER: sccache
  RUST_BACKTRACE: "1"
  SCCACHE_CACHE_SIZE: ${{ vars.SCCACHE_CACHE_SIZE || '120G' }}
  SCCACHE_DIR: ${{ vars.SCCACHE_DIR || '/Users/admin/.cache/sccache' }}
  GENTS_CLI_E2E_MODEL_ENDPOINT: ${{ github.event.inputs.inference_endpoint }}
  GENTS_CLI_E2E_MODEL_NAME: ${{ github.event.inputs.model_name }}
  GENTS_CLI_E2E_API_KEY: ${{ secrets.GENTS_API_KEY }}
  GENTS_TAURI_LIVE_INFERENCE_URL: ${{ github.event.inputs.inference_endpoint }}
  GENTS_TAURI_LIVE_MODEL_NAME: ${{ github.event.inputs.model_name }}
  GENTS_TAURI_LIVE_API_KEY: ${{ secrets.GENTS_API_KEY }}
  GENTS_TAURI_LIVE_REQUIRE_REAL_INFERENCE: "1"

jobs:
  live-cli-smoke:
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Install protobuf compiler
        run: .github/scripts/setup-protoc.sh

      - name: Prepare disk-backed Rust build cache
        run: .github/scripts/setup-rust-build-cache.sh

      - name: Run live CLI smoke test
        run: cargo test -p gents-cli --test cli_live standard_onboarding_live_demo_runs_real_conversation_with_filesystem_tools -- --ignored --nocapture --test-threads=1

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

  desktop-live-smoke:
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install protobuf compiler
        run: .github/scripts/setup-protoc.sh

      - name: Prepare disk-backed Rust build cache
        run: .github/scripts/setup-rust-build-cache.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Run live desktop chat smoke
        working-directory: apps/gents-desktop
        run: npm run test:live:chat

      - name: Run live desktop config smoke
        working-directory: apps/gents-desktop
        run: npm run test:live:config

      - name: Run live desktop operations smoke
        working-directory: apps/gents-desktop
        run: npm run test:live:operations

      - name: Run live desktop interrupt smoke
        working-directory: apps/gents-desktop
        run: npm run test:live:interrupt

      - name: Run live desktop fleet smoke
        working-directory: apps/gents-desktop
        run: npm run test:live:fleet

      - name: Run live desktop replication smoke
        working-directory: apps/gents-desktop
        run: npm run test:live:replication

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh

  desktop-live-browser-smoke:
    runs-on: [self-hosted, macOS, ARM64, studio]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install protobuf compiler
        run: .github/scripts/setup-protoc.sh

      - name: Prepare disk-backed Rust build cache
        run: .github/scripts/setup-rust-build-cache.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/gents-desktop
        run: npx playwright install chromium

      - name: Run live desktop browser smoke
        working-directory: apps/gents-desktop
        run: npm run test:ui:live:e2e

      - name: Upload live desktop browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-live-browser-artifacts
          if-no-files-found: ignore
          path: |
            apps/gents-desktop/test-results/playwright-live
            apps/gents-desktop/playwright-live-report

      - name: Show Rust build cache stats
        if: always()
        run: .github/scripts/show-sccache-stats.sh
