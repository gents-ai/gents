name: Release desktop npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without the v prefix; must match the lockstep workspace version.
        required: true
        type: string
        default: "0.9.0"

permissions:
  contents: write

concurrency:
  group: release-desktop-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate lockstep release version and package boundaries
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          npm run check:package-boundaries
          workspace_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" == "v${workspace_version}" ]] || {
              echo "::error::Release tag ${GITHUB_REF_NAME} does not match v${workspace_version}."
              exit 1
            }
          elif [[ "${RELEASE_VERSION_INPUT}" != "${workspace_version}" ]]; then
            echo "::error::Requested ${RELEASE_VERSION_INPUT} does not match ${workspace_version}."
            exit 1
          fi

      - name: Build, test, pack, and clean-install every package
        run: |
          npm run build:packages
          npm run test:packages
          ./scripts/pack-desktop-packages.sh target/desktop-npm-release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gents-desktop-npm-${{ github.ref_name }}
          path: target/desktop-npm-release/*.tgz
          if-no-files-found: error

      - name: Attach package tarballs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "gents release artifacts." \
              || gh release view "${GITHUB_REF_NAME}" >/dev/null
          fi
          gh release upload \
            "${GITHUB_REF_NAME}" \
            target/desktop-npm-release/*.tgz \
            --clobber
