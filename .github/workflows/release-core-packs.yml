name: Release core packs

# Builds and tests the Engineer's core packs once per release tag and
# attaches the archives and their checksums to the GitHub release. The
# Linux, Linux desktop and macOS release legs download exactly these
# (.github/scripts/fetch-release-core-packs.sh), so every platform embeds
# identical archives with identical digests. A manual run builds the tag it
# is dispatched on (`--ref <tag>`).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-core-packs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  core-packs:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/core-packs.yml

  attach:
    name: Attach core packs to the GitHub release
    needs: core-packs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: core-packs
          path: core-packs

      - name: Attach
        run: |
          set -euo pipefail
          cd core-packs
          sha256sum -c SHA256SUMS-core-packs.txt
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --verify-tag \
              --title "${TAG}" \
              --notes "Installers and CLI archives are attached as they finish." \
              || gh release view "${TAG}" >/dev/null
          fi
          gh release upload "${TAG}" gents.*.pack SHA256SUMS-core-packs.txt --clobber
