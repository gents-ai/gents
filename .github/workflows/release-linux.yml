name: Release Linux defra-agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # The workspace release profile uses fat LTO + one codegen unit, which holds
  # the whole dependency graph in memory at link time and OOM-kills the
  # self-hosted Linux runners. LTO and build parallelism are set per-arch in the
  # matrix below: workstation-1 (x86_64) has ample RAM and uses ThinLTO; the
  # sparks (aarch64) serve a resident model and have only a few GB free, so they
  # disable LTO and cap parallelism.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  RUST_BACKTRACE: "1"

jobs:
  build-package:
    name: Build and package ${{ matrix.target }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner_arch: X64
            runner_label: workstation-1
            # ~228 GB free; ThinLTO links comfortably.
            release_lto: "thin"
            cargo_jobs: "8"
            # Build inside Debian 12 (glibc 2.36) so the published artifact
            # runs on the oldest supported x86_64 host (Synology DSM ships
            # glibc 2.36; newer hosts are forward compatible). Building
            # natively on the Ubuntu 24.04 runner links glibc 2.38/2.39
            # symbols and the artifact fails on DSM — see #572.
            container_image: rust:1-bookworm
            glibc_baseline: "2.36"
          - target: aarch64-unknown-linux-gnu
            runner_arch: ARM64
            runner_label: spark
            # spark-1/2 serve the resident d4f vLLM model in unified memory,
            # leaving only ~7-9 GB free. Disable LTO and cap parallelism so the
            # link fits. Cross-compiling on workstation-1 is the tracked
            # long-term fix (see the build-flavors epic).
            release_lto: "off"
            cargo_jobs: "2"
            container_image: ""
            glibc_baseline: ""
    runs-on:
      - self-hosted
      - Linux
      - ${{ matrix.runner_arch }}
      - ${{ matrix.runner_label }}
    container: ${{ matrix.container_image }}
    defaults:
      run:
        # Inside a job container the runner defaults `run:` steps to `sh`
        # (dash on Debian), which rejects `set -o pipefail`. Every script in
        # this job assumes bash; say so explicitly.
        shell: bash

    env:
      GIT_CONFIG_GLOBAL: /tmp/defra-agent-release-${{ github.run_id }}-${{ matrix.target }}.gitconfig
      TARGET_TRIPLE: ${{ matrix.target }}
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.release_lto }}
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rewrite Git SSH dependencies to HTTPS
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_REPO_PAT}" ]]; then
            echo "::error::Missing PRIVATE_REPO_PAT; required to fetch private Source Network git dependencies."
            exit 1
          fi
          auth_url="https://x-access-token:${PRIVATE_REPO_PAT}@github.com/sourcenetwork/"
          git config --global --add url."${auth_url}".insteadOf "https://github.com/sourcenetwork/"
          git config --global --add url."${auth_url}".insteadOf "ssh://git@github.com/sourcenetwork/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          SUDO="sudo"
          if [[ "$(id -u)" == "0" ]]; then
            SUDO=""
          fi
          ${SUDO} apt-get update
          ${SUDO} apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler
          protoc --version

      - name: Build release binary
        run: |
          set -euo pipefail
          rustc -Vv
          host_triple="$(rustc -Vv | awk '/^host:/ { print $2 }')"
          if [[ "${host_triple}" != "${TARGET_TRIPLE}" ]]; then
            echo "::error::Expected native ${TARGET_TRIPLE} runner, got ${host_triple}."
            exit 1
          fi
          make release-cli
          file target/release/defra-agent

      - name: Verify binary
        run: |
          set -euo pipefail
          binary_path="target/release/defra-agent"
          version_output="$("${binary_path}" version)"
          printf '%s\n' "${version_output}"
          if [[ -z "${version_output}" ]]; then
            echo "::error::defra-agent version produced no output."
            exit 1
          fi

      - name: Verify release symbols
        run: .github/scripts/verify-release-symbols.sh target/release/defra-agent

      - name: Verify glibc baseline
        if: matrix.glibc_baseline != ''
        env:
          GLIBC_BASELINE: ${{ matrix.glibc_baseline }}
        run: |
          set -euo pipefail
          binary_path="target/release/defra-agent"
          required="$(objdump -T "${binary_path}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBC_//' | sort -Vu | tail -1)"
          echo "max required glibc: ${required} (baseline: ${GLIBC_BASELINE})"
          newest="$(printf '%s\n%s\n' "${GLIBC_BASELINE}" "${required}" | sort -V | tail -1)"
          if [[ "${newest}" != "${GLIBC_BASELINE}" ]]; then
            echo "::error::Binary requires glibc ${required}, newer than the ${GLIBC_BASELINE} baseline. It will not run on Synology DSM hosts (#572)."
            exit 1
          fi

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail

          artifact_basename="defra-agent-${TARGET_TRIPLE}"
          dist_dir="${RUNNER_TEMP}/dist"
          rm -rf "${dist_dir}"

          make dist-cli DIST_DIR="${dist_dir}"

          tarball="${dist_dir}/${artifact_basename}.tar.gz"
          checksum_file="${tarball}.sha256"
          echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"
          echo "checksum_file=${checksum_file}" >> "${GITHUB_OUTPUT}"
          echo "artifact_basename=${artifact_basename}" >> "${GITHUB_OUTPUT}"
          ls -lh "${dist_dir}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_basename }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum_file }}
          if-no-files-found: error

      - name: Cleanup git auth
        if: always()
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git config --global --remove-section "url.https://x-access-token:${PRIVATE_REPO_PAT:-}@github.com/sourcenetwork/" 2>/dev/null || true
          git config --global --remove-section "url.https://${PRIVATE_REPO_PAT:-}@github.com/sourcenetwork/" 2>/dev/null || true
          rm -f "${GIT_CONFIG_GLOBAL}"

  # Runs on the host (not in the build container) because it needs the gh CLI,
  # which the rust:1-bookworm build container does not ship.
  attach-release:
    name: Attach artifacts to GitHub Release
    # not `success()`: attach whatever legs produced artifacts even when the
    # other matrix leg failed, matching the old per-leg attach behavior.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build-package
    timeout-minutes: 15
    runs-on:
      - self-hosted
      - Linux
      - X64
      - workstation-1

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ls -lh dist

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "defra-agent release artifacts." \
              || gh release view "${GITHUB_REF_NAME}" >/dev/null
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
