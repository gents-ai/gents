name: Release Linux gents

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without the v prefix; must match workspace.package.version.
        required: true
        type: string
        default: "0.11.0"

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Explicit provenance avoids checkout metadata invalidating the final CLI
  # crate when a trusted release job retries the same commit.
  GENTS_BUILD_GIT_SHA: ${{ github.sha }}
  GENTS_BUILD_GIT_REF: ${{ github.ref }}
  GENTS_BUILD_GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  GENTS_BUILD_GIT_DIRTY: "false"
  # Keep the workspace's no-LTO/16-CGU release shape explicit on Linux. Cargo
  # parallelism remains per architecture: workstation-1 (x86_64) has ample
  # RAM, while the sparks (aarch64) serve a resident model and need a low cap.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  RUST_BACKTRACE: "1"

jobs:
  build-package:
    name: Build and package ${{ matrix.target }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner_arch: X64
            runner_label: workstation-1
            # ~228 GB free; use the fast workspace release shape.
            release_lto: "off"
            cargo_jobs: "8"
            # Build inside Debian 12 (glibc 2.36) so the published artifact
            # runs on the oldest supported x86_64 host (Synology DSM ships
            # glibc 2.36; newer hosts are forward compatible). Building
            # natively on the Ubuntu 24.04 runner links glibc 2.38/2.39
            # symbols and the artifact fails on DSM — see #572.
            container_image: rust:1-bookworm
            glibc_baseline: "2.36"
          - target: aarch64-unknown-linux-gnu
            runner_arch: ARM64
            runner_label: spark
            # spark-1/2 serve the resident d4f vLLM model in unified memory,
            # leaving only ~7-9 GB free. Disable LTO and cap parallelism so the
            # link fits. Cross-compiling on workstation-1 is the tracked
            # long-term fix (see the build-flavors epic).
            release_lto: "off"
            cargo_jobs: "2"
            container_image: ""
            glibc_baseline: ""
    runs-on:
      - self-hosted
      - Linux
      - ${{ matrix.runner_arch }}
      - ${{ matrix.runner_label }}
    container: ${{ matrix.container_image }}
    defaults:
      run:
        # Inside a job container the runner defaults `run:` steps to `sh`
        # (dash on Debian), which rejects `set -o pipefail`. Every script in
        # this job assumes bash; say so explicitly.
        shell: bash

    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.release_lto }}
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          workspace_version="$(awk '
            /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
            /^\[/ { in_workspace_package = 0 }
            in_workspace_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          if [[ -z "${workspace_version}" ]]; then
            echo "::error::Could not read workspace.package.version from Cargo.toml."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_tag="v${workspace_version}"
            if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
              echo "::error::Release tag ${GITHUB_REF_NAME} does not match workspace version ${expected_tag}."
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${RELEASE_VERSION_INPUT}" != "${workspace_version}" ]]; then
              echo "::error::Requested release version ${RELEASE_VERSION_INPUT} does not match workspace version ${workspace_version}."
              exit 1
            fi
          else
            echo "::error::Unsupported release trigger ${GITHUB_EVENT_NAME}."
            exit 1
          fi

          echo "RELEASE_VERSION=${workspace_version}" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          SUDO="sudo"
          if [[ "$(id -u)" == "0" ]]; then
            SUDO=""
          fi
          ${SUDO} apt-get update
          ${SUDO} apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler
          protoc --version

      - name: Build release binary
        run: |
          set -euo pipefail
          rustc -Vv
          host_triple="$(rustc -Vv | awk '/^host:/ { print $2 }')"
          if [[ "${host_triple}" != "${TARGET_TRIPLE}" ]]; then
            echo "::error::Expected native ${TARGET_TRIPLE} runner, got ${host_triple}."
            exit 1
          fi
          build_started_at="$(date +%s)"
          make release-cli
          echo "GENTS_RELEASE_BUILD_SECONDS=$(($(date +%s) - build_started_at))" >> "${GITHUB_ENV}"
          file target/release/gents

      - name: Verify binary
        run: |
          set -euo pipefail
          binary_path="target/release/gents"
          version_output="$("${binary_path}" version)"
          printf '%s\n' "${version_output}"
          expected_prefix="gents ${RELEASE_VERSION} ("
          if [[ "${version_output}" != "${expected_prefix}"* ]]; then
            echo "::error::gents version output does not start with '${expected_prefix}'."
            exit 1
          fi

      - name: Verify glibc baseline
        if: matrix.glibc_baseline != ''
        env:
          GLIBC_BASELINE: ${{ matrix.glibc_baseline }}
        run: |
          set -euo pipefail
          binary_path="target/release/gents"
          required="$(objdump -T "${binary_path}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBC_//' | sort -Vu | tail -1)"
          echo "max required glibc: ${required} (baseline: ${GLIBC_BASELINE})"
          newest="$(printf '%s\n%s\n' "${GLIBC_BASELINE}" "${required}" | sort -V | tail -1)"
          if [[ "${newest}" != "${GLIBC_BASELINE}" ]]; then
            echo "::error::Binary requires glibc ${required}, newer than the ${GLIBC_BASELINE} baseline. It will not run on Synology DSM hosts (#572)."
            exit 1
          fi

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail

          artifact_basename="gents-${TARGET_TRIPLE}"
          dist_dir="${RUNNER_TEMP}/dist"
          rm -rf "${dist_dir}"

          make dist-cli DIST_DIR="${dist_dir}"

          tarball="${dist_dir}/${artifact_basename}.tar.gz"
          checksum_file="${tarball}.sha256"
          {
            echo "tarball=${tarball}"
            echo "checksum_file=${checksum_file}"
            echo "artifact_basename=${artifact_basename}"
          } >> "${GITHUB_OUTPUT}"
          ls -lh "${dist_dir}"

      - name: Verify packaged artifact
        env:
          ARTIFACT_BASENAME: ${{ steps.package.outputs.artifact_basename }}
          CHECKSUM_FILE: ${{ steps.package.outputs.checksum_file }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail

          dist_dir="$(dirname "${TARBALL}")"
          (
            cd "${dist_dir}"
            sha256sum -c "$(basename "${CHECKSUM_FILE}")"
          )

          archive_files="$(tar -tzf "${TARBALL}" | sed '/\/$/d' | LC_ALL=C sort)"
          expected_binary="${ARTIFACT_BASENAME}/gents"
          expected_license="${ARTIFACT_BASENAME}/LICENSE"
          expected_files="$(printf '%s\n' "${expected_license}" "${expected_binary}")"
          if [[ "${archive_files}" != "${expected_files}" ]]; then
            echo "::error::Release archive must contain exactly ${expected_license} and ${expected_binary}; found:"
            printf '%s\n' "${archive_files}"
            exit 1
          fi

          verify_root="$(mktemp -d "${RUNNER_TEMP}/gents-linux-release-verify.XXXXXX")"
          trap 'rm -rf "${verify_root}"' EXIT
          tar -xzf "${TARBALL}" -C "${verify_root}"
          packaged_binary="${verify_root}/${expected_binary}"
          packaged_license="${verify_root}/${expected_license}"
          if [[ ! -x "${packaged_binary}" ]]; then
            echo "::error::Packaged Gents binary is missing or not executable."
            exit 1
          fi
          if ! cmp -s LICENSE "${packaged_license}"; then
            echo "::error::Packaged Apache-2.0 LICENSE is missing or differs from the repository LICENSE."
            exit 1
          fi

          version_output="$("${packaged_binary}" version)"
          printf '%s\n' "${version_output}"
          expected_prefix="gents ${RELEASE_VERSION} ("
          if [[ "${version_output}" != "${expected_prefix}"* ]]; then
            echo "::error::Packaged gents version output does not start with '${expected_prefix}'."
            exit 1
          fi

      - name: Measure release artifact
        id: measurement
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.tarball }}
          ARTIFACT_BASENAME: ${{ steps.package.outputs.artifact_basename }}
          SKIP_BUILD: "1"
        run: |
          set -euo pipefail
          metrics_file="$(dirname "${ARCHIVE_PATH}")/${ARTIFACT_BASENAME}.build-metrics.json"
          BUILD_ELAPSED_SECONDS="${GENTS_RELEASE_BUILD_SECONDS}" \
            OUTPUT_JSON="${metrics_file}" \
            scripts/measure-gents-binary.sh
          echo "metrics_file=${metrics_file}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_basename }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum_file }}
            ${{ steps.measurement.outputs.metrics_file }}
          if-no-files-found: error

  # Runs on the host (not in the build container) because it needs the gh CLI,
  # which the rust:1-bookworm build container does not ship.
  attach-release:
    name: Attach artifacts to GitHub Release
    # not `success()`: attach whatever legs produced artifacts even when the
    # other matrix leg failed, matching the old per-leg attach behavior.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build-package
    timeout-minutes: 15
    runs-on:
      - self-hosted
      - Linux
      - X64
      - workstation-1

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ls -lh dist

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "gents release artifacts." \
              || gh release view "${GITHUB_REF_NAME}" >/dev/null
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.build-metrics.json --clobber
