name: Live Engineer eval

# Engineer evals against the fleet's local model, scripts/evals/live_engineer_eval.py
# deciding each outcome and recording it in result.json: per case the trials,
# passes, pass rate with its 95% interval, tokens and tool calls per passing
# trial, and for the run the model, the Gents revision, the command-execution
# mode and the isolation. Sampling is the target's own.
#
# - Dispatch, scope `case` (default): one case on the shipped Engineer, run
#   unrestricted as `gents init --tool-package yolo` grants it, each trial in
#   its own container built from this commit (scripts/evals/run-container.sh).
# - Nightly, scope `suites`: every suite on the shipped Engineer, train and
#   validation, the same way. 2 trials per case at 8 at once: eight isolated
#   Engineer guests is the practical ceiling of one workstation, and two
#   trials of the suites' cases fit the deadline beside the runner's other
#   jobs. Raise trials by dispatch for tighter intervals.
# - Dispatch, scope `ladder`: L1-L5 and factory-setup on the configuration-only
#   Engineer, command execution off, embedded trials.
#
# Not a pull request gate. When the endpoint is unreachable or not serving the
# model, the job says so in its summary and ends green with a warning. The
# endpoint is the repository secret GENTS_CI_LIVE_MODEL_BASE_URL (a loopback
# URL on the inference host) and the model the variable GENTS_CI_LIVE_MODEL_NAME.
#
# The job runs on a `ci-inference` runner, on the inference host itself: the
# model listens there on loopback, a job container cannot reach the host
# (bridge-to-host traffic is dropped) and job containers cannot join the host
# network, so the eval's own containers reach the model through the launcher's
# relay. One runner runs one job at a time, and the concurrency group keeps
# eval runs from stacking.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: case (one case on the shipped Engineer), suites (every shipped-Engineer suite) or ladder (L1-L5 and factory-setup)
        required: true
        type: choice
        default: case
        options: [case, suites, ladder]
      trials:
        description: Trials per case
        required: true
        default: "1"
      concurrency:
        description: Trials at once (each contained trial is an isolated Engineer guest)
        required: true
        default: "8"
      min_pass_rate:
        description: Share of a case's trials that must pass the grader
        required: true
        default: "0.5"

permissions:
  contents: read

concurrency:
  group: live-engineer-eval
  cancel-in-progress: false

jobs:
  live-engineer-eval:
    name: Live Engineer eval (${{ inputs.scope || 'suites' }})
    runs-on: [self-hosted, Linux, X64, ci-inference]
    timeout-minutes: 300
    defaults:
      run:
        # core-packs runs on this runner in a root container and leaves
        # root-owned files in the workspace root; this host job checks out
        # beside them instead of cleaning them.
        working-directory: live-eval-src
    env:
      CARGO_BUILD_JOBS: "16"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_BACKTRACE: "1"
      RUST_MIN_STACK: "16777216"
      GENTS_CI_LIVE_MODEL_BASE_URL: ${{ secrets.GENTS_CI_LIVE_MODEL_BASE_URL }}
      GENTS_CI_LIVE_MODEL_NAME: ${{ vars.GENTS_CI_LIVE_MODEL_NAME || 'inkling-2-mini' }}
      LIVE_EVAL_SCOPE: ${{ inputs.scope || 'suites' }}
      LIVE_EVAL_TRIALS: ${{ inputs.trials || '2' }}
      LIVE_EVAL_CONCURRENCY: ${{ inputs.concurrency || '8' }}
      LIVE_EVAL_MIN_PASS_RATE: ${{ inputs.min_pass_rate || '0.5' }}
    steps:
      - name: Prepare job directories
        working-directory: ${{ runner.temp }}
        run: |
          # RUNNER_TEMP is not reliably emptied between jobs on this runner, so
          # each attempt gets its own directory and earlier ones are removed.
          dir="${RUNNER_TEMP}/live-eval-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          find "${RUNNER_TEMP}" -maxdepth 1 -name 'live-eval*' -exec rm -rf {} + || true
          {
            echo "JOB_STARTED=$(date +%s)"
            echo "LIVE_EVAL_DIR=${dir}"
            echo "LIVE_EVAL_OUT=${dir}/out"
            echo "CARGO_TARGET_DIR=${dir}/target"
            echo "LIVE_EVAL_CONTAINER_ROOT=/var/tmp/gents-live-eval-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_ENV}"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: live-eval-src

      - name: Check the model endpoint
        id: probe
        run: |
          set +e
          python3 scripts/evals/live_engineer_eval.py probe --out "${LIVE_EVAL_OUT}" --scope "${LIVE_EVAL_SCOPE}" \
            --trials "${LIVE_EVAL_TRIALS}" --concurrency "${LIVE_EVAL_CONCURRENCY}" --min-pass-rate "${LIVE_EVAL_MIN_PASS_RATE}"
          status=$?
          set -e
          if [[ "${status}" == 0 ]]; then
            echo "usable=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${status}" == 3 ]]; then
            echo "usable=false" >> "${GITHUB_OUTPUT}"
            reason="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["reason"])' "${LIVE_EVAL_OUT}/result.json")"
            echo "::warning title=Live Engineer eval skipped::${reason}"
          else
            exit "${status}"
          fi

      - name: Build the eval image
        if: steps.probe.outputs.usable == 'true' && env.LIVE_EVAL_SCOPE != 'ladder'
        run: |
          set -euo pipefail
          tag="gents-eval:$(git rev-parse --short=12 HEAD)"
          mkdir -p "${LIVE_EVAL_OUT}"
          if ! GENTS_EVAL_CONTAINER_HOST=local scripts/evals/run-container.sh image --tag "${tag}" >"${LIVE_EVAL_OUT}/image.log" 2>&1; then
            tail -n 80 "${LIVE_EVAL_OUT}/image.log"
            exit 1
          fi
          echo "LIVE_EVAL_IMAGE=${tag}" >> "${GITHUB_ENV}"

      - name: Select the Rust toolchain
        if: steps.probe.outputs.usable == 'true' && env.LIVE_EVAL_SCOPE == 'ladder'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null && [[ -x "${HOME}/.cargo/bin/rustup" ]]; then
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.cargo/bin:${PATH}"
          fi
          rustup show active-toolchain || rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          # The CLI build compiles a WebAssembly fixture; adds it to the runner account's toolchain once.
          rustup target add wasm32-unknown-unknown
          cargo --version

      - name: Build gents
        if: steps.probe.outputs.usable == 'true' && env.LIVE_EVAL_SCOPE == 'ladder'
        run: cargo build --locked --profile fast-dev -p gents-cli --bin gents -p gents-fs-runner --bin gents-fs-runner

      - name: Run the live Engineer eval
        if: steps.probe.outputs.usable == 'true'
        run: |
          set +e
          # The eval runs as the runner's host account: keep every default
          # path and the user service manager out of its reach.
          isolated="${LIVE_EVAL_DIR}/user"
          mkdir -p "${isolated}/config" "${isolated}/data" "${isolated}/state" "${isolated}/cache" "${isolated}/run"
          chmod 700 "${isolated}/run"
          env HOME="${isolated}" XDG_CONFIG_HOME="${isolated}/config" XDG_DATA_HOME="${isolated}/data" \
            XDG_STATE_HOME="${isolated}/state" XDG_CACHE_HOME="${isolated}/cache" XDG_RUNTIME_DIR="${isolated}/run" \
            DBUS_SESSION_BUS_ADDRESS= \
            python3 scripts/evals/live_engineer_eval.py run --scope "${LIVE_EVAL_SCOPE}" --out "${LIVE_EVAL_OUT}" \
              --gents "${CARGO_TARGET_DIR}/fast-dev/gents" --image "${LIVE_EVAL_IMAGE:-}" \
              --container-root "${LIVE_EVAL_CONTAINER_ROOT}" --home "${LIVE_EVAL_DIR}/home" \
              --trials "${LIVE_EVAL_TRIALS}" --concurrency "${LIVE_EVAL_CONCURRENCY}" \
              --min-pass-rate "${LIVE_EVAL_MIN_PASS_RATE}" \
              --job-started "${JOB_STARTED}"
          status=$?
          set -e
          reason="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["reason"])' "${LIVE_EVAL_OUT}/result.json" 2>/dev/null || echo "no result.json; see the step log")"
          if [[ "${status}" == 3 ]]; then
            echo "::warning title=Live Engineer eval skipped::${reason}"
          elif [[ "${status}" != 0 ]]; then
            echo "::error title=Live Engineer eval failed::${reason}"
            exit 1
          fi

      - name: Write the job summary
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          if [[ -f "${LIVE_EVAL_OUT}/summary.md" ]]; then
            cat "${LIVE_EVAL_OUT}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "## Live Engineer eval: no result (the job stopped before the eval reported; see the step logs)" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload the result and transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-engineer-eval-${{ env.LIVE_EVAL_SCOPE }}
          path: ${{ env.LIVE_EVAL_OUT }}
          if-no-files-found: ignore
          retention-days: 14
