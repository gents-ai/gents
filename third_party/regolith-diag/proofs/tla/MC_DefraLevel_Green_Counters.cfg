\* DefraLevel on the counter alone: two blind increments, a read-merger, a
\* rebase that puts the counter and merges into it in one batch, and a
\* reset, in every interleaving. The counter always holds what its
\* contract says (INV_CounterExact), every receipt is the count its merge
\* produced (INV_ReceiptsExact), and a blind increment is refused only when a
\* put, delete or range delete committed after it began
\* (INV_IncrementsCommitUnlessReplaced). The read-merger and the rebase merge
\* into keys the blind-merge path must not claim; Red_ReadMergeBlind and
\* Red_PutMergeBlind break exactly that.
\* Every abort names a key and a newer write that decides it (INV_ReasonsExact).
\*
\* SHRUNK to finish well inside a minute on one TLC worker: the range delete
\* left this run (132,517 states, 39 seconds, and past the two-minute limit
\* on a busy machine; now about 13 thousand). MC_DefraLevel_Green_Counters_Clear
\* runs the range delete beside the increments, the read-merger and the
\* reset. What no run holds any more is the rebase and the range delete in
\* one behaviour; every other pair of these writers still meets in one of
\* the two, and Red_RangeDeleteNotReplacement still runs all of them.
\*
\* The runs checked: every run that starts in Init and takes steps of Next, never stalling for ever
\* while a step is possible.
SPECIFICATION Spec
\* Spend the states on the counter workload: the appenders, the pruner, the writer, the patcher, the
\* mergers and the migrators never begin.
CONSTRAINT CounterWorkloadOnly
\* A run that stops because nothing is left to do is fine, not an error.
CHECK_DEADLOCK FALSE
\* The fixed inputs of this run: the sizes, and which code (the real one or a planted bug) is
\* checked.
CONSTANTS
  \* Transaction 1 appends one block (the id is also the block's id).
  Appenders = {1}
  \* Block 0 is the head that exists before anything runs.
  Seed = 0
  \* Transaction 4 is the pruner, which sweeps superseded head keys.
  Pruner = 4
  \* Transaction 5 is the writer, which reads the definition and writes a document from it.
  Writer = 5
  \* Transaction 6 is the patcher, which replaces the definition.
  Patcher = 6
  \* No transaction applies a remote block.
  Mergers = {}
  \* The remote block's id is 9.
  Remote = 9
  \* The remote block names no parent (unused when no merger runs).
  RemoteParents = {}
  \* Transactions 7 and 8 each merge an increment into the counter without reading it.
  Incrementers = {7, 8}
  \* Transaction 11 reads the counter, then merges an increment into it.
  ReadMergers = {11}
  \* Transaction 12 puts the counter to 1 and merges an increment on top, in one commit.
  Rebasers = {12}
  \* Transaction 10 deletes the counter.
  Resetters = {10}
  \* No range delete here: see SHRUNK above.
  Clearers = {}
  \* No transaction migrates the definition.
  Migrators = {}
  \* None of the later workloads runs.
  Extras <- NoExtras
  \* The caller declares the head range and the marker range commutative
  \* (KeyClass::CommutativePrefix): a scan stretch that stays inside one of them records nothing.
  CommutativeRanges = {1, 2}
  \* The caller declares no key range content-addressed.
  ContentAddressedRanges = {}
  \* Every transaction runs at DefraLevel: RepeatableRead with the relaxations the caller declares.
  Level = "DefraLevel"
  \* No planted bug: the commit rule as the engine has it.
  Mutant = "none"
\* Checked in every state: every variable holds the kind of value its comment says.
INVARIANT TypeOK
\* Checked in every state: the counter holds exactly what its contract says: no increment lost, none
\* counted twice, and a reset really resets.
INVARIANT INV_CounterExact
\* Checked in every state: every read-merger's receipt is the count its own merge produced.
INVARIANT INV_ReceiptsExact
\* Checked in every state: a blind increment is refused only when a put, delete or range delete of
\* the counter committed after it began.
INVARIANT INV_IncrementsCommitUnlessReplaced
\* Checked in every state: every abort's reason names a key the transaction really used that way and
\* a newer write that could decide the race.
INVARIANT INV_ReasonsExact
