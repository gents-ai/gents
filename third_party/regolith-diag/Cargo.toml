[dependencies.aes-gcm-siv]
version = "0.12"
features = [
    "aes",
    "zeroize",
]
default-features = false

[dependencies.getrandom]
version = "0.4"

[dependencies.kovan]
version = "0.2.5"

[dependencies.kovan-channel]
version = "0.2.5"

[dependencies.kovan-map]
version = "0.2.5"

[dependencies.kovan-queue]
version = "0.2.5"

[dependencies.lz4_flex]
version = "0.11"

[dependencies.portable-atomic]
version = "1"
features = [
    "fallback",
    "require-cas",
]
default-features = false

[dependencies.snap]
version = "1"

[dependencies.thiserror]
version = "1.0"

[dependencies.tracing]
version = "0.1"

[dependencies.xxhash-rust]
version = "0.8"
features = ["xxh3"]

[dependencies.zeroize]
version = "1"

[dev-dependencies.tempfile]
version = "3.8"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.js-sys]
version = "0.3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.wasm-bindgen-futures]
version = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.js-sys]
version = "0.3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[target.'cfg(any(unix, target_os = "wasi"))'.dependencies.rustix]
version = "1.1"
features = ["fs"]

[target."cfg(loom)".dependencies.loom]
version = "0.7"

[target."cfg(loom)".dev-dependencies.loom]
version = "0.7"

[target.'cfg(not(target_family = "wasm"))'.dependencies.proptest]
version = "1"
optional = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.criterion]
version = "0.5"
features = ["html_reports"]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.proptest]
version = "1"

[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "linux")'.dev-dependencies.libc]
version = "0.2"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(loom)"]

[profile.bench]
opt-level = 3

[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
