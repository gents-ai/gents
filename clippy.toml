# Pin Clippy's default complexity thresholds so a toolchain bump cannot loosen
# the `-D warnings` gate silently (as DefraDB does). Fix flagged code; do not
# raise these to admit it.
cognitive-complexity-threshold = 25
type-complexity-threshold = 250

# Never block a runtime thread. Each remaining use carries a reasoned
# `#[expect(clippy::disallowed_methods, reason = "...")]` and sits off the
# runtime workers; `Runtime::block_on` stays for entry points and dedicated
# threads.
disallowed-methods = [
    { path = "std::thread::sleep", reason = "await tokio::time::sleep or the owner's notification" },
    { path = "tokio::runtime::Handle::block_on", reason = "await the future; drive non-Send embedded-node futures through store::local::storage_backend::drive_unsendable" },
    { path = "tokio::task::block_in_place", reason = "run synchronous work on spawn_blocking" },
    { path = "futures::executor::block_on", reason = "await the future" },
    { path = "tauri::async_runtime::block_on", reason = "await the future" },
    # One runtime per process: take its handle from the caller. A drop guard
    # binds its runtime with `gents::runtime::drop_cleanup::DropCleanup::current`.
    { path = "tokio::runtime::Handle::current", reason = "take the runtime handle from the caller, or DropCleanup::current in a drop guard" },
    { path = "tokio::runtime::Handle::try_current", reason = "take the runtime handle from the caller, or DropCleanup::current in a drop guard" },
]
