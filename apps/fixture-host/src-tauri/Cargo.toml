[package]
name = "gents-fixture-host"
default-run = "gents-fixture-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal downstream host proving reusable desktop package composition"

[lib]
name = "gents_fixture_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs.workspace = true
fixture-domain-plugin = { path = "../../../crates/fixture-domain-plugin" }
gents-desktop-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio.workspace = true
tracing.workspace = true
