[package]
name = "gents-fixture-host"
default-run = "gents-fixture-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal downstream host proving reusable desktop package composition"

[lib]
name = "gents_fixture_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs.workspace = true
fixture-domain-plugin = { path = "../../../crates/fixture-domain-plugin" }
gents-desktop-bridge.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"

[dev-dependencies]
gents-eval = { workspace = true, features = ["test-fixtures"] }
gents-host = { workspace = true, features = ["test-fixtures"] }
gents-service = { workspace = true, features = ["test-home-guard"] }
gents-desktop-core = { workspace = true, features = ["test-fixtures", "typescript"] }
gents = { path = "../../../crates/gents", features = ["test-fixtures", "typescript"] }
gents-workspace-hack = { workspace = true }
