[package]
name = "defra-agent-desktop-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri desktop shell for defra-agent"

[lib]
name = "defra_agent_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
blake3 = "1"
defra-agent = { path = "../../../crates/defra-agent" }
defra-agent-desktop-core.workspace = true
defra-agent-protocol = { path = "../../../crates/defra-agent-protocol" }
reqwest.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
rig-core.workspace = true
