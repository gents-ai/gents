[package]
name = "gents-desktop-tauri"
default-run = "gents-desktop-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri desktop shell for Gents"

[lib]
name = "gents_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
gents = { path = "../../../crates/gents" }
gents-fs-runner = { path = "../../../crates/gents-fs-runner" }
gents-desktop-bridge = { workspace = true }
gents-desktop-core.workspace = true
gents-protocol = { path = "../../../crates/gents-protocol" }
reqwest.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Production and mobile Tauri builds explicitly enable custom-protocol so the
# bundled frontend is served from tauri://localhost. Keep it opt-in so ordinary
# workspace checks do not require a prebuilt frontendDist directory.
default = []
custom-protocol = ["tauri/custom-protocol"]
# Forwards to the bridge; E2E launchers pass --features native-e2e.
native-e2e = ["gents-desktop-bridge/native-e2e"]

[dev-dependencies]
axum = "0.8"
