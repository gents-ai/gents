[package]
name = "gents-desktop-tauri"
default-run = "gents-desktop-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri desktop shell for Gents"

[lib]
name = "gents_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
gents = { path = "../../../crates/gents" }
gents-desktop-bridge = { workspace = true }
gents-desktop-core.workspace = true
gents-protocol = { path = "../../../crates/gents-protocol" }
reqwest.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# custom-protocol embeds frontendDist and serves tauri://localhost.
# Without it Tauri sets cfg(dev) and the mobile shell tries to load devUrl
# (http://localhost:1420), which fails on device with a Local Network error.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Forwards to the bridge; E2E launchers pass --features native-e2e.
native-e2e = ["gents-desktop-bridge/native-e2e"]

[dev-dependencies]
axum = "0.8"
